{id:549,category:"代名詞",sentence:"The two companies finally reached an agreement that satisfied both parties.",choices:["each","every","both","all"],answer:2,
 point:"2者を指して「両方とも」という意味を表す代名詞は both です。",
 notes:["each は「それぞれ」という意味だが、通常は each of the parties のように使い、この位置にはやや不自然。","every は形容詞的に単数名詞の前で使い、parties という複数形とは組み合わせない。","both は2者を指して「両方とも」を正しく表す。","all は3つ以上のものに使うのが原則で、two companies という2者を指すこの文脈には both が適切。"]},

{id:550,category:"代名詞",sentence:"The workshop was open to all staff, and those who attended received a certificate.",choices:["them","they","those","that"],answer:2,
 point:"「those who ～（～する人々）」は不特定の人々を指す定型表現です。",
 notes:["them は目的格代名詞で、主語の位置には使えない。","they は主格代名詞だが、関係詞節 who attended を伴う場合は those who の形が定型として使われる。","those は「those who ～」の形で「～する人々」を正しく表す。","that は単数の指示代名詞で、複数の人々を指すこの文脈には合わない。"]},

{id:551,category:"代名詞",sentence:"The budget report contains several errors; these must be corrected before submission.",choices:["this","it","these","that"],answer:2,
 point:"複数名詞 errors を受ける指示代名詞は these です。",
 notes:["this は単数の指示代名詞で、複数の errors には合わない。","it は単数の代名詞で、複数の errors には合わない。","these は複数の指示代名詞で、errors を正しく受ける。","that は単数の指示代名詞で、複数の errors には合わない。"]},

{id:552,category:"代名詞",sentence:"The finance team reviewed both contracts separately and found each to be legally sound in its own right.",choices:["it","them","each","all"],answer:2,
 point:"「in its own right（それ自体として）」という単数表現に対応させるため、個別に扱う each を使います。",
 notes:["it は単数の代名詞だが、two contracts を個別に指すには each が適切。","them は複数の代名詞で、in its own right という単数の表現とは一致しない。","each は「それぞれ」という個別の視点を正しく表し、its own right と対応する。","all は全体をまとめて指す代名詞で、個別性を示す in its own right とは合わない。"]},

{id:553,category:"代名詞",sentence:"The first shipment was damaged, so the supplier sent another at no extra charge.",choices:["other","others","another","the other"],answer:2,
 point:"「もう一つの・別の」という不特定の単数を表す代名詞は another です。",
 notes:["other は単独で代名詞として使えず、the other や another の形にする必要がある。","others は複数を表す代名詞で、単数の代替品を指すこの文脈には合わない。","another は「もう一つの・別の」という不特定の単数を正しく表す。","the other は2つのうち特定の残り一つを指す表現で、この文脈の「新しい別の一つ」には合わない。"]},

{id:554,category:"代名詞",sentence:"Of the two finalists, one impressed the panel more than the other.",choices:["another","others","the other","other"],answer:2,
 point:"2つのうち特定の残り一つを指す代名詞は the other です。",
 notes:["another は不特定の「もう一つ」を表し、2つのうちの特定の残りを指すこの文脈には合わない。","others は複数を表す代名詞で、2つのうちの1つを指すこの文脈には合わない。","the other は「（2つのうち）もう一方」という特定の残り一つを正しく表す。","other は単独で代名詞として使えない。"]},

{id:555,category:"代名詞",sentence:"The committee reviewed dozens of applications, but few met all the criteria for advancement.",choices:["a few","much","few","little"],answer:2,
 point:"「few（ほとんど～ない）」は数えられる名詞に対して否定的な意味を表します。",
 notes:["a few は「いくらかの」という肯定的な意味で、but に続く逆接の否定文脈にはやや合わない。","much は数えられない名詞に使う語で、複数形の applications には合わない。","few は「ほとんど～ない」という否定的な意味を正しく表す。","little は数えられない名詞に使う語で、複数形の applications には合わない。"]},

{id:556,category:"代名詞",sentence:"The two branch managers disagreed on the marketing plan, so they decided to consult a third party.",choices:["them","their","they","themselves"],answer:2,
 point:"文の主語の位置に置く代名詞は主格です。",
 notes:["them は目的格代名詞で、主語の位置には使えない。","their は所有格代名詞で、後ろに名詞を必要とし、動詞 decided の主語にはなれない。","they は主格代名詞で、decided の主語として正しく機能する。","themselves は再帰代名詞で、動詞の主語としては使わない。"]},

{id:557,category:"態",sentence:"The annual budget is reviewed by the finance committee every January.",choices:["reviews","reviewing","is reviewed","review"],answer:2,
 point:"主語 the annual budget は「見直される」対象であるため、受動態を使います。",
 notes:["reviews は能動態の現在形で、主語が「見直す」意味になり、budget が主語であるこの文脈には合わない。","reviewing は分詞・動名詞で、単独では述語動詞として機能しない。","is reviewed は受動態の現在形で、「予算が見直される」という意味を正しく表す。","review は動詞の原形で、主語 budget（三人称単数）と一致しない。"]},

{id:558,category:"態",sentence:"New software updates are installed automatically every Sunday night.",choices:["install","installing","are installed","installs"],answer:2,
 point:"主語 new software updates は「インストールされる」対象であるため、受動態を使います。",
 notes:["install は能動態の原形で、複数主語であっても意味上「更新プログラムがインストールする」となり不自然。","installing は分詞・動名詞で、単独では述語動詞として機能しない。","are installed は受動態の現在形で、「更新プログラムがインストールされる」という意味を正しく表す。","installs は三人称単数の能動態で、複数主語 updates と数が一致しない。"]},

{id:559,category:"態",sentence:"The contract must be signed by both parties before the project can begin.",choices:["must sign","must signing","must be signed","must have signed"],answer:2,
 point:"主語 the contract は「署名される」対象であるため、助動詞の後ろに受動態（be + 過去分詞）を続けます。",
 notes:["must sign は能動態で、契約書自身が署名する意味になり不自然。","must signing は文法的に誤った形（助動詞の後は動詞の原形が必要）。","must be signed は受動態で、「契約書が署名されなければならない」という意味を正しく表す。","must have signed は完了形の能動態で、「署名し終えたに違いない」という推量の意味になり、この文脈には合わない。"]},

{id:560,category:"態",sentence:"The recommendations are being reviewed carefully by the review board before the final report is released next week.",choices:["review","are reviewing","are being reviewed","have reviewed"],answer:2,
 point:"主語 the recommendations は「見直されている」対象であるため、進行形の受動態（be being + 過去分詞）を使います。",
 notes:["review は能動態の原形で、主語 recommendations と一致せず、意味上も不自然。","are reviewing は能動態の進行形で、「提言自身が見直している」という意味になり不自然。","are being reviewed は進行形の受動態で、「現在見直されている最中である」という意味を正しく表す。","have reviewed は能動態の現在完了で、この文脈の主語には合わない。"]},

{id:561,category:"態",sentence:"By the time the auditors arrive, all financial records will have been organized.",choices:["will organize","will have organized","will have been organized","are organizing"],answer:2,
 point:"主語 all financial records は「整理される」対象であるため、未来完了の受動態（will have been + 過去分詞）を使います。",
 notes:["will organize は能動態の未来形で、記録自身が整理する意味になり不自然。","will have organized は能動態の未来完了形で、この文脈の主語には合わない。","will have been organized は未来完了の受動態で、「（監査人が到着するまでに）整理され終えているだろう」という意味を正しく表す。","are organizing は能動態の現在進行形で、未来完了の意味を表せない。"]},

{id:562,category:"態",sentence:"The equipment is maintained regularly to prevent unexpected breakdowns.",choices:["maintains","maintaining","is maintained","maintain"],answer:2,
 point:"主語 the equipment は「整備される」対象であるため、受動態を使います。",
 notes:["maintains は能動態の現在形で、設備自身が整備する意味になり不自然。","maintaining は分詞・動名詞で、単独では述語動詞として機能しない。","is maintained は受動態の現在形で、「設備が定期的に整備される」という意味を正しく表す。","maintain は動詞の原形で、主語 equipment（三人称単数）と一致しない。"]},

{id:563,category:"態",sentence:"The CEO decided to have the entire office renovated before the shareholders' visit.",choices:["renovate","renovating","renovated","renovates"],answer:2,
 point:"「have + 目的語 + 過去分詞」は、他者に何かをしてもらう使役の受動を表します。",
 notes:["renovate は動詞の原形で、have + O + 原形の形は「Oに～させる」という別の使役表現になり、ここでは office が「改装される」側なので過去分詞が必要。","renovating は現在分詞で、have + O + 現在分詞は「Oが～している状態にする」という意味になり、この文脈には合わない。","renovated は過去分詞で、have the office renovated（オフィスを改装してもらう）という使役受動を正しく表す。","renovates は定形動詞で、have の後ろの補語の位置には使えない。"]},

{id:564,category:"態",sentence:"The manager got the printer fixed just in time for the presentation.",choices:["fix","fixing","fixed","fixes"],answer:2,
 point:"「get + 目的語 + 過去分詞」は、他者に何かをしてもらう使役の受動を表します。",
 notes:["fix は動詞の原形で、get + O + 過去分詞の形にはならない。","fixing は現在分詞で、get + O + 現在分詞は異なる意味になり、この文脈には合わない。","fixed は過去分詞で、get the printer fixed（プリンターを直してもらう）という使役受動を正しく表す。","fixes は定形動詞で、get の後ろの補語の位置には使えない。"]},

{id:565,category:"態",sentence:"The proposal was received favorably by all committee members after a lengthy discussion.",choices:["received","receiving","was received","receives"],answer:2,
 point:"主語 the proposal は「受け取られる」対象であるため、受動態を使います。",
 notes:["received は能動態の過去形で、提案自身が受け取る意味になり不自然。","receiving は分詞・動名詞で、単独では述語動詞として機能しない。","was received は受動態の過去形で、「提案が好意的に受け入れられた」という意味を正しく表す。","receives は能動態の現在形で、主語 proposal と一致せず、時制も文脈に合わない。"]},

{id:566,category:"態",sentence:"Complaints about the delayed shipment should be directed to the customer service department.",choices:["should direct","should directing","should be directed","should have direct"],answer:2,
 point:"主語 complaints は「向けられる」対象であるため、助動詞の後ろに受動態（be + 過去分詞）を続けます。",
 notes:["should direct は能動態で、苦情自身が向ける意味になり不自然。","should directing は文法的に誤った形（助動詞の後は動詞の原形が必要）。","should be directed は受動態で、「苦情はカスタマーサービス部門に向けられるべきだ」という意味を正しく表す。","should have direct は文法的に誤った形。"]},

{id:567,category:"態",sentence:"The new safety guidelines were distributed to all warehouse staff last Monday.",choices:["distributed","distributing","were distributed","distribute"],answer:2,
 point:"主語 the new safety guidelines は「配布される」対象であるため、受動態を使います。",
 notes:["distributed は能動態の過去形で、指針自身が配布する意味になり不自然。","distributing は分詞・動名詞で、単独では述語動詞として機能しない。","were distributed は受動態の過去形で、「指針が配布された」という意味を正しく表す。","distribute は動詞の原形で、複数主語であっても能動態では意味が不自然。"]},

{id:568,category:"態",sentence:"The proposal is currently being reviewed by the legal department.",choices:["been","be","being","was"],answer:2,
 point:"現在進行形の受動態は「is/am/are + being + 過去分詞」の形を使います。",
 notes:["been は過去分詞で、be動詞の後ろに being なしで直接置くと現在完了形になり、この文脈には合わない。","be は動詞の原形で、is の後ろにそのまま続けることはできない。","being は現在進行形の受動態を作る語で、is being reviewed と正しく対応する。","was は過去形の be動詞で、is と重複し文法的に成立しない。"]},

{id:569,category:"態",sentence:"The malfunction could have been prevented if the equipment had been inspected regularly.",choices:["can","will","could","must"],answer:2,
 point:"過去の事実に反する仮定の帰結として「～できただろうに（実際はできなかった）」を表す場合は could have + 過去分詞を使います。",
 notes:["can は現在の能力・可能性を表し、過去の仮定の帰結には使わない。","will は未来を表し、過去の仮定の帰結には使わない。","could は could have been prevented の形で、過去の事実に反する仮定の帰結を正しく表す。","must は「～に違いない」という推量を表し、この仮定文の帰結には合わない。"]},

{id:570,category:"態",sentence:"All visitors must be escorted by security personnel while inside the research facility.",choices:["must","must have","must be","must having"],answer:2,
 point:"主語 all visitors は「同行される」対象であるため、助動詞の後ろに受動態（be + 過去分詞）を続けます。",
 notes:["must は後ろに動詞の原形が必要で、単独では述語として不完全。","must have は後ろに過去分詞が必要で、完了形の意味になり、この文脈には合わない。","must be は escorted と組み合わさり、受動態「同行されなければならない」を正しく表す。","must having は文法的に誤った形。"]},

{id:571,category:"態",sentence:"The findings of the study will be published in a leading medical journal next month.",choices:["will","are going","will be","have been"],answer:2,
 point:"主語 the findings は「発表される」対象であるため、未来の受動態（will be + 過去分詞）を使います。",
 notes:["will は後ろに動詞の原形が必要で、単独では述語として不完全。","are going は be going to の形にする必要があり、この位置では不完全。","will be は published と組み合わさり、未来の受動態を正しく表す。","have been は現在完了の受動態を作るが、next month という未来の時を示す語句とは合わない。"]},

{id:572,category:"態",sentence:"The building will be renovated extensively before it reopens to the public next spring.",choices:["will renovate","is renovating","will be renovated","has renovated"],answer:2,
 point:"主語 the building は「改装される」対象であるため、未来の受動態（will be + 過去分詞）を使います。",
 notes:["will renovate は能動態で、建物自身が改装する意味になり不自然。","is renovating は能動態の現在進行形で、未来の受動の意味を表せない。","will be renovated は未来の受動態で、「建物が改装される予定だ」という意味を正しく表す。","has renovated は能動態の現在完了で、この文脈の主語には合わない。"]},

{id:573,category:"態",sentence:"The parcel was delivered to the wrong address due to a clerical error.",choices:["has","is","was","had"],answer:2,
 point:"主語 the parcel は「配達される」対象であり、過去の一回限りの出来事のため、過去の受動態（was + 過去分詞）を使います。",
 notes:["has は現在完了を作る助動詞で、過去の一時点を示すこの文脈には合わない。","is は現在形の受動態を作るが、過去の出来事を表すこの文脈には合わない。","was は過去形の受動態を作り、delivered と組み合わさって正しく過去の出来事を表す。","had は過去完了を作る助動詞で、この単純な過去の出来事にはやや不自然。"]},

{id:574,category:"態",sentence:"All employee records are kept confidential in accordance with company policy.",choices:["keep","keeping","are kept","kept"],answer:2,
 point:"主語 all employee records は「保管される」対象であるため、受動態を使います。",
 notes:["keep は能動態の原形で、記録自身が保管する意味になり不自然。","keeping は分詞・動名詞で、単独では述語動詞として機能しない。","are kept は受動態の現在形で、「記録は機密として保管される」という意味を正しく表す。","kept は過去形または過去分詞だが、be動詞なしでは受動態として成立しない。"]},

{id:575,category:"態",sentence:"The merger agreement will not be finalized until both legal teams complete their review.",choices:["will not","does not","will not be","has not"],answer:2,
 point:"主語 the merger agreement は「確定される」対象であるため、未来の否定の受動態（will not be + 過去分詞）を使います。",
 notes:["will not は後ろに動詞の原形が必要で、単独では述語として不完全。","does not は現在形の否定を作るが、未来の内容を表すこの文脈には合わない。","will not be は finalized と組み合わさり、未来の否定の受動態を正しく表す。","has not は現在完了の否定を作るが、未来の内容を表すこの文脈には合わない。"]},

{id:576,category:"態",sentence:"The new hires are being trained during their first two weeks by senior staff members.",choices:["train","are training","are being trained","have trained"],answer:2,
 point:"主語 the new hires は「研修を受けている」対象であるため、進行形の受動態（be being + 過去分詞）を使います。",
 notes:["train は能動態の原形で、新入社員自身が研修する意味になり不自然。","are training は能動態の進行形で、新入社員自身が研修している意味になり不自然。","are being trained は進行形の受動態で、「現在研修を受けている最中である」という意味を正しく表す。","have trained は能動態の現在完了で、この文脈の主語には合わない。"]},

{id:577,category:"態",sentence:"The vending machines in the break room are restocked once a week by an outside vendor.",choices:["restock","restocking","are restocked","restocks"],answer:2,
 point:"主語 the vending machines は「補充される」対象であるため、受動態を使います。",
 notes:["restock は能動態の原形で、自販機自身が補充する意味になり不自然。","restocking は分詞・動名詞で、単独では述語動詞として機能しない。","are restocked は受動態の現在形で、「自販機が定期的に補充される」という意味を正しく表す。","restocks は三人称単数の能動態で、複数主語 machines と数が一致しない。"]},

{id:578,category:"態",sentence:"Once the paperwork has been completed, the new employee can begin orientation.",choices:["completes","is completing","has been completed","complete"],answer:2,
 point:"主語 the paperwork は「完了させられる」対象であるため、受動態を使います。",
 notes:["completes は能動態の現在形で、書類自身が完了させる意味になり不自然。","is completing は能動態の現在進行形で、同様に不自然。","has been completed は現在完了の受動態で、「書類の記入が完了した」という意味を正しく表す。","complete は動詞の原形で、主語 paperwork（単数扱い）と一致しない。"]},

{id:579,category:"比較",sentence:"This year's conference attracted more attendees than last year's event.",choices:["much","many","more","most"],answer:2,
 point:"可算名詞 attendees の数を比較する場合、比較級 more を使います。",
 notes:["much は不可算名詞に使う語で、可算名詞 attendees には合わない。","many は原級で、than と組み合わせる比較級としては不適切。","more は many の比較級で、than last year's event と正しく対応する。","most は最上級で、2つの年を比較するこの文脈には合わない。"]},

{id:580,category:"比較",sentence:"Of all the candidates interviewed, she was by far the most qualified.",choices:["very","more","the most","most"],answer:2,
 point:"3人以上を比較して「その中で最も」という場合は最上級 the most を使います。",
 notes:["very は原級を強調する副詞で、最上級の文脈には合わない。","more は比較級で、of all the candidates という3人以上の比較には合わない。","the most は最上級で、by far に強調され、of all the candidates と正しく対応する。","most は定冠詞 the が抜けており、最上級としては不完全。"]},

{id:581,category:"比較",sentence:"The new engine is twice as efficient as the previous model, using 30 percent less fuel.",choices:["as","so","twice as","more"],answer:2,
 point:"「倍数＋as ～ as」で「～の何倍…」という比較を表します。",
 notes:["as だけでは as ～ as の原級比較にしかならず、倍数の意味を加えられない。","so は否定文の as ～ as の代わりに使われることがあるが、肯定文のこの倍数表現には合わない。","twice as は twice as ～ as の形で「2倍～」という倍数比較を正しく表す。","more は比較級を作るが、as ～ as の原級比較の構造には合わない。"]},

{id:582,category:"比較",sentence:"The greater the demand for a product, the higher its price tends to be.",choices:["great","greater","greatest","greatly"],answer:2,
 point:"「the + 比較級 ～, the + 比較級 …（～すればするほど…）」という相関表現です。",
 notes:["great は原級で、the + 比較級の構文には合わない。","greater は great の比較級で、the greater ～, the higher … という相関表現を正しく作る。","greatest は最上級で、この相関表現には合わない。","greatly は副詞で、the の後ろに続く比較級の位置には合わない。"]},

{id:583,category:"比較",sentence:"Customer feedback this quarter was far more positive than in previous quarters.",choices:["very","too","far more","most"],answer:2,
 point:"比較級を強調する副詞には far や much が使われ、very は比較級を直接強調できません。",
 notes:["very は原級を強調する副詞で、比較級 more positive を直接強調できない。","too は「～すぎる」という意味で、この文脈には合わない。","far more は比較級 more を正しく強調し、than と対応する。","most は最上級で、than を伴う2者の比較には使わない。"]},

{id:584,category:"比較",sentence:"This model costs less than the previous version but offers significantly better performance.",choices:["least","few","less","fewer"],answer:2,
 point:"数えられない名詞や金額のような一般的な量を比較する場合は less を使います。",
 notes:["least は最上級で、than を伴う2者の比較には使わない。","few は可算名詞の数の少なさを表し、費用という不可算的な概念にはあまり使わない。","less は little の比較級で、costs less than と正しく対応する。","fewer は可算名詞の比較に使う語で、金額を表すこの文脈には合わない。"]},

{id:585,category:"比較",sentence:"The company's profits this year are nearly as high as they were five years ago, despite the economic slowdown.",choices:["very","so","nearly","most"],answer:2,
 point:"「nearly as ～ as」で「ほぼ同じくらい～」という近似の比較を表します。",
 notes:["very は as ～ as の構文を直接修飾するには不自然。","so は否定文の as ～ as の代わりに使われることが多く、この肯定文には合わない。","nearly は as ～ as の前に置いて「ほぼ同程度」という近似を正しく表す。","most は最上級を作る語で、as ～ as の原級比較には合わない。"]},

{id:586,category:"比較",sentence:"Among the three finalists, candidate B has the least experience in project management.",choices:["less","little","the least","few"],answer:2,
 point:"3人以上を比較して「その中で最も少ない」という場合は最上級 the least を使います。",
 notes:["less は比較級で、among the three finalists という3人以上の比較には合わない。","little は原級で、最上級の文脈には合わない。","the least は little の最上級で、among the three finalists と正しく対応する。","few は可算名詞の数の少なさを表す語で、不可算名詞 experience には合わない。"]},

{id:587,category:"比較",sentence:"The revised proposal is considerably more detailed than the original draft.",choices:["considerable","considerably","consideration","considering"],answer:2,
 point:"比較級 more detailed を修飾する語は副詞です。",
 notes:["considerable は形容詞で、比較級を直接修飾できない。","considerably は副詞「かなり」で、more detailed を正しく修飾する。","consideration は名詞で、修飾語の位置には入らない。","considering は分詞・前置詞的用法で、この位置には合わない。"]},

{id:588,category:"比較",sentence:"No other supplier offers prices as competitive as ours.",choices:["so","than","as","like"],answer:2,
 point:"「No other ～ as … as」は「他のどの～も…ほど…ない」という最上級相当の意味を表す原級比較の構文です。",
 notes:["so は否定文でも使われることがあるが、この定型構文では as ～ as が一般的。","than は比較級とともに使う語で、この原級比較の構文には合わない。","as は as ～ as の形で「同じくらい」という原級比較を正しく表す。","like は前置詞で「～のように」という意味になり、この比較構文には合わない。"]},

{id:589,category:"比較",sentence:"The company's customer satisfaction ratings are among the highest in the industry.",choices:["very","more","among the","most"],answer:2,
 point:"「among the + 最上級」は「最も～なものの一つ」という意味を表す定型表現です。",
 notes:["very は原級を強調する副詞で、この最上級の定型表現には合わない。","more は比較級を作る語で、highest という最上級とは重複し不適切。","among the は among the highest の形で「最も高いものの一つ」という意味を正しく表す。","most は単独では最上級として不完全で、the が必要（かつ among も欠けている）。"]},

{id:590,category:"比較",sentence:"The two proposals are almost identical, but this one is slightly less expensive.",choices:["least","fewer","less","few"],answer:2,
 point:"形容詞 expensive の比較級として、less expensive で「より安い」を表します。",
 notes:["least は最上級で、2つのものを比較するこの文脈には合わない。","fewer は可算名詞の数の比較に使う語で、形容詞 expensive の比較には合わない。","less は形容詞の比較級を作り、less expensive で正しく「より安い」を表す。","few は可算名詞の少なさを表す語で、この文脈には合わない。"]},

{id:591,category:"比較",sentence:"The sooner the shipment arrives, the sooner the production schedule can resume.",choices:["soon","sooner","the sooner","soonest"],answer:2,
 point:"「the + 比較級 ～, the + 比較級 …（～すればするほど…）」という相関表現です。",
 notes:["soon は原級で、the + 比較級の構文には合わない。","sooner は比較級だが、定冠詞 the が抜けており、この相関構文としては不完全。","the sooner は the + 比較級の形で、the sooner ～ arrives, the sooner … can resume という相関表現を正しく作る。","soonest は最上級で、この相関表現には合わない。"]},

{id:592,category:"比較",sentence:"The renovated office space is far superior to the old location in terms of accessibility.",choices:["than","from","to","as"],answer:2,
 point:"superior, inferior, senior, junior などラテン語源の比較級は than ではなく to を使います。",
 notes:["than は通常の比較級で使う語だが、superior のようなラテン比較級には使わない。","from は「～由来」を表す前置詞で、この文脈には合わない。","to は superior to の形で「～より優れている」を正しく表す。","as は原級比較で使う語で、superior という比較級には合わない。"]},

{id:593,category:"比較",sentence:"This year's marketing budget is nearly three times as large as last year's.",choices:["three time","triple","three times","thirdly"],answer:2,
 point:"「倍数＋as ～ as」で「～の何倍…」という比較を表します。",
 notes:["three time は文法的に誤り（times と複数形にする必要がある）。","triple は動詞・形容詞として使われる語で、as ～ as の構文の倍数表現には合わない形。","three times は three times as large as の形で「3倍の大きさ」という倍数比較を正しく表す。","thirdly は「第三に」という順序を表す副詞で、この文脈には合わない。"]},

{id:594,category:"比較",sentence:"The latest smartphone model is much lighter than its predecessor, weighing just 150 grams.",choices:["very","too","much","so"],answer:2,
 point:"比較級を強調する副詞には much や far が使われ、very は比較級を直接強調できません。",
 notes:["very は原級を強調する副詞で、比較級 lighter を直接強調できない。","too は「～すぎる」という意味で、この文脈には合わない。","much は比較級 lighter を正しく強調する。","so は原級を強調する副詞で、比較級には通常使わない。"]},

{id:595,category:"比較",sentence:"Traveling by train is far more convenient than driving during rush hour.",choices:["very","too","far more","most"],answer:2,
 point:"比較級を強調する副詞には far や much が使われ、very は比較級を直接強調できません。",
 notes:["very は原級を強調する副詞で、比較級 more convenient を直接強調できない。","too は「～すぎる」という意味で、この文脈には合わない。","far more は比較級 more を正しく強調し、than と対応する。","most は最上級で、than を伴う2者の比較には使わない。"]},

{id:596,category:"比較",sentence:"The results of this year's survey are strikingly different from those of last year.",choices:["that","it","those","ones"],answer:2,
 point:"前出の複数名詞 results の繰り返しを避けるために使う指示代名詞は those です。",
 notes:["that は単数の指示代名詞で、複数の results には合わない。","it は単数の代名詞で、複数の results には合わない。","those は複数の指示代名詞で、results の繰り返しを避けて正しく受ける。","ones は前出の名詞を漠然と指す代名詞で、of last year という限定を伴うこの文脈には those が適切。"]},

{id:597,category:"比較",sentence:"The budget for this project is much higher than we initially estimated.",choices:["very high","high","much higher","highest"],answer:2,
 point:"比較級を強調する副詞には much や far が使われ、than と組み合わせて比較を表します。",
 notes:["very high は原級の強調で、than と組み合わせる比較級としては不適切。","high は原級で、than と組み合わせる比較級としては不適切。","much higher は比較級 higher を much が強調し、than と正しく対応する。","highest は最上級で、than を伴う2者の比較には使わない。"]},

{id:598,category:"比較",sentence:"The new policy is intended to be as effective as possible in reducing paperwork.",choices:["so","too","as","very"],answer:2,
 point:"「as ～ as possible」は「できるだけ～」という意味の定型表現です。",
 notes:["so はこの定型表現では使われない。","too は「～すぎる」という意味で、この文脈には合わない。","as は as ～ as possible の形で「できるだけ」という意味を正しく表す。","very は原級を強調する副詞で、この定型表現には合わない。"]},

{id:599,category:"比較",sentence:"This is one of the most challenging projects the team has ever undertaken.",choices:["the more","most","the most","more"],answer:2,
 point:"「one of the + 最上級 + 複数名詞」は「最も～なものの一つ」という意味を表す定型表現です。",
 notes:["the more は比較級で、この最上級の定型表現には合わない。","most は定冠詞 the が抜けており、最上級としては不完全。","the most は one of the most challenging projects の形で「最も難しいものの一つ」を正しく表す。","more は比較級で、この最上級の定型表現には合わない。"]},

{id:600,category:"比較",sentence:"The new distribution center operates far more efficiently than the old warehouse it replaced.",choices:["very","too","far","so"],answer:2,
 point:"比較級を強調する副詞には far や much が使われ、very は比較級を直接強調できません。",
 notes:["very は原級を強調する副詞で、比較級を直接強調できない。","too は「～すぎる」という意味で、この文脈には合わない。","far は比較級 more efficiently を正しく強調し、than と対応する。","so は原級を強調する副詞で、比較級には通常使わない。"]}
];

/* ---------------- パスワード保護 ---------------- */

/* ---------------- 進捗データ ---------------- */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveProgress(progress) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function recordAnswer(progress, qId, correct) {
  if (!progress[qId]) progress[qId] = {attempts:0, correctCount:0, lastCorrect:false};
  progress[qId].attempts += 1;
  if (correct) progress[qId].correctCount += 1;
  progress[qId].lastCorrect = correct;
  saveProgress(progress);
}

/* ---------------- 学習カレンダー（日別記録） ---------------- */
const DAILY_LOG_KEY = "toeicDailyLog_v1";
function loadDailyLog() {
  try {
    const raw = localStorage.getItem(DAILY_LOG_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveDailyLog(log) {
  localStorage.setItem(DAILY_LOG_KEY, JSON.stringify(log));
}
function pad2(n) { return String(n).padStart(2, "0"); }
function dateKey(y, m, d) { return y + "-" + pad2(m + 1) + "-" + pad2(d); }
function todayKey() {
  const d = new Date();
  return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
}
function recordDailyAnswer(correct) {
  const key = todayKey();
  if (!dailyLog[key]) dailyLog[key] = {attempts:0, correctCount:0};
  dailyLog[key].attempts += 1;
  if (correct) dailyLog[key].correctCount += 1;
  saveDailyLog(dailyLog);
}

/* ---------------- ブックマーク ---------------- */
const BOOKMARK_STORAGE_KEY = "toeicBookmarks_v1";
function loadBookmarks() {
  try {
    const raw = localStorage.getItem(BOOKMARK_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveBookmarks(bm) {

}
function isBookmarked(qId) {
  return !!bookmarks[qId];
}
function toggleBookmark(qId) {
  if (bookmarks[qId]) delete bookmarks[qId];
  else bookmarks[qId] = true;
  saveBookmarks(bookmarks);
}
function getBookmarkedQuestions() {
  return QUESTIONS.filter(q => bookmarks[q.id]);
}

/* ---------------- 状態 ---------------- */
let progress = loadProgress();
let dailyLog = loadDailyLog();
let bookmarks = loadBookmarks();
let session = null; // {queue, pointer, answers: {id: bool}, answeredThis: bool}

/* ---------------- ユーティリティ ---------------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function computeOverallStats() {
  let total = 0, correct = 0, mastered = 0;
  QUESTIONS.forEach(q => {
    const p = progress[q.id];
    if (p) {
      total += p.attempts;
      correct += p.correctCount;
      if (p.lastCorrect) mastered += 1;
    }
  });
  return {
    total,
    accuracy: total ? Math.round((correct/total)*100) : null,
    mastered
  };
}
function computeCategoryAccuracy(cat) {
  const qs = QUESTIONS.filter(q => q.category === cat);
  let total = 0, correct = 0;
  qs.forEach(q => {
    const p = progress[q.id];
    if (p) { total += p.attempts; correct += p.correctCount; }
  });
  return total ? Math.round((correct/total)*100) : null;
}

  document.getElementById("screen-mode-select").classList.toggle("hidden", name !== "mode-select");
  document.getElementById("screen-home").classList.toggle("hidden", name !== "home");

/* ---------------- 認証 ---------------- */
function isAuthenticated() {
  return localStorage.getItem(AUTH_STORAGE_KEY) === "true";
}
function tryUnlock() {
  const input = document.getElementById("lock-password-input");
  const errorEl = document.getElementById("lock-error");
  if (input.value === APP_PASSWORD) {
    localStorage.setItem(AUTH_STORAGE_KEY, "true");
    input.value = "";
    errorEl.classList.add("hidden");
    showScreen("mode-select");
  } else {
    errorEl.classList.remove("hidden");

    input.focus();

  session = null;
  document.getElementById("lock-password-input").value = "";
  document.getElementById("lock-error").classList.add("hidden");
  showScreen("lock");
  document.getElementById("lock-password-input").focus();

/* ---------------- 演習セッション ---------------- */
const SESSION_SIZE = 100;

function startSession(filterFn) {
  const pool = QUESTIONS.filter(filterFn);
  if (pool.length === 0) return;
  session = {
    queue: shuffle(pool).slice(0, SESSION_SIZE),
    pointer: 0,
    answers: {},
    answeredThis: false
  };
  showScreen("practice");
  renderQuestion();
}

function startPractice() {
  startSession(() => true);
}

function startWrongOnly() {
  startSession(q => progress[q.id] && progress[q.id].lastCorrect === false);
}

function renderQuestion() {
  const q = session.queue[session.pointer];
  session.answeredThis = false;

  document.getElementById("q-category").textContent = q.category;
  document.getElementById("q-progress").textContent = (session.pointer + 1) + " / " + session.queue.length;
  document.getElementById("progress-bar").style.width = Math.round(((session.pointer) / session.queue.length) * 100) + "%";
  updateBookmarkButton(q.id);

  document.getElementById("q-sentence").innerHTML = q.sentence.replace("___", '<span class="blank">______</span>');

  const choicesEl = document.getElementById("q-choices");
  choicesEl.innerHTML = "";
  q.choices.forEach((choice, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = '<span class="letter">' + LETTERS[idx] + '</span><span>' + choice + '</span>';
    btn.addEventListener("click", () => selectChoice(idx));
    choicesEl.appendChild(btn);
  });

  document.getElementById("q-result").classList.add("hidden");
}

function selectChoice(idx) {
  if (session.answeredThis) return;
  session.answeredThis = true;

  const q = session.queue[session.pointer];
  const correct = idx === q.answer;
  session.answers[q.id] = correct;
  recordAnswer(progress, q.id, correct);
  recordDailyAnswer(correct);

  const buttons = document.querySelectorAll("#q-choices .choice-btn");
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add("correct");
    else if (i === idx) btn.classList.add("wrong");
  });

  const flag = document.getElementById("result-flag");
  flag.textContent = correct ? "正解です！" : "不正解 - 正解は " + LETTERS[q.answer] + ". " + q.choices[q.answer];
  flag.className = "result-flag " + (correct ? "ok" : "ng");

  document.getElementById("explain-point").textContent = q.point;
  const list = document.getElementById("explain-list");
  list.innerHTML = "";
  q.notes.forEach((note, i) => {
    const li = document.createElement("li");
    li.textContent = LETTERS[i] + ". " + note;
    if (i === q.answer) li.classList.add("hit");
    list.appendChild(li);
  });

  document.getElementById("q-result").classList.remove("hidden");
  document.getElementById("progress-bar").style.width = Math.round(((session.pointer + 1) / session.queue.length) * 100) + "%";

  const nextBtn = document.getElementById("btn-next");
  nextBtn.textContent = (session.pointer + 1 < session.queue.length) ? "次の問題へ" : "結果を見る";
}

function nextQuestion() {
  session.pointer += 1;
  if (session.pointer >= session.queue.length) {
    renderResult();
  } else {
    renderQuestion();
  }
}

function renderResult() {
  const total = session.queue.length;
  const correct = Object.values(session.answers).filter(Boolean).length;
  document.getElementById("result-score").textContent = correct + " / " + total;
  document.getElementById("result-accuracy").textContent = "正答率 " + Math.round((correct/total)*100) + "%";

  const byCat = {};
  session.queue.forEach(q => {
    if (!byCat[q.category]) byCat[q.category] = {total:0, correct:0};
    byCat[q.category].total += 1;
    if (session.answers[q.id]) byCat[q.category].correct += 1;
  });
  const breakEl = document.getElementById("result-cat-break");
  breakEl.innerHTML = "";
  Object.keys(byCat).forEach(cat => {
    const row = document.createElement("div");
    row.className = "cat-break-row";
    row.innerHTML = "<span>" + cat + "</span><span>" + byCat[cat].correct + " / " + byCat[cat].total + "</span>";
    breakEl.appendChild(row);
  });

  showScreen("result");
}

/* ---------------- 学習カレンダー画面 ---------------- */
let calViewYear, calViewMonth; // calViewMonth は 0-indexed
let calSelectedDate = null;

function computeStreakAndTotal() {
  const totalDays = Object.keys(dailyLog).filter(k => dailyLog[k].attempts > 0).length;

  let streak = 0;
  const cursor = new Date();
  cursor.setHours(0, 0, 0, 0);
  let key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
  if (!dailyLog[key] || dailyLog[key].attempts === 0) {
    cursor.setDate(cursor.getDate() - 1);
    key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
  }
  while (dailyLog[key] && dailyLog[key].attempts > 0) {
    streak += 1;
    cursor.setDate(cursor.getDate() - 1);
    key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
  }
  return { totalDays, streak };
}

function renderCalDetail(key) {
  const detailEl = document.getElementById("cal-detail");
  const rec = dailyLog[key];
  detailEl.classList.remove("hidden");
  document.getElementById("cal-detail-date").textContent = key;
  if (rec && rec.attempts > 0) {
    const acc = Math.round((rec.correctCount / rec.attempts) * 100);
    document.getElementById("cal-detail-stats").innerHTML =
      "<span>学習問題数: " + rec.attempts + "問</span><span>正答率: " + acc + "%</span>";
  } else {
    document.getElementById("cal-detail-stats").textContent = "この日の学習記録はありません";
  }
}

function renderCalendar() {
  const { totalDays, streak } = computeStreakAndTotal();
  document.getElementById("cal-total-days").textContent = totalDays;
  document.getElementById("cal-streak").textContent = streak;

  document.getElementById("cal-month-label").textContent = calViewYear + "年" + (calViewMonth + 1) + "月";

  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";
  ["日", "月", "火", "水", "木", "金", "土"].forEach(w => {
    const el = document.createElement("div");
    el.className = "cal-weekday";
    el.textContent = w;
    grid.appendChild(el);
  });

  const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  const todayKeyStr = todayKey();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "cal-day empty";
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(calViewYear, calViewMonth, d);
    const rec = dailyLog[key];
    const hasRecord = !!(rec && rec.attempts > 0);
    const el = document.createElement("div");
    el.className = "cal-day"
      + (hasRecord ? " has-record" : "")
      + (key === todayKeyStr ? " today" : "")
      + (key === calSelectedDate ? " selected" : "");
    el.innerHTML = String(d) + (hasRecord ? '<span class="dot"></span>' : "");
    el.addEventListener("click", () => {
      calSelectedDate = key;
      renderCalendar();
      renderCalDetail(key);
    });
    grid.appendChild(el);
  }
}

function openCalendar() {
  const now = new Date();
  calViewYear = now.getFullYear();
  calViewMonth = now.getMonth();
  calSelectedDate = null;
  document.getElementById("cal-detail").classList.add("hidden");
  renderCalendar();
  showScreen("calendar");
}

/* ---------------- ブックマーク UI ---------------- */
function updateBookmarkButton(qId) {
  const btn = document.getElementById("btn-bookmark");
  const active = isBookmarked(qId);
  btn.textContent = active ? "★" : "☆";
  btn.classList.toggle("active", active);
}

function renderBookmarkList() {
  const listEl = document.getElementById("bookmark-list");
  listEl.innerHTML = "";
  const qs = getBookmarkedQuestions();
  if (qs.length === 0) {
    listEl.innerHTML = '<div style="text-align:center; color:var(--muted); padding:24px 0;">ブックマークした問題はありません</div>';
    return;
  }
  qs.forEach(q => {
    const row = document.createElement("div");
    row.className = "bookmark-row";
    row.innerHTML =
      '<div class="bookmark-row-main">' +
        '<span class="badge">' + q.category + '</span>' +
        '<div class="bookmark-row-sentence">' + q.sentence.replace("___", "______") + '</div>' +
      '</div>' +
      '<button class="link bookmark-remove-btn" data-id="' + q.id + '">解除</button>';
    listEl.appendChild(row);
  });
  listEl.querySelectorAll(".bookmark-remove-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      toggleBookmark(Number(btn.dataset.id));
      renderBookmarkList();
    });
  });
}

function openBookmarkList() {
  renderBookmarkList();
  showScreen("bookmark-list");
}

/* ---------------- イベント登録 ---------------- */
document.getElementById("btn-lock-submit").addEventListener("click", tryUnlock);
document.getElementById("lock-password-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryUnlock();
});
document.getElementById("logout-btn").addEventListener("click", logout);
document.getElementById("btn-mode-grammar").addEventListener("click", renderHome);
document.getElementById("btn-mode-vocab").addEventListener("click", () => { vocabPage = 0; renderVocabPage(); });
document.getElementById("btn-mode-calendar").addEventListener("click", openCalendar);
document.getElementById("btn-home-to-mode").addEventListener("click", () => showScreen("mode-select"));
document.getElementById("btn-home-to-calendar").addEventListener("click", openCalendar);
document.getElementById("btn-vocab-to-mode").addEventListener("click", () => showScreen("mode-select"));
document.getElementById("btn-calendar-to-mode").addEventListener("click", () => showScreen("mode-select"));
document.getElementById("btn-cal-prev").addEventListener("click", () => {
  calViewMonth -= 1;
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear -= 1; }
  renderCalendar();
});
document.getElementById("btn-cal-next").addEventListener("click", () => {
  calViewMonth += 1;
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear += 1; }
  renderCalendar();
});
document.getElementById("btn-vocab-prev").addEventListener("click", () => { if (vocabPage > 0) { vocabPage -= 1; renderVocabPage(); } });
document.getElementById("btn-vocab-next").addEventListener("click", () => {
  const totalPages = Math.ceil(VOCAB.length / VOCAB_PAGE_SIZE);
  if (vocabPage < totalPages - 1) { vocabPage += 1; renderVocabPage(); }
});
document.getElementById("btn-start").addEventListener("click", startPractice);
document.getElementById("btn-start-wrong").addEventListener("click", startWrongOnly);
document.getElementById("btn-start-bookmarked").addEventListener("click", () => {
  startSession(q => !!bookmarks[q.id]);
});
document.getElementById("btn-bookmark-list").addEventListener("click", openBookmarkList);
document.getElementById("btn-bookmarklist-to-home").addEventListener("click", renderHome);
document.getElementById("btn-bookmark").addEventListener("click", () => {
  const q = session.queue[session.pointer];
  toggleBookmark(q.id);
  updateBookmarkButton(q.id);
});
document.getElementById("btn-next").addEventListener("click", nextQuestion);
document.getElementById("btn-quit").addEventListener("click", () => { session = null; renderHome(); });
document.getElementById("btn-retry").addEventListener("click", () => {
  const cats = new Set(session.queue.map(q => q.category));
  startSession(q => cats.has(q.category));
});
document.getElementById("btn-home").addEventListener("click", () => { session = null; renderHome(); });
document.getElementById("btn-reset").addEventListener("click", () => {
  if (confirm("進捗をすべてリセットします。よろしいですか？")) {
    progress = {};
    saveProgress(progress);
    renderHome();
  }
});

showScreen(isAuthenticated() ? "mode-select" : "lock");

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.error("Service worker registration failed:", err);
    });
  });
}
</script>
