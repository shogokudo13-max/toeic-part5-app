 notes:["who は主格の関係代名詞で、後ろに直接名詞を続けることができない。","which は物を先行詞とする関係代名詞で、人を表す employee には使わない。","that も後ろに直接名詞を続けることができない。","whose は所有格の関係代名詞で、その従業員の提案（the employee's proposal）という所有関係を正しく表す。"]},

{id:347,category:"関係詞",sentence:"The building ___ the company is headquartered was constructed in 1998.",choices:["which","who","that","in which"],answer:3,
 point:"be headquartered in ~（〜に本社を置く）という前置詞を伴う表現のため、前置詞＋関係代名詞の形 in which が使われます。",
 notes:["which だけでは、is headquartered の後の前置詞 in が欠けてしまい文が成立しない。","who は人を先行詞とする関係代名詞で、building（建物）には使わない。","that も前置詞を直前に置くことができない。","in which は前置詞 in を含み、the company is headquartered in the building という元の文を正しく表す。"]},

{id:348,category:"関係詞",sentence:"The report, ___ was submitted late, contained several critical errors.",choices:["that","who","whose","which"],answer:3,
 point:"コンマを伴う非制限用法では関係代名詞 that を使うことができません。物を先行詞とする非制限用法には which が使われます。",
 notes:["that は非制限用法（コンマを伴う用法）には使えない。","who は人を先行詞とする関係代名詞で、report（報告書）には使わない。","whose は所有格で、この文脈には合わない。","which は非制限用法で物を先行詞とする際に正しく使われる。"]},

{id:349,category:"関係詞",sentence:"The factory ___ the accident occurred has since improved its safety protocols significantly.",choices:["which","that","in that","where"],answer:3,
 point:"先行詞 factory（場所）を受け、その場所の中での出来事を説明する場合には関係副詞 where が使われます。",
 notes:["which は関係代名詞で、後ろに主語や目的語が欠けた不完全な文が続く必要があるが、the accident occurred は完全な文であるため合わない。","that も関係代名詞として同様の理由で合わない。","in that という表現は文法的にこの形では使わない。","where は関係副詞で、完全な文を続けながら factory という場所を正しく修飾する。"]},

{id:350,category:"関係詞",sentence:"The reason ___ the shipment was delayed remains unclear to the logistics team.",choices:["which","who","what","why"],answer:3,
 point:"先行詞 reason（理由）を受ける関係副詞には why が使われます。",
 notes:["which は関係代名詞で、後ろに不完全な文が続く必要があるが、ここでは完全な文が続くため合わない。","who は人を先行詞とする関係代名詞で、reason には使わない。","what は先行詞を含む関係代名詞で、reason という先行詞がすでにあるここでは使えない。","why は関係副詞で、reason を先行詞として正しく使われる。"]},

{id:351,category:"関係詞",sentence:"The seminar, ___ attracted over 300 participants, will be held again next year.",choices:["that","who","whose","which"],answer:3,
 point:"コンマを伴う非制限用法では that は使えません。物を先行詞とする非制限用法の主格には which が使われます。",
 notes:["that は非制限用法には使えない。","who は人を先行詞とする関係代名詞で、seminar には使わない。","whose は所有格で、この文脈には合わない。","which は非制限用法の主格として正しく使われる。"]},

{id:352,category:"関係詞",sentence:"___ impressed the investors most was the company's rapid revenue growth.",choices:["That","Which","Who","What"],answer:3,
 point:"先行詞を含み「〜こと」という意味を表す関係代名詞 what が文の主語として使われます。",
 notes:["That は先行詞を含まないため、単独で文の主語にはなれない。","Which も先行詞を必要とするため、先行詞のないこの文では使えない。","Who も先行詞（人）を必要とするため使えない。","What は先行詞を含む関係代名詞で「投資家を最も驚かせたこと」という意味を表し、文の主語として正しく使われる。"]},

{id:353,category:"関係詞",sentence:"This is the exact model ___ our engineers recommended for the new assembly line.",choices:["whose","who","where","that"],answer:3,
 point:"先行詞 model（物）を受け、動詞 recommended の目的語となる関係代名詞には that（または which）が使われます。",
 notes:["whose は所有格で、この文脈には合わない。","who は人を先行詞とする関係代名詞で、model には使わない。","where は関係副詞で、後ろに完全な文が必要だが、ここでは目的語が欠けた不完全な文であるため合わない。","that は目的格の関係代名詞として正しく使われる。"]},

{id:354,category:"関係詞",sentence:"The negotiations, ___ outcome will affect thousands of employees, are expected to conclude next week.",choices:["that","who","which","whose"],answer:3,
 point:"先行詞 negotiations（物）と後ろの名詞 outcome の所有関係を表すには所有格の関係代名詞 whose が使われます。whose は人だけでなく物にも使うことができます。",
 notes:["that は所有格の用法を持たず、後ろに直接名詞を続けることができない。","who は人を先行詞とする関係代名詞で、negotiations には使わない。","which は所有格の用法を持たず、後ろに直接名詞を続けることができない。","whose は所有格の関係代名詞で、negotiations の outcome（結果）という所有関係を正しく表す。"]},

{id:355,category:"関係詞",sentence:"The department ___ productivity increased the most this year will be recognized at the annual meeting.",choices:["that","which","who","whose"],answer:3,
 point:"先行詞 department（物）と後ろの名詞 productivity の所有関係を表すには所有格の関係代名詞 whose が使われます。",
 notes:["that は所有格の用法を持たず、後ろに直接名詞を続けることができない。","which も所有格の用法を持たず、同様に使えない。","who は人を先行詞とする関係代名詞で、department には使わない。","whose は所有格の関係代名詞で、the department's productivity という所有関係を正しく表す。"]},

{id:356,category:"関係詞",sentence:"The two candidates, neither of ___ had prior management experience, were both hired for entry-level roles.",choices:["who","which","that","whom"],answer:3,
 point:"前置詞 of の後に置かれる関係代名詞は目的格でなければならないため、whom が使われます。",
 notes:["who は主格の関係代名詞で、前置詞の直後には使えない。","which は物を先行詞とする関係代名詞で、candidates（人）には使わない。","that も前置詞を直前に置くことができない。","whom は目的格の関係代名詞で、前置詞 of の後に正しく使われる。"]},

{id:357,category:"仮定法",sentence:"If the shipment ___ delayed, we would need to inform the client immediately.",choices:["is","was","has been","were"],answer:3,
 point:"現在の事実に反する仮定を表す仮定法過去では、if節の be動詞は主語に関わらず were が使われます。",
 notes:["is は直説法の現在形で、仮定法には使わない。","was も口語で使われることがあるが、フォーマルな仮定法過去では were が標準とされる。","has been は現在完了形で、仮定法過去の構文には合わない。","were は仮定法過去の be動詞の形として正しく使われる。"]},

{id:358,category:"仮定法",sentence:"I wish I ___ more time right now to review the contract before signing it.",choices:["have","has","had had","had"],answer:3,
 point:"wish の後で現在の事実に反する願望を表す場合、動詞は過去形（仮定法過去）が使われます。",
 notes:["have は直説法の現在形で、wish の後の仮定法には使わない。","has も同様に直説法の現在形で不適切。","had had は過去完了形で、過去の事実に反する願望を表す際に使うが、right now という現在の文脈には合わない。","had は仮定法過去の形で、現在の事実に反する願望を正しく表す。"]},

{id:359,category:"仮定法",sentence:"If the company had diversified its product line earlier, it ___ such a steep decline in sales last year.",choices:["would not experience","did not experience","would not have experienced","has not experienced"],answer:3,
 point:"if節が had + 過去分詞（仮定法過去完了）のとき、主節は would have + 過去分詞が使われます。",
 notes:["would not experience は would + 原形で、仮定法過去（現在の事実に反する仮定）の帰結節の形であり、if節の時制と一致しない。","did not experience は直説法の過去形で、仮定法の帰結節には使わない。","has not experienced は現在完了形で、仮定法の帰結節には使わない。","would not have experienced は would have + 過去分詞で、仮定法過去完了の帰結節として if節の時制と正しく一致する。"]},

{id:360,category:"仮定法",sentence:"It is imperative that the CEO ___ informed of any changes to the merger agreement.",choices:["is","was","will be","be"],answer:3,
 point:"It is imperative that ~ のように必要性を表す表現に続くthat節では、動詞は原形（仮定法現在）になります。",
 notes:["is は三人称単数現在形で、この構文には原形が使われるため不適切。","was は過去形で、同様に不適切。","will be は未来形で、この構文には使わない。","be は原形で、imperative that ~ be informed という仮定法現在として正しく使われる。"]},

{id:361,category:"仮定法",sentence:"If I ___ you, I would accept the job offer without hesitation.",choices:["am","was","have been","were"],answer:3,
 point:"仮定法過去では、be動詞は主語の人称に関わらず were が使われるのが標準的な形です。",
 notes:["am は直説法の現在形で、仮定法には使わない。","was も口語では使われることがあるが、フォーマルな文法では were が正式とされる。","have been は現在完了形で、仮定法過去の構文には合わない。","were は仮定法過去における be動詞の標準形として正しく使われる。"]},

{id:362,category:"仮定法",sentence:"The auditor insisted that the financial records ___ reviewed again before the report was finalized.",choices:["are","were","have been","be"],answer:3,
 point:"insist that ~ のように要求・主張を表す動詞に続くthat節では、動詞は原形（仮定法現在）になります。",
 notes:["are は現在形で、この構文には原形が使われるため不適切。","were は過去形で、同様に不適切。","have been は現在完了形で、この構文には使わない。","be は原形で、insisted that ~ be reviewed という仮定法現在の受動態として正しく使われる。"]},

{id:363,category:"仮定法",sentence:"Had the team followed the original schedule, the product ___ launched on time.",choices:["would launch","will be","was","would have been"],answer:3,
 point:"Had the team followed ~（if it had followed ~ の倒置形）に対応する主節では、would have + 過去分詞（受動態はwould have been + 過去分詞）が使われます。",
 notes:["would launch は would + 原形で、仮定法過去の帰結節の形であり、Had ~ という仮定法過去完了の倒置形とは時制が一致しない。","will be は直説法の未来形で、仮定法の帰結節には使わない。","was は直説法の過去形で、同様に使わない。","would have been は仮定法過去完了の帰結節（受動態）として正しく、Had the team followed ~ の時制と一致する。"]},

{id:364,category:"仮定法",sentence:"If the marketing budget ___ cut next year, several planned campaigns would have to be canceled.",choices:["is","will be","has been","were"],answer:3,
 point:"仮定法過去では、if節の be動詞は were が使われます。",
 notes:["is は直説法の現在形で、仮定法には使わない。","will be は未来形で、if節には使わない。","has been は現在完了形で、仮定法過去の構文には合わない。","were は仮定法過去の be動詞の形として正しく使われる。"]},

{id:365,category:"仮定法",sentence:"The board recommended that the merger ___ postponed until the audit was complete.",choices:["is","was","has been","be"],answer:3,
 point:"recommend that ~ のように提案を表す動詞に続くthat節では、動詞は原形（仮定法現在）になります。",
 notes:["is は現在形で、この構文には原形が使われるため不適切。","was は過去形で、同様に不適切。","has been は現在完了形で、この構文には使わない。","be は原形で、recommended that ~ be postponed という仮定法現在の受動態として正しく使われる。"]},

{id:366,category:"仮定法",sentence:"If it had not been for the quick action of the IT team, the entire system ___ crashed.",choices:["will have","would","has","would have"],answer:3,
 point:"If it had not been for ~（もし〜がなかったら）という仮定法過去完了の慣用表現に対応する主節では、would have + 過去分詞が使われます。",
 notes:["will have は直説法の未来完了的な表現で、仮定法の帰結節には使わない。","would だけでは過去分詞 crashed と組み合わせて完了の意味を作れない。","has は直説法の現在完了形で、仮定法の帰結節には使わない。","would have は would have crashed という仮定法過去完了の帰結節を正しく作る。"]},

{id:367,category:"仮定法",sentence:"Suppose the client ___ unhappy with the final design, what would the agency do next?",choices:["is","was","has been","were"],answer:3,
 point:"suppose（もし〜だとしたら）に続く仮定法では、be動詞は were が使われます。",
 notes:["is は直説法の現在形で、仮定法の文脈には使わない。","was も口語では使われるが、フォーマルな仮定法表現では were が好まれる。","has been は現在完了形で、この構文には合わない。","were は suppose の後の仮定法で使われる be動詞の形として正しい。"]},

{id:368,category:"代名詞",sentence:"Each department must submit ___ own budget proposal by the end of the month.",choices:["their","them","they","its"],answer:3,
 point:"each department は単数扱いのため、所有格の代名詞は単数形の its が使われます。",
 notes:["their は複数形の所有格で、単数扱いの each department とは一致しない。","them は目的格で、名詞の前に置く所有格の位置には使えない。","they は主格で、同様にこの位置には使えない。","its は単数形の所有格で、each department と正しく一致する。"]},

{id:369,category:"代名詞",sentence:"The manager gave the new employees a tour of the office and introduced ___ to the rest of the staff.",choices:["they","theirs","their","them"],answer:3,
 point:"動詞 introduced の目的語となるのは目的格の代名詞です。",
 notes:["they は主格で、動詞の目的語には使えない。","theirs は所有代名詞で、意味が合わない。","their は所有格で、後ろに名詞が必要なため、単独では動詞の目的語になれない。","them は目的格で、introduced の目的語として正しく使われる。"]},

{id:370,category:"代名詞",sentence:"The two companies agreed to share the costs of the joint venture between ___.",choices:["them","they","theirs","themselves"],answer:3,
 point:"主語（the two companies）と前置詞 between の目的語が同一の対象を指す場合、再帰代名詞 themselves が使われます。",
 notes:["them は目的格だが、主語と同一対象を指す再帰的な文脈では再帰代名詞を使うのが適切。","they は主格で、前置詞の目的語には使えない。","theirs は所有代名詞で、意味が合わない。","themselves は再帰代名詞で、between themselves「両社の間で」という意味を正しく表す。"]},

{id:371,category:"代名詞",sentence:"Neither of the proposals fully addressed the client's concerns, so the team revised ___.",choices:["it","those","one","them"],answer:3,
 point:"proposals（複数）を指す代名詞として、複数形の目的格 them が使われます。",
 notes:["it は単数を指す代名詞で、複数の proposals には合わない。","those は遠くのものを指す指示代名詞で、この文脈にはやや不自然。","one は単数の可算名詞を指す代名詞で、複数の proposals には合わない。","them は複数の proposals を正しく指す。"]},

{id:372,category:"代名詞",sentence:"The new employee introduced ___ to the team during the morning meeting.",choices:["her","hers","she","herself"],answer:3,
 point:"主語と動詞 introduced の目的語が同一人物を指す場合、再帰代名詞が使われます。",
 notes:["her は目的格・所有格として使えるが、主語と同一人物を指す場合は再帰代名詞を使うのが正しい。","hers は所有代名詞で、意味が合わない。","she は主格で、動詞の目的語には使えない。","herself は再帰代名詞で、新入社員が自分自身を紹介したという意味を正しく表す。"]},

{id:373,category:"代名詞",sentence:"This laptop is faster than ___ I used at my previous job.",choices:["it","those","that","the one"],answer:3,
 point:"前に出た単数名詞（laptop）の繰り返しを避け、後ろに修飾語（I used）を伴う場合には代名詞 the one が使われます。",
 notes:["it は単独で使われ、後ろに関係詞節を伴って修飾することができない。","those は複数を指す代名詞で、単数の laptop とは一致しない。","that は単独では「あれ」を指すが、後ろに修飾語を伴って使う場合は the one の方が自然。","the one は前出の名詞の代わりとして使われ、後ろの I used という修飾語を正しく伴うことができる。"]},

{id:374,category:"代名詞",sentence:"The company values customer feedback and takes ___ seriously when making decisions.",choices:["them","those","one","it"],answer:3,
 point:"feedback は不可算名詞で単数扱いのため、代名詞は単数形の it が使われます。",
 notes:["them は複数を指す代名詞で、不可算名詞の feedback とは一致しない。","those も複数を指すため、同様に不適切。","one は単数の可算名詞を指す代名詞で、不可算名詞の feedback には使えない。","it は不可算名詞の feedback を正しく指す。"]},

{id:375,category:"代名詞",sentence:"If the invoice contains any errors, please notify us and we will correct ___ immediately.",choices:["it","one","those","them"],answer:3,
 point:"errors（複数）を指す代名詞として、複数形の目的格 them が使われます。",
 notes:["it は単数を指す代名詞で、複数の errors には合わない。","one は単数の可算名詞を指す代名詞で、複数の errors には合わない。","those は遠くのものを指す指示代名詞で、この文脈にはやや不自然。","them は複数の errors を正しく指す。"]},

{id:376,category:"代名詞",sentence:"The two managers could not agree on the proposal, so ___ decided to consult a third party.",choices:["either","neither","it","they"],answer:3,
 point:"the two managers（2人のマネージャー）を指す主格の代名詞として they が使われます。",
 notes:["either は「2つのうち一方」という意味で、両者を指す文意とは合わない。","neither は「どちらも〜ない」という意味で、第三者に相談することにしたという文意と矛盾する。","it は単数を指す代名詞で、2人を指すには合わない。","they は2人のマネージャーを指す主格の代名詞として正しく使われる。"]},

{id:377,category:"代名詞",sentence:"Please make sure the new interns understand ___ responsibilities before their first day.",choices:["them","theirs","they","their"],answer:3,
 point:"名詞 responsibilities を修飾するのは所有格の代名詞です。",
 notes:["them は目的格で、名詞を直接修飾できない。","theirs は所有代名詞で、単独で名詞を修飾する形では使わない。","they は主格で、名詞を修飾できない。","their は所有格で、responsibilities を正しく修飾する。"]},

{id:378,category:"代名詞",sentence:"The success of the campaign was due to the marketing team ___, who worked overtime for weeks.",choices:["them","theirs","itself","themselves"],answer:3,
 point:"the marketing team を強調する再帰代名詞として themselves が使われます（チームを構成する人々を意識した用法）。",
 notes:["them は目的格の代名詞で、強調用法には使わない。","theirs は所有代名詞で、意味が合わない。","itself は単数の再帰代名詞で、チームを一つの集合体として強調する場合に使うが、後ろの who worked（人を表す関係詞）と合わせるとチームの構成員を意識した themselves がより自然。","themselves は再帰代名詞の強調用法で、チームのメンバー自身を正しく強調する。"]},

{id:379,category:"態",sentence:"The new safety guidelines ___ to all employees before the factory reopens.",choices:["will explain","are explaining","have explained","will be explained"],answer:3,
 point:"主語 guidelines（指針）は「説明される」側であるため、受動態が使われます。",
 notes:["will explain は能動態の未来形で、guidelines が「説明する」という意味になり不自然。","are explaining は能動態の現在進行形で、同様に意味が合わない。","have explained は能動態の現在完了形で、同様に不適切。","will be explained は受動態の未来形で、指針が従業員に説明されるという意味を正しく表す。"]},

{id:380,category:"態",sentence:"The proposal ___ by the board of directors at yesterday's meeting.",choices:["approved","has approved","was approving","was approved"],answer:3,
 point:"主語 proposal（提案）は「承認される」側であるため、受動態が使われます。yesterday's meeting という過去の時点を表す語句があるため過去形になります。",
 notes:["approved は能動態の過去形で、proposal が「承認する」という意味になり不自然。","has approved は能動態の現在完了形で、意味も時制も合わない。","was approving は受動態ではない誤った形で文法的に不適切。","was approved は受動態の過去形で、提案が取締役会によって承認されたという意味を正しく表す。"]},

{id:381,category:"態",sentence:"The annual report is currently ___ by the finance department.",choices:["reviewing","review","reviewed","being reviewed"],answer:3,
 point:"主語 report（報告書）は「検討される」側であり、現在進行中の動作であるため、進行形の受動態（be + being + 過去分詞）が使われます。",
 notes:["reviewing は能動態の現在分詞で、report が「検討する」という意味になり不自然。","review は動詞の原形で、is の後に続く形としては不適切。","reviewed は過去分詞だが、is reviewed だけでは進行中というニュアンスが弱く、currently という語句には being reviewed がより適切。","being reviewed は進行形の受動態で、財務部によって現在検討されているという意味を正しく表す。"]},

{id:382,category:"態",sentence:"The contract ___ before the client arrives for the signing ceremony.",choices:["must finalize","must be finalizing","must have finalized","must be finalized"],answer:3,
 point:"主語 contract（契約書）は「最終決定される」側であるため、助動詞＋受動態（must be + 過去分詞）が使われます。",
 notes:["must finalize は能動態で、contract が「最終決定する」という意味になり不自然。","must be finalizing は進行形の受動態としては誤った形で文法的に不適切。","must have finalized は能動態の完了形で、意味が合わない。","must be finalized は助動詞＋受動態で、契約書が調印式の前に最終決定されなければならないという意味を正しく表す。"]},

{id:383,category:"態",sentence:"The malfunctioning equipment ___ by a technician sometime next week.",choices:["will repair","will be repairing","is repairing","will be repaired"],answer:3,
 point:"主語 equipment（機器）は「修理される」側であるため、受動態が使われます。",
 notes:["will repair は能動態の未来形で、equipment が「修理する」という意味になり不自然。","will be repairing は能動態の未来進行形で、同様に意味が合わない。","is repairing は能動態の現在進行形で、未来の意味も表せず不適切。","will be repaired は受動態の未来形で、技術者によって機器が修理されるという意味を正しく表す。"]},

{id:384,category:"態",sentence:"By the end of the fiscal year, the new branch offices ___ in three major cities.",choices:["will open","are opening","have opened","will have been opened"],answer:3,
 point:"主語 offices（支店）は「開設される」側であり、By the end of ~ という未来の一時点までの完了を表すため、未来完了形の受動態が使われます。",
 notes:["will open は能動態の未来形で、offices が「開く」という意味になり、態も時制も文脈に合わない。","are opening は能動態の現在進行形で、未来の完了を表せない。","have opened は能動態の現在完了形で、未来の一時点までの完了を表せない。","will have been opened は未来完了形の受動態で、年度末までに支店が開設されているという意味を正しく表す。"]},

{id:385,category:"態",sentence:"All new hires ___ to complete an orientation program within their first week.",choices:["require","are requiring","have required","are required"],answer:3,
 point:"主語 new hires（新入社員）は「求められる」側であるため、受動態（be required to do）が使われます。",
 notes:["require は能動態の現在形で、new hires が「要求する」という意味になり不自然。","are requiring は能動態の現在進行形で、同様に意味が合わない。","have required は能動態の現在完了形で、同様に不適切。","are required は受動態で、be required to do「〜するよう求められている」という意味を正しく表す。"]},

{id:386,category:"態",sentence:"The merger agreement ___ carefully by legal experts before either company signs it.",choices:["examines","is examining","must examine","must be examined"],answer:3,
 point:"主語 agreement（合意書）は「検討される」側であるため、助動詞＋受動態（must be + 過去分詞）が使われます。",
 notes:["examines は能動態の現在形で、agreement が「検討する」という意味になり不自然。","is examining は能動態の現在進行形で、同様に不適切。","must examine は能動態で、同様に意味が合わない。","must be examined は助動詞＋受動態で、法律専門家によって合意書が慎重に検討されなければならないという意味を正しく表す。"]},

{id:387,category:"態",sentence:"The company's outdated software ___ with a new system last quarter.",choices:["replaced","has replaced","replaces","was replaced"],answer:3,
 point:"主語 software（ソフトウェア）は「置き換えられる」側であり、last quarter という過去の時点を表す語句があるため、受動態の過去形が使われます。",
 notes:["replaced は能動態の過去形で、software が「置き換える」という意味になり不自然。","has replaced は能動態の現在完了形で、態も時制も文脈に合わない。","replaces は能動態の現在形で、意味も時制も文脈に合わない。","was replaced は受動態の過去形で、古いソフトウェアが新しいシステムに置き換えられたという意味を正しく表す。"]},

{id:388,category:"態",sentence:"The customer complaint ___ seriously and resolved within 24 hours.",choices:["takes","took","is taking","was taken"],answer:3,
 point:"主語 complaint（苦情）は「受け止められる」側であるため、受動態が使われます。resolved と対になる過去形の受動態 was taken が使われます。",
 notes:["takes は能動態の現在形で、complaint が「受け止める」という意味になり不自然。","took は能動態の過去形で、同様に意味が合わない。","is taking は能動態の現在進行形で、同様に不適切。","was taken は受動態の過去形で、苦情が真剣に受け止められ、24時間以内に解決されたという意味を正しく表す。"]},

{id:389,category:"態",sentence:"A new training program ___ for all incoming employees starting next month.",choices:["introduces","has introduced","is introducing","will be introduced"],answer:3,
 point:"主語 program（プログラム）は「導入される」側であり、starting next month という未来を表す語句があるため、受動態の未来形が使われます。",
 notes:["introduces は能動態の現在形で、program が「導入する」という意味になり不自然。","has introduced は能動態の現在完了形で、未来の意味を表せない。","is introducing は能動態の現在進行形で、同様に未来の意味を表せない。","will be introduced は受動態の未来形で、来月から新入社員全員を対象に新しい研修プログラムが導入されるという意味を正しく表す。"]},

{id:390,category:"比較",sentence:"This year's marketing budget is ___ than last year's, allowing for a more ambitious campaign.",choices:["large","largest","more large","larger"],answer:3,
 point:"than を伴う2つのものの比較には比較級が使われます。large は1音節の形容詞のため -er を付けた larger が正しい形です。",
 notes:["large は原級で、than を伴う比較の文脈には使えない。","largest は最上級で、2つのものを比較するここでは使わない。","more large は誤った比較級の形で、1音節の形容詞には -er を付けるのが正しい。","larger は正しい比較級の形で、than last year's と正しく対応する。"]},

{id:391,category:"比較",sentence:"Of all the candidates interviewed, she had ___ experience in international sales.",choices:["more","much","many","the most"],answer:3,
 point:"of all ~（〜の中で）という範囲を示す語句があるため、最上級が使われます。experience は不可算名詞のため much の最上級 the most が使われます。",
 notes:["more は比較級で、of all ~ という3人以上の範囲を示す文脈には最上級が必要。","much は原級で、最上級の文脈には使えない。","many は可算名詞に使う語で、不可算名詞の experience には使わない。","the most は不可算名詞に使う最上級で、of all the candidates の中で最も多い経験量を正しく表す。"]},

{id:392,category:"比較",sentence:"The new office is ___ spacious as the previous one, so employees have less room to work.",choices:["more","much","less","not as"],answer:3,
 point:"「AほどBでない」という同等比較の否定は not as + 原級 + as で表されます。",
 notes:["more は比較級を作る語で、as ~ as の同等比較の構文には使わない。","much は比較級を強調する副詞で、as ~ as の構文には合わない。","less は「より少なく」という意味の比較級で、as ~ as の構文とは組み合わせない（less spacious than の形が正しい）。","not as は not as ~ as という同等比較の否定として正しく使われる。"]},

{id:393,category:"比較",sentence:"The more feedback we gather from customers, ___ our product will become.",choices:["good","best","better","the better"],answer:3,
 point:"「〜すればするほど、ますます…」という意味を表す the 比較級, the 比較級 の構文が使われます。",
 notes:["good は原級で、この構文には比較級が必要。","best は最上級で、この構文には合わない。","better は比較級だが、この構文では the を伴う必要がある。","the better は the 比較級 の形で、the more feedback ~, the better ~ という構文を正しく完成させる。"]},

{id:394,category:"比較",sentence:"Revenue this quarter grew ___ faster than analysts had predicted.",choices:["very","so","too","much"],answer:3,
 point:"比較級を強調する副詞には much が使われます。very は原級を強調する副詞で比較級には使いません。",
 notes:["very は原級を強調する副詞で、比較級 faster を直接強調することはできない。","so は「とても」という意味だが、通常 so ~ that の構文などで使われ、単独で比較級を強調する語としては不自然。","too は「〜すぎる」という意味で、この文脈には合わない。","much は比較級を強調する副詞として faster を正しく修飾する。"]},

{id:395,category:"比較",sentence:"Among the three suppliers, Company A offers ___ prices.",choices:["low","lower","lowest","the lowest"],answer:3,
 point:"among the three ~（3つの中で）という範囲を示す語句があるため、最上級が使われます。",
 notes:["low は原級で、3者を比較する最上級の文脈には使えない。","lower は比較級で、2者の比較に使うため、3者を比較するここでは不適切。","lowest は最上級だが、名詞の前で使う場合は通常定冠詞 the を伴う必要がある。","the lowest は定冠詞を伴う最上級として、3社の中で最も低い価格を正しく表す。"]},

{id:396,category:"比較",sentence:"The updated software runs ___ as efficiently as the previous version, if not more so.",choices:["so","such","very","just"],answer:3,
 point:"as ~ as の同等比較を強調する副詞には just が使われ、「ちょうど同じくらい」という意味を表します。",
 notes:["so は否定文の as ~ as（not so ~ as）でよく使われるが、肯定文でこの位置に置く強調表現としては just が一般的。","such は形容詞や名詞を強調する語で、as ~ as の構文をこの位置で強調する語としては使わない。","very は原級の形容詞・副詞を直接強調する語で、as ~ as 全体を強調する語としては不自然。","just は as ~ as を強調し「ちょうど同じくらい効率的に」という意味を正しく表す。"]},

{id:397,category:"比較",sentence:"This model is by far ___ popular product in our entire catalog.",choices:["a","more","most","the most"],answer:3,
 point:"by far は最上級を強調する語句で「断然、群を抜いて」という意味を表します。最上級には定冠詞 the が必要です。",
 notes:["a は不定冠詞で、最上級の文脈には合わない。","more は比較級で、by far で強調される最上級の文脈には合わない。","most は最上級だが、定冠詞 the が欠けているため不完全な形。","the most は定冠詞を伴う最上級で、by far the most popular「断然最も人気のある」という意味を正しく表す。"]},

{id:398,category:"比較",sentence:"The negotiations took ___ longer than either side had anticipated.",choices:["very","too","so","far"],answer:3,
 point:"比較級を強調する副詞には far が使われ、「はるかに」という意味を表します。",
 notes:["very は原級を強調する副詞で、比較級 longer を直接強調することはできない。","too は「〜すぎる」という意味で、この文脈には合わない。","so は通常 so ~ that の構文で使われ、単独で比較級を強調する語としては不自然。","far は比較級を強調する副詞として longer を正しく修飾し「はるかに長く」という意味を表す。"]},

{id:399,category:"比較",sentence:"Customer satisfaction scores this year are ___ higher than they were two years ago.",choices:["very","too","so","significantly"],answer:3,
 point:"比較級を強調する副詞には significantly（著しく）などの程度を表す副詞が使われます。very は比較級を直接強調できません。",
 notes:["very は原級を強調する副詞で、比較級 higher を直接強調することはできない。","too は「〜すぎる」という意味で、この文脈には合わない。","so は通常 so ~ that の構文で使われ、単独で比較級を強調する語としては不自然。","significantly は比較級を強調する副詞として higher を正しく修飾し「著しく高い」という意味を表す。"]},

{id:400,category:"比較",sentence:"Of the two proposals, the second one is ___ more cost-effective.",choices:["very","most","the most","far"],answer:3,
 point:"2つのものを比較する場合は比較級を使い、最上級は使いません。比較級を強調する副詞には far が使われます。",
 notes:["very は原級を強調する副詞で、比較級を直接強調することはできない。","most は最上級を作る語で、2者の比較には使わない。","the most も最上級の形で、of the two（2つの）という2者比較の文脈には合わない。","far は比較級を強調する副詞として more cost-effective を正しく修飾する。"]},

{id:401,category:"品詞",sentence:"The new safety regulations will directly ___ the way factory workers handle equipment.",choices:["affection","affective","affect","affectively"],answer:2,
 point:"助動詞 will と副詞 directly の後に続く語は動詞の原形です。",
 notes:["affection は名詞「愛情」。動詞の位置には入らない。","affective は形容詞「情動に関する」。動詞の位置には使えない。","affect は動詞「影響を与える」。will directly affect で正しい形。","affectively は副詞。動詞の位置には入らない。"]},

{id:402,category:"品詞",sentence:"The consultant offered several practical ___ for improving workflow efficiency.",choices:["recommend","recommending","recommendations","recommendable"],answer:2,
 point:"several の後には複数形の名詞が続きます。",
 notes:["recommend は動詞原形。several の後には名詞が必要。","recommending は動名詞。several の後の名詞の位置としては不自然。","recommendations は名詞「提言」の複数形。several practical recommendations で正しい。","recommendable は形容詞「推奨できる」。several の後には使えない。"]},

{id:403,category:"品詞",sentence:"Employees who ___ meet their targets are eligible for a year-end bonus.",choices:["consistent","consistency","consistently","consist"],answer:2,
 point:"関係代名詞 who の後、動詞 meet を修飾するのは副詞です。",
 notes:["consistent は形容詞。動詞を修飾できない。","consistency は名詞「一貫性」。動詞の前には使えない。","consistently は副詞「一貫して」。動詞 meet を正しく修飾する。","consist は動詞原形「構成される」。ここではすでに動詞 meet があり、位置的にも不適切。"]},

{id:404,category:"品詞",sentence:"The company's ___ approach to customer service has earned it a loyal client base.",choices:["innovate","innovation","innovative","innovatively"],answer:2,
 point:"空欄の直後の名詞 approach を修飾するのは形容詞です。",
 notes:["innovate は動詞原形「革新する」。名詞を修飾できない。","innovation は名詞「革新」。名詞が名詞を直接修飾する形は不自然。","innovative は形容詞「革新的な」。approach を正しく修飾する。","innovatively は副詞。名詞を修飾できない。"]},

{id:405,category:"品詞",sentence:"The manager needs to ___ the new expense policy before it takes effect next month.",choices:["verification","verified","verify","verifiably"],answer:2,
 point:"to の後には動詞の原形が続きます(to不定詞)。",
 notes:["verification は名詞「検証」。to の後の動詞の位置には入らない。","verified は過去分詞・形容詞。to の直後には動詞原形が必要。","verify は動詞原形「確認する」。to verify で正しい形。","verifiably は副詞「証明可能なほどに」。to の直後の動詞の位置には使えない。"]},

{id:406,category:"品詞",sentence:"___ among team members is essential for completing the project on schedule.",choices:["Cooperate","Cooperative","Cooperation","Cooperatively"],answer:2,
 point:"文頭の主語の位置には名詞が入ります。",
 notes:["Cooperate は動詞原形。主語の位置には入らない。","Cooperative は形容詞「協力的な」。主語(名詞)の位置には使えない。","Cooperation は名詞「協力」。文の主語として正しい。","Cooperatively は副詞「協力して」。主語の位置には入らない。"]},

{id:407,category:"前置詞",sentence:"The exhibition will remain open ___ the entire month of August.",choices:["between","among","during","within"],answer:2,
 point:"特定の期間全体を表す「〜の間じゅう」には during を使います。",
 notes:["between は「(2つ)の間に」。2つの対象を挙げる文脈が必要でここでは不適切。","among は「(3つ以上)の中で」。期間を表す語句には使わない。","during は「〜の間じゅう」。the entire month のような期間の前で正しく使われる。","within は「〜以内に」。期限を表す場合に使うが、ここでは「開いている期間」を表すため during が適切。"]},

{id:408,category:"前置詞",sentence:"Employees are required to submit their timesheets ___ Friday afternoon.",choices:["until","since","by","from"],answer:2,
 point:"期限「〜までに」を表す前置詞は by です。until は「〜まで(ずっと)」という継続を表します。",
 notes:["until は「〜まで(継続)」。動作の継続を表すため、提出という一回の動作には合わない。","since は「〜以来」。過去のある時点からの継続を表すため文脈に合わない。","by は「〜までに」。期限を表し、submit という一回の動作と自然に結びつく。","from は「〜から」。起点を表すため文脈に合わない。"]},

{id:409,category:"前置詞",sentence:"The new policy applies to all staff members ___ their department.",choices:["because of","instead of","regardless of","in addition to"],answer:2,
 point:"「〜に関係なく」を表す表現は regardless of です。",
 notes:["because of は「〜が原因で」。理由を表すためここでは意味が通らない。","instead of は「〜の代わりに」。文脈に合わない。","regardless of は「〜に関係なく」。department に関わらず全員に適用されるという文意に合う。","in addition to は「〜に加えて」。文脈に合わない。"]},

{id:410,category:"前置詞",sentence:"The delivery was delayed ___ unexpected weather conditions.",choices:["in case of","in terms of","due to","on behalf of"],answer:2,
 point:"原因・理由「〜が原因で」を表すのは due to です。",
 notes:["in case of は「〜の場合には」。仮定の状況を表すため文脈に合わない。","in terms of は「〜の点で」。原因を表さないため不適切。","due to は「〜が原因で」。天候が原因で遅延したという文意に合う。","on behalf of は「〜を代表して」。原因を表す文脈には合わない。"]},

{id:411,category:"前置詞",sentence:"Employees must file their expense reports ___ two weeks of returning from a business trip.",choices:["among","throughout","within","along"],answer:2,
 point:"「〜以内に」という期限を表す前置詞は within です。",
 notes:["among は「(3つ以上)の中で」。期限を表さない。","throughout は「〜の間じゅう」。期間全体を表すが「〜以内に」という期限の意味にはならない。","within は「〜以内に」。2週間という期限を正しく表す。","along は「〜に沿って」。場所を表す前置詞でここでは不適切。"]},

{id:412,category:"前置詞",sentence:"Visitors must register at the front desk ___ entering the building.",choices:["in spite of","instead of","prior to","apart from"],answer:2,
 point:"「〜より前に」を表す表現は prior to です。",
 notes:["in spite of は「〜にもかかわらず」。文脈に合わない。","instead of は「〜の代わりに」。文脈に合わない。","prior to は「〜の前に」。building に入る前に登録するという文意に合う。","apart from は「〜は別として」。文脈に合わない。"]},

{id:413,category:"接続詞",sentence:"___ the report was submitted late, the manager decided not to penalize the team.",choices:["Because","Unless","Although","So that"],answer:2,
 point:"「〜だけれども」という譲歩を表す接続詞は although です。",
 notes:["Because は「〜なので」。理由を表すが、後半の内容(罰しないと決めた)と矛盾する。","Unless は「〜しない限り」。条件を表すため文脈に合わない。","Although は「〜だけれども」。遅れて提出されたにもかかわらず罰しなかったという譲歩の文意に合う。","So that は「〜するために」。目的を表すため文脈に合わない。"]},

{id:414,category:"接続詞",sentence:"The seminar will be postponed ___ fewer than ten people register.",choices:["even though","so that","if","while"],answer:2,
 point:"条件「もし〜なら」を表す接続詞は if です。",
 notes:["even though は「〜だけれども」。譲歩を表すため文脈に合わない。","so that は「〜するために」。目的を表すため文脈に合わない。","if は「もし〜なら」。人数が10人未満なら延期するという条件の文意に合う。","while は「〜している間に」。同時性を表すため文脈に合わない。"]},

{id:415,category:"接続詞",sentence:"___ the marketing team focuses on customer acquisition, the sales team concentrates on closing deals.",choices:["Because","Unless","Whereas","So that"],answer:2,
 point:"2つの事柄を対比する「〜である一方」を表す接続詞は whereas です。",
 notes:["Because は「〜なので」。理由を表すため対比の文脈に合わない。","Unless は「〜しない限り」。条件を表すため文脈に合わない。","Whereas は「〜である一方」。マーケティングと営業の役割の違いを対比する文意に合う。","So that は「〜するために」。目的を表すため文脈に合わない。"]},

{id:416,category:"接続詞",sentence:"You should back up your files ___ the system crashes unexpectedly.",choices:["as if","now that","in case","provided that"],answer:2,
 point:"「〜する場合に備えて」を表す接続詞は in case です。",
 notes:["as if は「まるで〜のように」。文脈に合わない。","now that は「今や〜なので」。理由を表すため文脈に合わない。","in case は「〜する場合に備えて」。システムがクラッシュする場合に備えてバックアップするという文意に合う。","provided that は「〜という条件で」。条件を表すが、in case のニュアンス(備え)とは異なり、ここでは in case が自然。"]},

{id:417,category:"接続詞",sentence:"The client signed the contract ___ the terms had been finalized.",choices:["in order that","now that","as soon as","even if"],answer:2,
 point:"「〜するとすぐに」という時を表す接続詞は as soon as です。",
 notes:["in order that は「〜するために」。目的を表すため文脈に合わない。","now that は「今や〜なので」。理由を表すため文脈に合わない。","as soon as は「〜するとすぐに」。条件が確定してすぐに契約したという時間的な文意に合う。","even if は「たとえ〜でも」。仮定の譲歩を表すため文脈に合わない。"]},

{id:418,category:"接続詞",sentence:"The board will approve the budget ___ every department head agrees to the proposed cuts.",choices:["even though","as though","provided that","now that"],answer:2,
 point:"「〜という条件で」を表す接続詞は provided that です。",
 notes:["even though は「〜だけれども」。譲歩を表すため文脈に合わない。","as though は「まるで〜のように」。文脈に合わない。","provided that は「〜という条件で」。全部門長が同意するという条件の文意に合う。","now that は「今や〜なので」。理由を表すため文脈に合わない。"]},

{id:419,category:"時制",sentence:"By the time the auditors arrive next week, the accounting team ___ all the necessary documents.",choices:["prepares","had prepared","will have prepared","is preparing"],answer:2,
 point:"「By the time + 現在形」で未来のある時点までに完了している動作は未来完了形(will have + 過去分詞)で表します。",
 notes:["prepares は現在形。未来の一時点までの完了を表せない。","had prepared は過去完了形。過去の一時点を基準とするためここでは不適切。","will have prepared は未来完了形。来週の監査人到着までに準備が完了しているという文意に合う。","is preparing は現在進行形。未来完了のニュアンスを表せない。"]},

{id:420,category:"時制",sentence:"At this time last year, the company ___ for a new office location.",choices:["has searched","searches","was searching","will search"],answer:2,
 point:"「At this time last year(去年の今頃)」という過去のある時点で進行中だった動作は過去進行形で表します。",
 notes:["has searched は現在完了形。過去の特定の時点を表す表現とは結びつかない。","searches は現在形。過去の出来事を表せない。","was searching は過去進行形。去年の今頃、探している最中だったという文意に合う。","will search は未来形。過去の文脈に合わない。"]},

{id:421,category:"時制",sentence:"The technicians ___ the server since early this morning, but they still haven't found the problem.",choices:["repaired","repair","have been repairing","will repair"],answer:2,
 point:"「since + 過去の起点」とともに使われ、動作が現在も継続していることを表すのは現在完了進行形です。",
 notes:["repaired は過去形。動作の継続を表せない。","repair は現在形。継続の意味を表せない。","have been repairing は現在完了進行形。今朝から修理を続けているという継続の文意に合う。","will repair は未来形。文脈に合わない。"]},

{id:422,category:"時制",sentence:"By the time she retires next spring, Ms. Alvarez ___ at the company for over 25 years.",choices:["works","worked","will have worked","is working"],answer:2,
 point:"未来のある時点までの継続・完了を表すのは未来完了形です。",
 notes:["works は現在形。未来の一時点までの継続を表せない。","worked は過去形。未来の文脈に合わない。","will have worked は未来完了形。来春の退職までに25年以上勤務していることになるという文意に合う。","is working は現在進行形。未来完了のニュアンスを表せない。"]},

{id:423,category:"時制",sentence:"The spokesperson announced that the merger ___ finalized by the end of the fiscal year.",choices:["will be","is","would be","has been"],answer:2,
 point:"過去形の伝達動詞(announced)に続く節では、時制の一致により未来形 will は would に変わります。",
 notes:["will be は単純未来形。主節が過去形のため時制の一致に反する。","is は現在形。未来の予定を表す文意に合わない。","would be は will の過去形。時制の一致により正しい形。","has been は現在完了形。時制の一致の観点からも意味の上でも不適切。"]},

{id:424,category:"時制",sentence:"The train ___ by the time we reached the platform.",choices:["already departed","departs already","had already departed","will already depart"],answer:2,
 point:"過去のある時点(reached the platform)よりも前に完了していた動作は過去完了形で表します。",
 notes:["already departed は過去形。基準となる過去の時点との前後関係を明確に表せない。","departs already は現在形で語順も不自然。","had already departed は過去完了形。ホームに着いた時点ではすでに出発していたという前後関係を正しく表す。","will already depart は未来形。過去の文脈に合わない。"]},

{id:425,category:"仮定法",sentence:"If the company ___ more resources, it could expand into new markets.",choices:["has","have","had","having"],answer:2,
 point:"現在の事実に反する仮定を表す仮定法過去では、if節に動詞の過去形を使います。",
 notes:["has は現在形。仮定法過去では過去形が必要。","have は現在形(原形)。同様に仮定法過去には合わない。","had は過去形。if the company had more resources で仮定法過去の正しい形。","having は動名詞・現在分詞。if節の述語動詞の位置には使えない。"]},

{id:426,category:"仮定法",sentence:"If I ___ you, I would accept the job offer immediately.",choices:["was","am","were","be"],answer:2,
 point:"仮定法過去で be動詞を使う場合、主語が I や3人称単数であっても were を使うのが基本です。",
 notes:["was は口語ではまれに使われるが、仮定法の規範的な形としては were が正しい。","am は現在形。仮定法過去には使えない。","were は仮定法過去の be動詞の形として正しい。","be は原形。if節の定形動詞の位置には使えない。"]},

{id:427,category:"仮定法",sentence:"Had the company invested in digital marketing earlier, it ___ a larger customer base by now.",choices:["will have","would","would have","had"],answer:2,
 point:"if節が仮定法過去完了(Had+過去分詞)で、結果が「現在」に及ぶ場合、帰結節には would + 動詞原形を使う混合仮定法の形になります。",
 notes:["will have は未来完了形。過去の事実に反する仮定の帰結節には使えない。","would は would だけでは動詞 have が続かず、文として不完全。","would have は助動詞 would + 動詞 have(持つ)。過去に投資していれば、今頃はより多くの顧客基盤を持っているだろう、という混合仮定法の帰結節として正しい。","had は過去形。帰結節の助動詞としては不適切。"]},

{id:428,category:"仮定法",sentence:"I wish I ___ more time to prepare for the presentation.",choices:["have","has","had","having"],answer:2,
 point:"wish の後で現在の状況に対する願望を表すときは、動詞の過去形を使います(仮定法過去)。",
 notes:["have は現在形。wish の後の仮定法過去には使えない。","has は現在形。同様に不適切。","had は過去形。I wish I had more time で正しい仮定法過去の形。","having は動名詞。wish の後の節の定形動詞の位置には使えない。"]},

{id:429,category:"仮定法",sentence:"If the weather ___ better, we would have held the event outdoors.",choices:["were","was","had been","is"],answer:2,
 point:"主節が would have + 過去分詞(帰結が過去)の場合、if節は仮定法過去完了(had + 過去分詞)を使います。",
 notes:["were は仮定法過去の形で、現在の事実に反する仮定を表すため、過去の事実に反するこの文脈には合わない。","was は過去形。仮定法過去完了には had been が必要。","had been は仮定法過去完了の形。天候がもっと良かったなら(実際は良くなかった)という過去の事実に反する仮定に合う。","is は現在形。文脈に合わない。"]},

{id:430,category:"仮定法",sentence:"Were the budget approved today, the construction ___ begin next week.",choices:["can","will","could","has"],answer:2,
 point:"Were ~ の倒置形は If ~ were の仮定法で、帰結節には could / would などの助動詞の過去形を使います。",
 notes:["can は現在形の助動詞。仮定法の帰結節には過去形の助動詞が必要。","will は現在形の助動詞。同様に仮定法には合わない。","could は can の過去形。仮定法の帰結節として正しい。","has は一般動詞の現在形で、助動詞として機能せず文法的に誤り。"]},

{id:431,category:"関係詞",sentence:"The employee ___ proposal won the innovation award will present it at the conference.",choices:["who","which","whose","whom"],answer:2,
 point:"後ろに名詞(proposal)が続き、所有の関係を表す関係代名詞は whose です。",
 notes:["who は主格の関係代名詞。後ろに名詞は続かない。","which は物を先行詞とする関係代名詞で、後ろに名詞は続かない。","whose は所有格の関係代名詞。The employee whose proposal ~ で「その提案が~だった従業員」という意味になる。","whom は目的格の関係代名詞。後ろに名詞は続かない。"]},

{id:432,category:"関係詞",sentence:"The hotel ___ we stayed last summer has recently been renovated.",choices:["which","that","where","who"],answer:2,
 point:"先行詞が場所を表し、後ろに完全な文(主語+動詞)が続く場合は関係副詞 where を使います。",
 notes:["which は関係代名詞。後ろは主語や目的語が欠けた不完全な文が続く必要があるが、we stayed は完全な文。","that は同様に関係代名詞で、後ろは不完全な文が必要。","where は関係副詞。The hotel where we stayed last summer で「昨夏泊まったホテル」という正しい意味になる。","who は人を先行詞とする関係代名詞でここでは不適切。"]},

{id:433,category:"関係詞",sentence:"The reason ___ the flight was delayed has not been announced yet.",choices:["where","when","why","who"],answer:2,
 point:"先行詞が理由を表し、後ろに完全な文が続く場合は関係副詞 why を使います。",
 notes:["where は場所を表す先行詞に使う関係副詞。reason(理由)には合わない。","when は時を表す先行詞に使う関係副詞。reason には合わない。","why は理由を表す先行詞 reason に対応する関係副詞として正しい。","who は人を先行詞とする関係代名詞でここでは不適切。"]},

{id:434,category:"関係詞",sentence:"The merger, ___ was finalized last week, will significantly expand the company's market share.",choices:["who","that","which","whom"],answer:2,
 point:"コンマで区切られた非制限用法の関係代名詞には that を使うことができません。物を先行詞とする非制限用法では which を使います。",
 notes:["who は人を先行詞とする関係代名詞でここでは不適切。","that は非制限用法(コンマの後)では使うことができない。","which は物を先行詞とする関係代名詞で、非制限用法でも使用できる。The merger, which was finalized ~ で正しい。","whom は人を先行詞とする目的格の関係代名詞でここでは不適切。"]},

{id:435,category:"関係詞",sentence:"This is the branch ___ handles the highest volume of international transactions.",choices:["whom","whose","that","where"],answer:2,
 point:"先行詞が物(branch)で、関係詞節の中で主語の働きをする場合は that(または which)を使います。",
 notes:["whom は人を先行詞とする目的格の関係代名詞でここでは不適切。","whose は所有格の関係代名詞。後ろに名詞が続く必要があるが、ここでは動詞 handles が続いている。","that は主格の関係代名詞。the branch that handles ~ で「~を扱う支店」という正しい意味になる。","where は関係副詞。後ろに完全な文が必要だが、ここでは主語が欠けた不完全な文(handles the highest volume of international transactions)が続いている。"]},

{id:436,category:"態",sentence:"The new regulations ___ strictly enforced starting next month.",choices:["will enforce","are enforcing","will be enforced","have enforced"],answer:2,
 point:"主語 regulations は「施行される」側なので、受動態(be動詞+過去分詞)が適切です。",
 notes:["will enforce は能動態。regulations が自ら施行する、という意味になり不自然。","are enforcing は能動態の現在進行形。同様に主語が動作主になってしまい不適切。","will be enforced は受動態の未来形。規則が「施行される」という受け身の意味を正しく表す。","have enforced は能動態の現在完了形。主語が動作主になり文意に合わない。"]},

{id:437,category:"態",sentence:"The proposal ___ by the committee before it can move forward.",choices:["must review","is reviewing","must be reviewed","has reviewed"],answer:2,
 point:"主語 proposal は「検討される」側なので、助動詞の後は be + 過去分詞(受動態)にします。",
 notes:["must review は能動態。proposal が検討する側になってしまい不自然。","is reviewing は能動態の現在進行形。同様に不適切。","must be reviewed は受動態。委員会によって「検討されなければならない」という受け身の意味を正しく表す。","has reviewed は能動態の現在完了形。主語が動作主になり文意に合わない。"]},

{id:438,category:"態",sentence:"All applications ___ carefully before a decision is made.",choices:["examine","examines","are examined","have examined"],answer:2,
 point:"主語 applications は「調査される」側なので、受動態を使います。applications は複数形なので be動詞は are になります。",
 notes:["examine は能動態の原形。主語が複数でも能動態では動作主自身が調べることになり不自然。","examines は能動態の三人称単数現在形。主語 applications(複数)とも一致しない。","are examined は受動態現在形。申請書が「注意深く調べられる」という受け身の意味と主語の数が正しく一致する。","have examined は能動態の現在完了形。主語が動作主になり文意に合わない。"]},

{id:439,category:"態",sentence:"The award ___ to the top-performing sales representative at the annual banquet.",choices:["will present","is presenting","will be presented","has presented"],answer:2,
 point:"主語 award は「授与される」側なので受動態を使います。",
 notes:["will present は能動態。award(賞)自体が何かを贈呈することはできず不自然。","is presenting は能動態の現在進行形。同様に主語が動作主になり不適切。","will be presented は受動態の未来形。年次晩さん会で賞が「授与される」という受け身の意味を正しく表す。","has presented は能動態の現在完了形。主語が動作主になり文意に合わない。"]},

{id:440,category:"態",sentence:"The factory ___ down for maintenance every August.",choices:["shuts","is shutting","is shut","has shut"],answer:2,
 point:"主語 factory は「停止させられる」側なので、be動詞+過去分詞の受動態を使います。shut は過去分詞も shut という形になる不規則動詞です。",
 notes:["shuts は能動態の三人称単数現在形。工場自らが何かを閉じることになり不自然。","is shutting は能動態の現在進行形。同様に主語が動作主になり不適切。","is shut は受動態。工場が毎年8月に「停止させられる」という受け身の意味を正しく表す。","has shut は能動態の現在完了形。主語が動作主になり文意に合わない。"]},

{id:441,category:"比較",sentence:"Of all the candidates, Ms. Tanaka has ___ experience in international marketing.",choices:["much","more","the most","many"],answer:2,
 point:"3人以上を比較して「最も〜」という最上級を表すときは the most を使います(experience は不可算名詞)。",
 notes:["much は原級。比較や最上級の意味を表せない。","more は比較級。3人以上の中での最上級には the most が必要。","the most は最上級。全候補者の中でTanakaさんが最も多くの経験を持つという文意に合う。","many は可算名詞に使う原級の形容詞で、不可算名詞 experience には使えず、最上級の意味も表さない。"]},

{id:442,category:"比較",sentence:"The customer service at this branch is ___ better than at any other location.",choices:["very","so","much","too"],answer:2,
 point:"比較級を強調する副詞には much を使います。very は原級の強調に使い、比較級には使えません。",
 notes:["very は原級を強調する副詞で、比較級 better を直接強調できない。","so は通常 so ~ that の構文で使われ、単独で比較級を強調する語としては不自然。","much は比較級を強調する副詞として better を正しく修飾し「はるかに良い」という意味を表す。","too は「〜すぎる」という意味で文脈に合わない。"]},

{id:443,category:"比較",sentence:"The more employees telecommute, ___ the company saves on office space costs.",choices:["more","most","the more","the most"],answer:2,
 point:"「〜すればするほど、ますます…」という構文は The + 比較級 ~, the + 比較級 … の形を使います。",
 notes:["more は the が抜けているため、この構文の後半部分としては不完全。","most は最上級で、この比較構文には合わない。","the more は The more A, the more B の構文の後半として正しい。","the most は最上級に the をつけた形で、この比較構文には合わない。"]},

{id:444,category:"比較",sentence:"This laptop model is ___ as expensive as the previous version.",choices:["two","double","twice","second"],answer:2,
 point:"「〜の2倍…だ」という倍数表現は twice as ~ as の形を使います。",
 notes:["two は数詞で、そのままでは倍数表現として使えない。","double は動詞・形容詞として使われるが、as ~ as の構文の前には使わない。","twice は倍数を表す副詞。twice as expensive as ~ で正しい倍数比較の形になる。","second は序数詞で、倍数表現には使わない。"]},

{id:445,category:"比較",sentence:"Of the two suppliers, the one in Osaka offers ___ prices.",choices:["low","lowest","lower","the lowest"],answer:2,
 point:"2者を比較する場合は比較級を使い、最上級は使いません。",
 notes:["low は原級。比較の文脈では不十分。","lowest は最上級。2者の比較には使わない。","lower は比較級。2つの仕入先を比較して「より低い価格」という文意に合う。","the lowest は最上級に the をつけた形で、3者以上の比較に使うためここでは不適切。"]},

{id:446,category:"代名詞",sentence:"Each department must submit ___ own budget proposal by Friday.",choices:["their","them","its","it"],answer:2,
 point:"each department は単数扱いなので、対応する所有格代名詞は its を使います。",
 notes:["their は複数の所有格代名詞。each department は単数扱いのため不適切。","them は目的格代名詞。所有格の位置には使えない。","its は単数の所有格代名詞。each department に対応する正しい形。","it は主格・目的格代名詞。所有格の位置(直後に名詞 own budget proposal)には使えない。"]},

{id:447,category:"代名詞",sentence:"The two managers discussed the issue ___ before presenting it to the board.",choices:["theirs","them","themselves","their"],answer:2,
 point:"動作をした人物自身を強調する場合は再帰代名詞(-self/-selves)を使います。",
 notes:["theirs は所有代名詞。「彼らのもの」という意味で文脈に合わない。","them は目的格代名詞。強調の意味を表せない。","themselves は再帰代名詞。「(他の人に任せず)自分たちで」その問題を話し合ったという強調の文意に合う。","their は所有格代名詞。後ろに名詞が必要でここでは使えない。"]},

{id:448,category:"代名詞",sentence:"If you have any questions about the contract, please direct ___ to the legal department.",choices:["it","they","them","those"],answer:2,
 point:"先行する複数名詞 questions を受ける代名詞は、目的格の them です。",
 notes:["it は単数の代名詞。questions(複数)を受けることはできない。","they は主格代名詞。動詞 direct の目的語の位置には使えない。","them は目的格代名詞。複数名詞 questions を正しく受ける。","those は指示代名詞で「それらの人・もの」を漠然と指す語であり、questions を直接受ける代名詞としては不自然。"]},

{id:449,category:"代名詞",sentence:"The company values its employees' opinions more than ___ of its competitors.",choices:["that","it","those","them"],answer:2,
 point:"前に出た複数名詞(opinions)の代わりに使う指示代名詞は those です。",
 notes:["that は単数名詞の代用に使う指示代名詞。opinions(複数)の代用にはならない。","it は単数の代名詞。opinions を受けることはできない。","those は複数名詞の代用に使う指示代名詞。opinions of its competitors の代わりとして正しい。","them は目的格代名詞で特定の名詞をそのまま指す語であり、比較対象を漠然と示す指示代名詞としては those が自然。"]},

{id:450,category:"代名詞",sentence:"Neither of the candidates submitted ___ application on time.",choices:["his","hers","their","theirs"],answer:2,
 point:"neither や each などの不定代名詞を受ける所有格には、性別を限定しない their が現代英語では広く使われます。",
 notes:["his は男性限定の所有格代名詞。候補者の性別が特定されていないため不適切。","hers は女性限定の所有代名詞で、後ろに名詞が続く所有格の位置には使えない。","their は性別を限定しない所有格代名詞。neither of the candidates を受ける代名詞として自然に使われる。","theirs は所有代名詞。後ろに名詞 application が続く所有格の位置には使えない。"]}
];

const VOCAB_PAGE_SIZE = 10;

const CATEGORIES = [...new Set(QUESTIONS.map(q => q.category))];

/* ---------------- パスワード保護 ---------------- */
const APP_PASSWORD = "1234"; // ここを書き換えれば合言葉を変更できます
const AUTH_STORAGE_KEY = "toeicAppAuthed_v1";

/* ---------------- 進捗データ ---------------- */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveProgress(progress) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function recordAnswer(progress, qId, correct) {
  if (!progress[qId]) progress[qId] = {attempts:0, correctCount:0, lastCorrect:false};
  progress[qId].attempts += 1;
  if (correct) progress[qId].correctCount += 1;
  progress[qId].lastCorrect = correct;
  saveProgress(progress);
}

/* ---------------- 学習カレンダー（日別記録） ---------------- */
const DAILY_LOG_KEY = "toeicDailyLog_v1";
function loadDailyLog() {
  try {
    const raw = localStorage.getItem(DAILY_LOG_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveDailyLog(log) {
  localStorage.setItem(DAILY_LOG_KEY, JSON.stringify(log));
}
function pad2(n) { return String(n).padStart(2, "0"); }
function dateKey(y, m, d) { return y + "-" + pad2(m + 1) + "-" + pad2(d); }
function todayKey() {
  const d = new Date();
  return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
}
function recordDailyAnswer(correct) {
  const key = todayKey();
  if (!dailyLog[key]) dailyLog[key] = {attempts:0, correctCount:0};
  dailyLog[key].attempts += 1;
  if (correct) dailyLog[key].correctCount += 1;
  saveDailyLog(dailyLog);
}

/* ---------------- ブックマーク ---------------- */
const BOOKMARK_STORAGE_KEY = "toeicBookmarks_v1";
function loadBookmarks() {
  try {
    const raw = localStorage.getItem(BOOKMARK_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveBookmarks(bm) {
  localStorage.setItem(BOOKMARK_STORAGE_KEY, JSON.stringify(bm));
}
function isBookmarked(qId) {
  return !!bookmarks[qId];
}
function toggleBookmark(qId) {
  if (bookmarks[qId]) delete bookmarks[qId];
  else bookmarks[qId] = true;
  saveBookmarks(bookmarks);
}
function getBookmarkedQuestions() {
  return QUESTIONS.filter(q => bookmarks[q.id]);
}

/* ---------------- 状態 ---------------- */
let progress = loadProgress();
let dailyLog = loadDailyLog();
let bookmarks = loadBookmarks();
let session = null; // {queue, pointer, answers: {id: bool}, answeredThis: bool}

/* ---------------- ユーティリティ ---------------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function computeOverallStats() {
  let total = 0, correct = 0, mastered = 0;
  QUESTIONS.forEach(q => {
    const p = progress[q.id];
    if (p) {
      total += p.attempts;
      correct += p.correctCount;
      if (p.lastCorrect) mastered += 1;
    }
  });
  return {
    total,
    accuracy: total ? Math.round((correct/total)*100) : null,
    mastered
  };
}
function computeCategoryAccuracy(cat) {
  const qs = QUESTIONS.filter(q => q.category === cat);
  let total = 0, correct = 0;
  qs.forEach(q => {
    const p = progress[q.id];
    if (p) { total += p.attempts; correct += p.correctCount; }
  });
  return total ? Math.round((correct/total)*100) : null;
}

  document.getElementById("screen-lock").classList.toggle("hidden", name !== "lock");
  document.getElementById("screen-mode-select").classList.toggle("hidden", name !== "mode-select");
  document.getElementById("screen-home").classList.toggle("hidden", name !== "home");
  document.getElementById("screen-practice").classList.toggle("hidden", name !== "practice");
  document.getElementById("screen-result").classList.toggle("hidden", name !== "result");
  document.getElementById("screen-vocab").classList.toggle("hidden", name !== "vocab");
  document.getElementById("screen-calendar").classList.toggle("hidden", name !== "calendar");
  document.getElementById("screen-bookmark-list").classList.toggle("hidden", name !== "bookmark-list");
  document.getElementById("logout-btn").classList.toggle("hidden", name === "lock");
}

/* ---------------- 認証 ---------------- */
function isAuthenticated() {
  return localStorage.getItem(AUTH_STORAGE_KEY) === "true";
}
function tryUnlock() {
  const input = document.getElementById("lock-password-input");
  const errorEl = document.getElementById("lock-error");
  if (input.value === APP_PASSWORD) {
    localStorage.setItem(AUTH_STORAGE_KEY, "true");
    input.value = "";
    errorEl.classList.add("hidden");
    showScreen("mode-select");
  } else {
    errorEl.classList.remove("hidden");
    input.value = "";
    input.focus();
  }
}
function logout() {
  localStorage.removeItem(AUTH_STORAGE_KEY);
  session = null;
  document.getElementById("lock-password-input").value = "";
  document.getElementById("lock-error").classList.add("hidden");
  showScreen("lock");
  document.getElementById("lock-password-input").focus();
}

/* ---------------- ホーム画面 ---------------- */
function renderHome() {
  const stats = computeOverallStats();
  document.getElementById("stat-total").textContent = stats.total;
  document.getElementById("stat-accuracy").textContent = stats.accuracy === null ? "-" : stats.accuracy + "%";
  document.getElementById("stat-mastered").textContent = stats.mastered;

  const catList = document.getElementById("cat-list");
  catList.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const chip = document.createElement("div");
    chip.className = "cat-chip";
    const acc = computeCategoryAccuracy(cat);
    chip.innerHTML = cat + '<span class="acc">' + (acc === null ? "" : "(" + acc + "%)") + '</span>';
    catList.appendChild(chip);
  });

  const hasWrong = QUESTIONS.some(q => progress[q.id] && progress[q.id].lastCorrect === false);
  document.getElementById("btn-start-wrong").disabled = !hasWrong;
  document.getElementById("btn-start-wrong").style.opacity = hasWrong ? "1" : "0.5";

  const bookmarkedCount = getBookmarkedQuestions().length;
  const btnBookmarked = document.getElementById("btn-start-bookmarked");
  btnBookmarked.textContent = "★ ブックマークした問題だけ解く（" + bookmarkedCount + "問）";
  btnBookmarked.disabled = bookmarkedCount === 0;
  btnBookmarked.style.opacity = bookmarkedCount === 0 ? "0.5" : "1";

  showScreen("home");
}

/* ---------------- 演習セッション ---------------- */
const SESSION_SIZE = 100;

function startSession(filterFn) {
  const pool = QUESTIONS.filter(filterFn);
  if (pool.length === 0) return;
  session = {
    queue: shuffle(pool).slice(0, SESSION_SIZE),
    pointer: 0,
    answers: {},
    answeredThis: false
  };
  showScreen("practice");
  renderQuestion();
}

function startPractice() {
  startSession(() => true);
}

function startWrongOnly() {
  startSession(q => progress[q.id] && progress[q.id].lastCorrect === false);
}

function renderQuestion() {
  const q = session.queue[session.pointer];
  session.answeredThis = false;

  document.getElementById("q-category").textContent = q.category;
  document.getElementById("q-progress").textContent = (session.pointer + 1) + " / " + session.queue.length;
  document.getElementById("progress-bar").style.width = Math.round(((session.pointer) / session.queue.length) * 100) + "%";
  updateBookmarkButton(q.id);

  document.getElementById("q-sentence").innerHTML = q.sentence.replace("___", '<span class="blank">______</span>');

  const choicesEl = document.getElementById("q-choices");
  choicesEl.innerHTML = "";
  q.choices.forEach((choice, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = '<span class="letter">' + LETTERS[idx] + '</span><span>' + choice + '</span>';
    btn.addEventListener("click", () => selectChoice(idx));
    choicesEl.appendChild(btn);
  });

  document.getElementById("q-result").classList.add("hidden");
}

function selectChoice(idx) {
  if (session.answeredThis) return;
  session.answeredThis = true;

  const q = session.queue[session.pointer];
  const correct = idx === q.answer;
  session.answers[q.id] = correct;
  recordAnswer(progress, q.id, correct);
  recordDailyAnswer(correct);

  const buttons = document.querySelectorAll("#q-choices .choice-btn");
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add("correct");
    else if (i === idx) btn.classList.add("wrong");
  });

  const flag = document.getElementById("result-flag");
  flag.textContent = correct ? "正解です！" : "不正解 - 正解は " + LETTERS[q.answer] + ". " + q.choices[q.answer];
  flag.className = "result-flag " + (correct ? "ok" : "ng");

  document.getElementById("explain-point").textContent = q.point;
  const list = document.getElementById("explain-list");
  list.innerHTML = "";
  q.notes.forEach((note, i) => {
    const li = document.createElement("li");
    li.textContent = LETTERS[i] + ". " + note;
    if (i === q.answer) li.classList.add("hit");
    list.appendChild(li);
  });

  document.getElementById("q-result").classList.remove("hidden");
  document.getElementById("progress-bar").style.width = Math.round(((session.pointer + 1) / session.queue.length) * 100) + "%";

  const nextBtn = document.getElementById("btn-next");
  nextBtn.textContent = (session.pointer + 1 < session.queue.length) ? "次の問題へ" : "結果を見る";
}

function nextQuestion() {
  session.pointer += 1;
  if (session.pointer >= session.queue.length) {
    renderResult();
  } else {
    renderQuestion();
  }
}

function renderResult() {
  const total = session.queue.length;
  const correct = Object.values(session.answers).filter(Boolean).length;
  document.getElementById("result-score").textContent = correct + " / " + total;
  document.getElementById("result-accuracy").textContent = "正答率 " + Math.round((correct/total)*100) + "%";

  const byCat = {};
  session.queue.forEach(q => {
    if (!byCat[q.category]) byCat[q.category] = {total:0, correct:0};
    byCat[q.category].total += 1;
    if (session.answers[q.id]) byCat[q.category].correct += 1;
  });
  const breakEl = document.getElementById("result-cat-break");
  breakEl.innerHTML = "";
  Object.keys(byCat).forEach(cat => {
    const row = document.createElement("div");
    row.className = "cat-break-row";
    row.innerHTML = "<span>" + cat + "</span><span>" + byCat[cat].correct + " / " + byCat[cat].total + "</span>";
    breakEl.appendChild(row);
  });

  showScreen("result");
}

let vocabPage = 0;

  const totalPages = Math.ceil(VOCAB.length / VOCAB_PAGE_SIZE);
  const start = vocabPage * VOCAB_PAGE_SIZE;
  const pageWords = VOCAB.slice(start, start + VOCAB_PAGE_SIZE);

  document.getElementById("vocab-page-indicator").textContent = (vocabPage + 1) + " / " + totalPages;
  document.getElementById("vocab-progress-bar").style.width = Math.round(((vocabPage + 1) / totalPages) * 100) + "%";

  const listEl = document.getElementById("vocab-list");
  listEl.innerHTML = "";
  listEl.className = "vocab-list";
  pageWords.forEach(w => {
    const card = document.createElement("div");
    card.className = "vocab-card";
    card.innerHTML =
      '<div class="vocab-head"><span class="vocab-word">' + w.word + '</span><span class="vocab-pos">' + w.pos + '</span></div>' +
      '<div class="vocab-meaning">' + w.meaning + '</div>' +
      '<div class="vocab-example">' + w.example + '</div>' +
      '<div class="vocab-example-ja">' + w.exampleJa + '</div>';
    listEl.appendChild(card);
  });

  document.getElementById("btn-vocab-prev").disabled = vocabPage === 0;
  document.getElementById("btn-vocab-next").disabled = vocabPage >= totalPages - 1;

  showScreen("vocab");
}

/* ---------------- 学習カレンダー画面 ---------------- */
let calViewYear, calViewMonth; // calViewMonth は 0-indexed
let calSelectedDate = null;

function computeStreakAndTotal() {
  const totalDays = Object.keys(dailyLog).filter(k => dailyLog[k].attempts > 0).length;

  let streak = 0;
  const cursor = new Date();
  cursor.setHours(0, 0, 0, 0);
  let key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
  if (!dailyLog[key] || dailyLog[key].attempts === 0) {
    cursor.setDate(cursor.getDate() - 1);
    key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
  }
  while (dailyLog[key] && dailyLog[key].attempts > 0) {
    streak += 1;
    cursor.setDate(cursor.getDate() - 1);
    key = dateKey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
  }
  return { totalDays, streak };
}

function renderCalDetail(key) {
  const detailEl = document.getElementById("cal-detail");
  const rec = dailyLog[key];
  detailEl.classList.remove("hidden");
  document.getElementById("cal-detail-date").textContent = key;
  if (rec && rec.attempts > 0) {
    const acc = Math.round((rec.correctCount / rec.attempts) * 100);
    document.getElementById("cal-detail-stats").innerHTML =
      "<span>学習問題数: " + rec.attempts + "問</span><span>正答率: " + acc + "%</span>";
  } else {
    document.getElementById("cal-detail-stats").textContent = "この日の学習記録はありません";
  }
}

function renderCalendar() {
  const { totalDays, streak } = computeStreakAndTotal();
  document.getElementById("cal-total-days").textContent = totalDays;
  document.getElementById("cal-streak").textContent = streak;

  document.getElementById("cal-month-label").textContent = calViewYear + "年" + (calViewMonth + 1) + "月";

  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";
  ["日", "月", "火", "水", "木", "金", "土"].forEach(w => {
    const el = document.createElement("div");
    el.className = "cal-weekday";
    el.textContent = w;
    grid.appendChild(el);
  });

  const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  const todayKeyStr = todayKey();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "cal-day empty";
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(calViewYear, calViewMonth, d);
    const rec = dailyLog[key];
    const hasRecord = !!(rec && rec.attempts > 0);
    const el = document.createElement("div");
    el.className = "cal-day"
      + (hasRecord ? " has-record" : "")
      + (key === todayKeyStr ? " today" : "")
      + (key === calSelectedDate ? " selected" : "");
    el.innerHTML = String(d) + (hasRecord ? '<span class="dot"></span>' : "");
    el.addEventListener("click", () => {
      calSelectedDate = key;
      renderCalendar();
      renderCalDetail(key);
    });
    grid.appendChild(el);
  }
}

function openCalendar() {
  const now = new Date();
  calViewYear = now.getFullYear();
  calViewMonth = now.getMonth();
  calSelectedDate = null;
  document.getElementById("cal-detail").classList.add("hidden");
  renderCalendar();
  showScreen("calendar");
}

/* ---------------- ブックマーク UI ---------------- */
function updateBookmarkButton(qId) {
  const btn = document.getElementById("btn-bookmark");
  const active = isBookmarked(qId);
  btn.textContent = active ? "★" : "☆";
  btn.classList.toggle("active", active);
}

function renderBookmarkList() {
  const listEl = document.getElementById("bookmark-list");
  listEl.innerHTML = "";
  const qs = getBookmarkedQuestions();
  if (qs.length === 0) {
    listEl.innerHTML = '<div style="text-align:center; color:var(--muted); padding:24px 0;">ブックマークした問題はありません</div>';
    return;
  }
  qs.forEach(q => {
    const row = document.createElement("div");
    row.className = "bookmark-row";
    row.innerHTML =
      '<div class="bookmark-row-main">' +
        '<span class="badge">' + q.category + '</span>' +
        '<div class="bookmark-row-sentence">' + q.sentence.replace("___", "______") + '</div>' +
      '</div>' +
      '<button class="link bookmark-remove-btn" data-id="' + q.id + '">解除</button>';
    listEl.appendChild(row);
  });
  listEl.querySelectorAll(".bookmark-remove-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      toggleBookmark(Number(btn.dataset.id));
      renderBookmarkList();
    });
  });
}

function openBookmarkList() {
  renderBookmarkList();
  showScreen("bookmark-list");
}

/* ---------------- イベント登録 ---------------- */
document.getElementById("btn-lock-submit").addEventListener("click", tryUnlock);
document.getElementById("lock-password-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryUnlock();
});
document.getElementById("logout-btn").addEventListener("click", logout);
document.getElementById("btn-mode-grammar").addEventListener("click", renderHome);
document.getElementById("btn-mode-vocab").addEventListener("click", () => { vocabPage = 0; renderVocabPage(); });
document.getElementById("btn-mode-calendar").addEventListener("click", openCalendar);
document.getElementById("btn-home-to-mode").addEventListener("click", () => showScreen("mode-select"));
document.getElementById("btn-home-to-calendar").addEventListener("click", openCalendar);
document.getElementById("btn-vocab-to-mode").addEventListener("click", () => showScreen("mode-select"));
document.getElementById("btn-calendar-to-mode").addEventListener("click", () => showScreen("mode-select"));
document.getElementById("btn-cal-prev").addEventListener("click", () => {
  calViewMonth -= 1;
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear -= 1; }
  renderCalendar();
});
document.getElementById("btn-cal-next").addEventListener("click", () => {
  calViewMonth += 1;
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear += 1; }
  renderCalendar();
});
document.getElementById("btn-vocab-prev").addEventListener("click", () => { if (vocabPage > 0) { vocabPage -= 1; renderVocabPage(); } });
document.getElementById("btn-vocab-next").addEventListener("click", () => {
  const totalPages = Math.ceil(VOCAB.length / VOCAB_PAGE_SIZE);
  if (vocabPage < totalPages - 1) { vocabPage += 1; renderVocabPage(); }
});
document.getElementById("btn-start").addEventListener("click", startPractice);
document.getElementById("btn-start-wrong").addEventListener("click", startWrongOnly);
document.getElementById("btn-start-bookmarked").addEventListener("click", () => {
  startSession(q => !!bookmarks[q.id]);
});
document.getElementById("btn-bookmark-list").addEventListener("click", openBookmarkList);
document.getElementById("btn-bookmarklist-to-home").addEventListener("click", renderHome);
document.getElementById("btn-bookmark").addEventListener("click", () => {
  const q = session.queue[session.pointer];
  toggleBookmark(q.id);
  updateBookmarkButton(q.id);
});
document.getElementById("btn-next").addEventListener("click", nextQuestion);
document.getElementById("btn-quit").addEventListener("click", () => { session = null; renderHome(); });
document.getElementById("btn-retry").addEventListener("click", () => {
  const cats = new Set(session.queue.map(q => q.category));
  startSession(q => cats.has(q.category));
});
document.getElementById("btn-home").addEventListener("click", () => { session = null; renderHome(); });
document.getElementById("btn-reset").addEventListener("click", () => {
  if (confirm("進捗をすべてリセットします。よろしいですか？")) {
    progress = {};
    saveProgress(progress);
    renderHome();
  }
});

showScreen(isAuthenticated() ? "mode-select" : "lock");

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.error("Service worker registration failed:", err);
    });
  });
}
</script>
