 notes:["who は主格の関係代名詞で、後ろに直接名詞を続けることができない。","which は物を先行詞とする関係代名詞で、人を表す employee には使わない。","that も後ろに直接名詞を続けることができない。","whose は所有格の関係代名詞で、その従業員の提案（the employee's proposal）という所有関係を正しく表す。"]},

{id:347,category:"関係詞",sentence:"The building ___ the company is headquartered was constructed in 1998.",choices:["which","who","that","in which"],answer:3,
 point:"be headquartered in ~（〜に本社を置く）という前置詞を伴う表現のため、前置詞＋関係代名詞の形 in which が使われます。",
 notes:["which だけでは、is headquartered の後の前置詞 in が欠けてしまい文が成立しない。","who は人を先行詞とする関係代名詞で、building（建物）には使わない。","that も前置詞を直前に置くことができない。","in which は前置詞 in を含み、the company is headquartered in the building という元の文を正しく表す。"]},

{id:348,category:"関係詞",sentence:"The report, ___ was submitted late, contained several critical errors.",choices:["that","who","whose","which"],answer:3,
 point:"コンマを伴う非制限用法では関係代名詞 that を使うことができません。物を先行詞とする非制限用法には which が使われます。",
 notes:["that は非制限用法（コンマを伴う用法）には使えない。","who は人を先行詞とする関係代名詞で、report（報告書）には使わない。","whose は所有格で、この文脈には合わない。","which は非制限用法で物を先行詞とする際に正しく使われる。"]},

{id:349,category:"関係詞",sentence:"The factory ___ the accident occurred has since improved its safety protocols significantly.",choices:["which","that","in that","where"],answer:3,
 point:"先行詞 factory（場所）を受け、その場所の中での出来事を説明する場合には関係副詞 where が使われます。",
 notes:["which は関係代名詞で、後ろに主語や目的語が欠けた不完全な文が続く必要があるが、the accident occurred は完全な文であるため合わない。","that も関係代名詞として同様の理由で合わない。","in that という表現は文法的にこの形では使わない。","where は関係副詞で、完全な文を続けながら factory という場所を正しく修飾する。"]},

{id:350,category:"関係詞",sentence:"The reason ___ the shipment was delayed remains unclear to the logistics team.",choices:["which","who","what","why"],answer:3,
 point:"先行詞 reason（理由）を受ける関係副詞には why が使われます。",
 notes:["which は関係代名詞で、後ろに不完全な文が続く必要があるが、ここでは完全な文が続くため合わない。","who は人を先行詞とする関係代名詞で、reason には使わない。","what は先行詞を含む関係代名詞で、reason という先行詞がすでにあるここでは使えない。","why は関係副詞で、reason を先行詞として正しく使われる。"]},

{id:351,category:"関係詞",sentence:"The seminar, ___ attracted over 300 participants, will be held again next year.",choices:["that","who","whose","which"],answer:3,
 point:"コンマを伴う非制限用法では that は使えません。物を先行詞とする非制限用法の主格には which が使われます。",
 notes:["that は非制限用法には使えない。","who は人を先行詞とする関係代名詞で、seminar には使わない。","whose は所有格で、この文脈には合わない。","which は非制限用法の主格として正しく使われる。"]},

{id:352,category:"関係詞",sentence:"___ impressed the investors most was the company's rapid revenue growth.",choices:["That","Which","Who","What"],answer:3,
 point:"先行詞を含み「〜こと」という意味を表す関係代名詞 what が文の主語として使われます。",
 notes:["That は先行詞を含まないため、単独で文の主語にはなれない。","Which も先行詞を必要とするため、先行詞のないこの文では使えない。","Who も先行詞（人）を必要とするため使えない。","What は先行詞を含む関係代名詞で「投資家を最も驚かせたこと」という意味を表し、文の主語として正しく使われる。"]},

{id:353,category:"関係詞",sentence:"This is the exact model ___ our engineers recommended for the new assembly line.",choices:["whose","who","where","that"],answer:3,
 point:"先行詞 model（物）を受け、動詞 recommended の目的語となる関係代名詞には that（または which）が使われます。",
 notes:["whose は所有格で、この文脈には合わない。","who は人を先行詞とする関係代名詞で、model には使わない。","where は関係副詞で、後ろに完全な文が必要だが、ここでは目的語が欠けた不完全な文であるため合わない。","that は目的格の関係代名詞として正しく使われる。"]},

{id:354,category:"関係詞",sentence:"The negotiations, ___ outcome will affect thousands of employees, are expected to conclude next week.",choices:["that","who","which","whose"],answer:3,
 point:"先行詞 negotiations（物）と後ろの名詞 outcome の所有関係を表すには所有格の関係代名詞 whose が使われます。whose は人だけでなく物にも使うことができます。",
 notes:["that は所有格の用法を持たず、後ろに直接名詞を続けることができない。","who は人を先行詞とする関係代名詞で、negotiations には使わない。","which は所有格の用法を持たず、後ろに直接名詞を続けることができない。","whose は所有格の関係代名詞で、negotiations の outcome（結果）という所有関係を正しく表す。"]},

{id:355,category:"関係詞",sentence:"The department ___ productivity increased the most this year will be recognized at the annual meeting.",choices:["that","which","who","whose"],answer:3,
 point:"先行詞 department（物）と後ろの名詞 productivity の所有関係を表すには所有格の関係代名詞 whose が使われます。",
 notes:["that は所有格の用法を持たず、後ろに直接名詞を続けることができない。","which も所有格の用法を持たず、同様に使えない。","who は人を先行詞とする関係代名詞で、department には使わない。","whose は所有格の関係代名詞で、the department's productivity という所有関係を正しく表す。"]},

{id:356,category:"関係詞",sentence:"The two candidates, neither of ___ had prior management experience, were both hired for entry-level roles.",choices:["who","which","that","whom"],answer:3,
 point:"前置詞 of の後に置かれる関係代名詞は目的格でなければならないため、whom が使われます。",
 notes:["who は主格の関係代名詞で、前置詞の直後には使えない。","which は物を先行詞とする関係代名詞で、candidates（人）には使わない。","that も前置詞を直前に置くことができない。","whom は目的格の関係代名詞で、前置詞 of の後に正しく使われる。"]},

{id:357,category:"仮定法",sentence:"If the shipment ___ delayed, we would need to inform the client immediately.",choices:["is","was","has been","were"],answer:3,
 point:"現在の事実に反する仮定を表す仮定法過去では、if節の be動詞は主語に関わらず were が使われます。",
 notes:["is は直説法の現在形で、仮定法には使わない。","was も口語で使われることがあるが、フォーマルな仮定法過去では were が標準とされる。","has been は現在完了形で、仮定法過去の構文には合わない。","were は仮定法過去の be動詞の形として正しく使われる。"]},

{id:358,category:"仮定法",sentence:"I wish I ___ more time right now to review the contract before signing it.",choices:["have","has","had had","had"],answer:3,
 point:"wish の後で現在の事実に反する願望を表す場合、動詞は過去形（仮定法過去）が使われます。",
 notes:["have は直説法の現在形で、wish の後の仮定法には使わない。","has も同様に直説法の現在形で不適切。","had had は過去完了形で、過去の事実に反する願望を表す際に使うが、right now という現在の文脈には合わない。","had は仮定法過去の形で、現在の事実に反する願望を正しく表す。"]},

{id:359,category:"仮定法",sentence:"If the company had diversified its product line earlier, it ___ such a steep decline in sales last year.",choices:["would not experience","did not experience","would not have experienced","has not experienced"],answer:3,
 point:"if節が had + 過去分詞（仮定法過去完了）のとき、主節は would have + 過去分詞が使われます。",
 notes:["would not experience は would + 原形で、仮定法過去（現在の事実に反する仮定）の帰結節の形であり、if節の時制と一致しない。","did not experience は直説法の過去形で、仮定法の帰結節には使わない。","has not experienced は現在完了形で、仮定法の帰結節には使わない。","would not have experienced は would have + 過去分詞で、仮定法過去完了の帰結節として if節の時制と正しく一致する。"]},

{id:360,category:"仮定法",sentence:"It is imperative that the CEO ___ informed of any changes to the merger agreement.",choices:["is","was","will be","be"],answer:3,
 point:"It is imperative that ~ のように必要性を表す表現に続くthat節では、動詞は原形（仮定法現在）になります。",
 notes:["is は三人称単数現在形で、この構文には原形が使われるため不適切。","was は過去形で、同様に不適切。","will be は未来形で、この構文には使わない。","be は原形で、imperative that ~ be informed という仮定法現在として正しく使われる。"]},

{id:361,category:"仮定法",sentence:"If I ___ you, I would accept the job offer without hesitation.",choices:["am","was","have been","were"],answer:3,
 point:"仮定法過去では、be動詞は主語の人称に関わらず were が使われるのが標準的な形です。",
 notes:["am は直説法の現在形で、仮定法には使わない。","was も口語では使われることがあるが、フォーマルな文法では were が正式とされる。","have been は現在完了形で、仮定法過去の構文には合わない。","were は仮定法過去における be動詞の標準形として正しく使われる。"]},

{id:362,category:"仮定法",sentence:"The auditor insisted that the financial records ___ reviewed again before the report was finalized.",choices:["are","were","have been","be"],answer:3,
 point:"insist that ~ のように要求・主張を表す動詞に続くthat節では、動詞は原形（仮定法現在）になります。",
 notes:["are は現在形で、この構文には原形が使われるため不適切。","were は過去形で、同様に不適切。","have been は現在完了形で、この構文には使わない。","be は原形で、insisted that ~ be reviewed という仮定法現在の受動態として正しく使われる。"]},

{id:363,category:"仮定法",sentence:"Had the team followed the original schedule, the product ___ launched on time.",choices:["would launch","will be","was","would have been"],answer:3,
 point:"Had the team followed ~（if it had followed ~ の倒置形）に対応する主節では、would have + 過去分詞（受動態はwould have been + 過去分詞）が使われます。",
 notes:["would launch は would + 原形で、仮定法過去の帰結節の形であり、Had ~ という仮定法過去完了の倒置形とは時制が一致しない。","will be は直説法の未来形で、仮定法の帰結節には使わない。","was は直説法の過去形で、同様に使わない。","would have been は仮定法過去完了の帰結節（受動態）として正しく、Had the team followed ~ の時制と一致する。"]},

{id:364,category:"仮定法",sentence:"If the marketing budget ___ cut next year, several planned campaigns would have to be canceled.",choices:["is","will be","has been","were"],answer:3,
 point:"仮定法過去では、if節の be動詞は were が使われます。",
 notes:["is は直説法の現在形で、仮定法には使わない。","will be は未来形で、if節には使わない。","has been は現在完了形で、仮定法過去の構文には合わない。","were は仮定法過去の be動詞の形として正しく使われる。"]},

{id:365,category:"仮定法",sentence:"The board recommended that the merger ___ postponed until the audit was complete.",choices:["is","was","has been","be"],answer:3,
 point:"recommend that ~ のように提案を表す動詞に続くthat節では、動詞は原形（仮定法現在）になります。",
 notes:["is は現在形で、この構文には原形が使われるため不適切。","was は過去形で、同様に不適切。","has been は現在完了形で、この構文には使わない。","be は原形で、recommended that ~ be postponed という仮定法現在の受動態として正しく使われる。"]},

{id:366,category:"仮定法",sentence:"If it had not been for the quick action of the IT team, the entire system ___ crashed.",choices:["will have","would","has","would have"],answer:3,
 point:"If it had not been for ~（もし〜がなかったら）という仮定法過去完了の慣用表現に対応する主節では、would have + 過去分詞が使われます。",
 notes:["will have は直説法の未来完了的な表現で、仮定法の帰結節には使わない。","would だけでは過去分詞 crashed と組み合わせて完了の意味を作れない。","has は直説法の現在完了形で、仮定法の帰結節には使わない。","would have は would have crashed という仮定法過去完了の帰結節を正しく作る。"]},

{id:367,category:"仮定法",sentence:"Suppose the client ___ unhappy with the final design, what would the agency do next?",choices:["is","was","has been","were"],answer:3,
 point:"suppose（もし〜だとしたら）に続く仮定法では、be動詞は were が使われます。",
 notes:["is は直説法の現在形で、仮定法の文脈には使わない。","was も口語では使われるが、フォーマルな仮定法表現では were が好まれる。","has been は現在完了形で、この構文には合わない。","were は suppose の後の仮定法で使われる be動詞の形として正しい。"]},

{id:368,category:"代名詞",sentence:"Each department must submit ___ own budget proposal by the end of the month.",choices:["their","them","they","its"],answer:3,
 point:"each department は単数扱いのため、所有格の代名詞は単数形の its が使われます。",
 notes:["their は複数形の所有格で、単数扱いの each department とは一致しない。","them は目的格で、名詞の前に置く所有格の位置には使えない。","they は主格で、同様にこの位置には使えない。","its は単数形の所有格で、each department と正しく一致する。"]},

{id:369,category:"代名詞",sentence:"The manager gave the new employees a tour of the office and introduced ___ to the rest of the staff.",choices:["they","theirs","their","them"],answer:3,
 point:"動詞 introduced の目的語となるのは目的格の代名詞です。",
 notes:["they は主格で、動詞の目的語には使えない。","theirs は所有代名詞で、意味が合わない。","their は所有格で、後ろに名詞が必要なため、単独では動詞の目的語になれない。","them は目的格で、introduced の目的語として正しく使われる。"]},

{id:370,category:"代名詞",sentence:"The two companies agreed to share the costs of the joint venture between ___.",choices:["them","they","theirs","themselves"],answer:3,
 point:"主語（the two companies）と前置詞 between の目的語が同一の対象を指す場合、再帰代名詞 themselves が使われます。",
 notes:["them は目的格だが、主語と同一対象を指す再帰的な文脈では再帰代名詞を使うのが適切。","they は主格で、前置詞の目的語には使えない。","theirs は所有代名詞で、意味が合わない。","themselves は再帰代名詞で、between themselves「両社の間で」という意味を正しく表す。"]},

{id:371,category:"代名詞",sentence:"Neither of the proposals fully addressed the client's concerns, so the team revised ___.",choices:["it","those","one","them"],answer:3,
 point:"proposals（複数）を指す代名詞として、複数形の目的格 them が使われます。",
 notes:["it は単数を指す代名詞で、複数の proposals には合わない。","those は遠くのものを指す指示代名詞で、この文脈にはやや不自然。","one は単数の可算名詞を指す代名詞で、複数の proposals には合わない。","them は複数の proposals を正しく指す。"]},

{id:372,category:"代名詞",sentence:"The new employee introduced ___ to the team during the morning meeting.",choices:["her","hers","she","herself"],answer:3,
 point:"主語と動詞 introduced の目的語が同一人物を指す場合、再帰代名詞が使われます。",
 notes:["her は目的格・所有格として使えるが、主語と同一人物を指す場合は再帰代名詞を使うのが正しい。","hers は所有代名詞で、意味が合わない。","she は主格で、動詞の目的語には使えない。","herself は再帰代名詞で、新入社員が自分自身を紹介したという意味を正しく表す。"]},

{id:373,category:"代名詞",sentence:"This laptop is faster than ___ I used at my previous job.",choices:["it","those","that","the one"],answer:3,
 point:"前に出た単数名詞（laptop）の繰り返しを避け、後ろに修飾語（I used）を伴う場合には代名詞 the one が使われます。",
 notes:["it は単独で使われ、後ろに関係詞節を伴って修飾することができない。","those は複数を指す代名詞で、単数の laptop とは一致しない。","that は単独では「あれ」を指すが、後ろに修飾語を伴って使う場合は the one の方が自然。","the one は前出の名詞の代わりとして使われ、後ろの I used という修飾語を正しく伴うことができる。"]},

{id:374,category:"代名詞",sentence:"The company values customer feedback and takes ___ seriously when making decisions.",choices:["them","those","one","it"],answer:3,
 point:"feedback は不可算名詞で単数扱いのため、代名詞は単数形の it が使われます。",
 notes:["them は複数を指す代名詞で、不可算名詞の feedback とは一致しない。","those も複数を指すため、同様に不適切。","one は単数の可算名詞を指す代名詞で、不可算名詞の feedback には使えない。","it は不可算名詞の feedback を正しく指す。"]},

{id:375,category:"代名詞",sentence:"If the invoice contains any errors, please notify us and we will correct ___ immediately.",choices:["it","one","those","them"],answer:3,
 point:"errors（複数）を指す代名詞として、複数形の目的格 them が使われます。",
 notes:["it は単数を指す代名詞で、複数の errors には合わない。","one は単数の可算名詞を指す代名詞で、複数の errors には合わない。","those は遠くのものを指す指示代名詞で、この文脈にはやや不自然。","them は複数の errors を正しく指す。"]},

{id:376,category:"代名詞",sentence:"The two managers could not agree on the proposal, so ___ decided to consult a third party.",choices:["either","neither","it","they"],answer:3,
 point:"the two managers（2人のマネージャー）を指す主格の代名詞として they が使われます。",
 notes:["either は「2つのうち一方」という意味で、両者を指す文意とは合わない。","neither は「どちらも〜ない」という意味で、第三者に相談することにしたという文意と矛盾する。","it は単数を指す代名詞で、2人を指すには合わない。","they は2人のマネージャーを指す主格の代名詞として正しく使われる。"]},

{id:377,category:"代名詞",sentence:"Please make sure the new interns understand ___ responsibilities before their first day.",choices:["them","theirs","they","their"],answer:3,
 point:"名詞 responsibilities を修飾するのは所有格の代名詞です。",
 notes:["them は目的格で、名詞を直接修飾できない。","theirs は所有代名詞で、単独で名詞を修飾する形では使わない。","they は主格で、名詞を修飾できない。","their は所有格で、responsibilities を正しく修飾する。"]},

{id:378,category:"代名詞",sentence:"The success of the campaign was due to the marketing team ___, who worked overtime for weeks.",choices:["them","theirs","itself","themselves"],answer:3,
 point:"the marketing team を強調する再帰代名詞として themselves が使われます（チームを構成する人々を意識した用法）。",
 notes:["them は目的格の代名詞で、強調用法には使わない。","theirs は所有代名詞で、意味が合わない。","itself は単数の再帰代名詞で、チームを一つの集合体として強調する場合に使うが、後ろの who worked（人を表す関係詞）と合わせるとチームの構成員を意識した themselves がより自然。","themselves は再帰代名詞の強調用法で、チームのメンバー自身を正しく強調する。"]},

{id:379,category:"態",sentence:"The new safety guidelines ___ to all employees before the factory reopens.",choices:["will explain","are explaining","have explained","will be explained"],answer:3,
 point:"主語 guidelines（指針）は「説明される」側であるため、受動態が使われます。",
 notes:["will explain は能動態の未来形で、guidelines が「説明する」という意味になり不自然。","are explaining は能動態の現在進行形で、同様に意味が合わない。","have explained は能動態の現在完了形で、同様に不適切。","will be explained は受動態の未来形で、指針が従業員に説明されるという意味を正しく表す。"]},

{id:380,category:"態",sentence:"The proposal ___ by the board of directors at yesterday's meeting.",choices:["approved","has approved","was approving","was approved"],answer:3,
 point:"主語 proposal（提案）は「承認される」側であるため、受動態が使われます。yesterday's meeting という過去の時点を表す語句があるため過去形になります。",
 notes:["approved は能動態の過去形で、proposal が「承認する」という意味になり不自然。","has approved は能動態の現在完了形で、意味も時制も合わない。","was approving は受動態ではない誤った形で文法的に不適切。","was approved は受動態の過去形で、提案が取締役会によって承認されたという意味を正しく表す。"]},

{id:381,category:"態",sentence:"The annual report is currently ___ by the finance department.",choices:["reviewing","review","reviewed","being reviewed"],answer:3,
 point:"主語 report（報告書）は「検討される」側であり、現在進行中の動作であるため、進行形の受動態（be + being + 過去分詞）が使われます。",
 notes:["reviewing は能動態の現在分詞で、report が「検討する」という意味になり不自然。","review は動詞の原形で、is の後に続く形としては不適切。","reviewed は過去分詞だが、is reviewed だけでは進行中というニュアンスが弱く、currently という語句には being reviewed がより適切。","being reviewed は進行形の受動態で、財務部によって現在検討されているという意味を正しく表す。"]},

{id:382,category:"態",sentence:"The contract ___ before the client arrives for the signing ceremony.",choices:["must finalize","must be finalizing","must have finalized","must be finalized"],answer:3,
 point:"主語 contract（契約書）は「最終決定される」側であるため、助動詞＋受動態（must be + 過去分詞）が使われます。",
 notes:["must finalize は能動態で、contract が「最終決定する」という意味になり不自然。","must be finalizing は進行形の受動態としては誤った形で文法的に不適切。","must have finalized は能動態の完了形で、意味が合わない。","must be finalized は助動詞＋受動態で、契約書が調印式の前に最終決定されなければならないという意味を正しく表す。"]},

{id:383,category:"態",sentence:"The malfunctioning equipment ___ by a technician sometime next week.",choices:["will repair","will be repairing","is repairing","will be repaired"],answer:3,
 point:"主語 equipment（機器）は「修理される」側であるため、受動態が使われます。",
 notes:["will repair は能動態の未来形で、equipment が「修理する」という意味になり不自然。","will be repairing は能動態の未来進行形で、同様に意味が合わない。","is repairing は能動態の現在進行形で、未来の意味も表せず不適切。","will be repaired は受動態の未来形で、技術者によって機器が修理されるという意味を正しく表す。"]},

{id:384,category:"態",sentence:"By the end of the fiscal year, the new branch offices ___ in three major cities.",choices:["will open","are opening","have opened","will have been opened"],answer:3,
 point:"主語 offices（支店）は「開設される」側であり、By the end of ~ という未来の一時点までの完了を表すため、未来完了形の受動態が使われます。",
 notes:["will open は能動態の未来形で、offices が「開く」という意味になり、態も時制も文脈に合わない。","are opening は能動態の現在進行形で、未来の完了を表せない。","have opened は能動態の現在完了形で、未来の一時点までの完了を表せない。","will have been opened は未来完了形の受動態で、年度末までに支店が開設されているという意味を正しく表す。"]},

{id:385,category:"態",sentence:"All visitors ___ to sign in at the front desk before entering the building.",choices:["require","are requiring","have required","are required"],answer:3,
 point:"主語 visitors（訪問者）は「求められる」側であるため、受動態（be required to do）が使われます。",
 notes:["require は能動態の現在形で、visitors が「要求する」という意味になり不自然。","are requiring は能動態の現在進行形で、同様に意味が合わない。","have required は能動態の現在完了形で、同様に不適切。","are required は受動態で、be required to do「〜するよう求められている」という意味を正しく表す。"]},

{id:386,category:"態",sentence:"The merger agreement ___ carefully by legal experts before either company signs it.",choices:["examines","is examining","must examine","must be examined"],answer:3,
 point:"主語 agreement（合意書）は「検討される」側であるため、助動詞＋受動態（must be + 過去分詞）が使われます。",
 notes:["examines は能動態の現在形で、agreement が「検討する」という意味になり不自然。","is examining は能動態の現在進行形で、同様に不適切。","must examine は能動態で、同様に意味が合わない。","must be examined は助動詞＋受動態で、法律専門家によって合意書が慎重に検討されなければならないという意味を正しく表す。"]},

{id:387,category:"態",sentence:"The company's outdated software ___ with a new system last quarter.",choices:["replaced","has replaced","replaces","was replaced"],answer:3,
 point:"主語 software（ソフトウェア）は「置き換えられる」側であり、last quarter という過去の時点を表す語句があるため、受動態の過去形が使われます。",
 notes:["replaced は能動態の過去形で、software が「置き換える」という意味になり不自然。","has replaced は能動態の現在完了形で、態も時制も文脈に合わない。","replaces は能動態の現在形で、意味も時制も文脈に合わない。","was replaced は受動態の過去形で、古いソフトウェアが新しいシステムに置き換えられたという意味を正しく表す。"]},

{id:388,category:"態",sentence:"The customer complaint ___ seriously and resolved within 24 hours.",choices:["takes","took","is taking","was taken"],answer:3,
 point:"主語 complaint（苦情）は「受け止められる」側であるため、受動態が使われます。resolved と対になる過去形の受動態 was taken が使われます。",
 notes:["takes は能動態の現在形で、complaint が「受け止める」という意味になり不自然。","took は能動態の過去形で、同様に意味が合わない。","is taking は能動態の現在進行形で、同様に不適切。","was taken は受動態の過去形で、苦情が真剣に受け止められ、24時間以内に解決されたという意味を正しく表す。"]},

{id:389,category:"態",sentence:"A new training program ___ for all incoming employees starting next month.",choices:["introduces","has introduced","is introducing","will be introduced"],answer:3,
 point:"主語 program（プログラム）は「導入される」側であり、starting next month という未来を表す語句があるため、受動態の未来形が使われます。",
 notes:["introduces は能動態の現在形で、program が「導入する」という意味になり不自然。","has introduced は能動態の現在完了形で、未来の意味を表せない。","is introducing は能動態の現在進行形で、同様に未来の意味を表せない。","will be introduced は受動態の未来形で、来月から新入社員全員を対象に新しい研修プログラムが導入されるという意味を正しく表す。"]},

{id:390,category:"比較",sentence:"This year's marketing budget is ___ than last year's, allowing for a more ambitious campaign.",choices:["large","largest","more large","larger"],answer:3,
 point:"than を伴う2つのものの比較には比較級が使われます。large は1音節の形容詞のため -er を付けた larger が正しい形です。",
 notes:["large は原級で、than を伴う比較の文脈には使えない。","largest は最上級で、2つのものを比較するここでは使わない。","more large は誤った比較級の形で、1音節の形容詞には -er を付けるのが正しい。","larger は正しい比較級の形で、than last year's と正しく対応する。"]},

{id:391,category:"比較",sentence:"Of all the candidates interviewed, she had ___ experience in international sales.",choices:["more","much","many","the most"],answer:3,
 point:"of all ~（〜の中で）という範囲を示す語句があるため、最上級が使われます。experience は不可算名詞のため much の最上級 the most が使われます。",
 notes:["more は比較級で、of all ~ という3人以上の範囲を示す文脈には最上級が必要。","much は原級で、最上級の文脈には使えない。","many は可算名詞に使う語で、不可算名詞の experience には使わない。","the most は不可算名詞に使う最上級で、of all the candidates の中で最も多い経験量を正しく表す。"]},

{id:392,category:"比較",sentence:"The new office is ___ spacious as the previous one, so employees have less room to work.",choices:["more","much","less","not as"],answer:3,
 point:"「AほどBでない」という同等比較の否定は not as + 原級 + as で表されます。",
 notes:["more は比較級を作る語で、as ~ as の同等比較の構文には使わない。","much は比較級を強調する副詞で、as ~ as の構文には合わない。","less は「より少なく」という意味の比較級で、as ~ as の構文とは組み合わせない（less spacious than の形が正しい）。","not as は not as ~ as という同等比較の否定として正しく使われる。"]},

{id:393,category:"比較",sentence:"The more feedback we gather from customers, ___ our product will become.",choices:["good","best","better","the better"],answer:3,
 point:"「〜すればするほど、ますます…」という意味を表す the 比較級, the 比較級 の構文が使われます。",
 notes:["good は原級で、この構文には比較級が必要。","best は最上級で、この構文には合わない。","better は比較級だが、この構文では the を伴う必要がある。","the better は the 比較級 の形で、the more feedback ~, the better ~ という構文を正しく完成させる。"]},

{id:394,category:"比較",sentence:"Revenue this quarter grew ___ faster than analysts had predicted.",choices:["very","so","too","much"],answer:3,
 point:"比較級を強調する副詞には much が使われます。very は原級を強調する副詞で比較級には使いません。",
 notes:["very は原級を強調する副詞で、比較級 faster を直接強調することはできない。","so は「とても」という意味だが、通常 so ~ that の構文などで使われ、単独で比較級を強調する語としては不自然。","too は「〜すぎる」という意味で、この文脈には合わない。","much は比較級を強調する副詞として faster を正しく修飾する。"]},

{id:395,category:"比較",sentence:"Among the three suppliers, Company A offers ___ prices.",choices:["low","lower","lowest","the lowest"],answer:3,
 point:"among the three ~（3つの中で）という範囲を示す語句があるため、最上級が使われます。",
 notes:["low は原級で、3者を比較する最上級の文脈には使えない。","lower は比較級で、2者の比較に使うため、3者を比較するここでは不適切。","lowest は最上級だが、名詞の前で使う場合は通常定冠詞 the を伴う必要がある。","the lowest は定冠詞を伴う最上級として、3社の中で最も低い価格を正しく表す。"]},

{id:396,category:"比較",sentence:"The updated software runs ___ as efficiently as the previous version, if not more so.",choices:["so","such","very","just"],answer:3,
 point:"as ~ as の同等比較を強調する副詞には just が使われ、「ちょうど同じくらい」という意味を表します。",
 notes:["so は否定文の as ~ as（not so ~ as）でよく使われるが、肯定文でこの位置に置く強調表現としては just が一般的。","such は形容詞や名詞を強調する語で、as ~ as の構文をこの位置で強調する語としては使わない。","very は原級の形容詞・副詞を直接強調する語で、as ~ as 全体を強調する語としては不自然。","just は as ~ as を強調し「ちょうど同じくらい効率的に」という意味を正しく表す。"]},

{id:397,category:"比較",sentence:"This model is by far ___ popular product in our entire catalog.",choices:["a","more","most","the most"],answer:3,
 point:"by far は最上級を強調する語句で「断然、群を抜いて」という意味を表します。最上級には定冠詞 the が必要です。",
 notes:["a は不定冠詞で、最上級の文脈には合わない。","more は比較級で、by far で強調される最上級の文脈には合わない。","most は最上級だが、定冠詞 the が欠けているため不完全な形。","the most は定冠詞を伴う最上級で、by far the most popular「断然最も人気のある」という意味を正しく表す。"]},

{id:398,category:"比較",sentence:"The negotiations took ___ longer than either side had anticipated.",choices:["very","too","so","far"],answer:3,
 point:"比較級を強調する副詞には far が使われ、「はるかに」という意味を表します。",
 notes:["very は原級を強調する副詞で、比較級 longer を直接強調することはできない。","too は「〜すぎる」という意味で、この文脈には合わない。","so は通常 so ~ that の構文で使われ、単独で比較級を強調する語としては不自然。","far は比較級を強調する副詞として longer を正しく修飾し「はるかに長く」という意味を表す。"]},

{id:399,category:"比較",sentence:"Customer satisfaction scores this year are ___ higher than they were two years ago.",choices:["very","too","so","significantly"],answer:3,
 point:"比較級を強調する副詞には significantly（著しく）などの程度を表す副詞が使われます。very は比較級を直接強調できません。",
 notes:["very は原級を強調する副詞で、比較級 higher を直接強調することはできない。","too は「〜すぎる」という意味で、この文脈には合わない。","so は通常 so ~ that の構文で使われ、単独で比較級を強調する語としては不自然。","significantly は比較級を強調する副詞として higher を正しく修飾し「著しく高い」という意味を表す。"]},

{id:400,category:"比較",sentence:"Of the two proposals, the second one is ___ more cost-effective.",choices:["very","most","the most","far"],answer:3,
 point:"2つのものを比較する場合は比較級を使い、最上級は使いません。比較級を強調する副詞には far が使われます。",
 notes:["very は原級を強調する副詞で、比較級を直接強調することはできない。","most は最上級を作る語で、2者の比較には使わない。","the most も最上級の形で、of the two（2つの）という2者比較の文脈には合わない。","far は比較級を強調する副詞として more cost-effective を正しく修飾する。"]}
,

{id:401,category:"品詞",sentence:"The manager revised the ___ schedule to meet the tight shipping deadline.",choices:["produce","productively","production","productive"],answer:2,
 point:"空欄の直後の名詞 schedule を修飾する語には、形容詞ではなく名詞同士が複合語を作る「名詞＋名詞」の形が入ります。",
 notes:["produce は動詞の原形。名詞の前で修飾語として使えない。","productively は副詞。名詞を直接修飾できない。","production は名詞。production schedule（生産スケジュール）という正しい複合名詞を作る。","productive は形容詞「生産的な」。「生産的なスケジュール」は意味的に不自然。"]},

{id:402,category:"品詞",sentence:"The firm offers a highly ___ salary package to attract top talent.",choices:["compete","competitively","competitive","competitiveness"],answer:2,
 point:"副詞 highly の後ろで名詞 package を修飾する語は形容詞です。",
 notes:["compete は動詞の原形。修飾語の位置に入らない。","competitively は副詞。名詞を直接修飾できない。","competitive は形容詞「競争力のある」。salary package を正しく修飾する。","competitiveness は名詞。形容詞が必要な位置には合わない。"]},

{id:403,category:"品詞",sentence:"The sales pitch was highly ___, convincing even skeptical clients.",choices:["persuade","persuasively","persuasive","persuasion"],answer:2,
 point:"be動詞 was の補語となる語は形容詞です。",
 notes:["persuade は動詞の原形。補語の位置に入らない。","persuasively は副詞。補語として使えない。","persuasive は形容詞「説得力のある」。was の補語として正しい。","persuasion は名詞「説得」。文脈上、形容詞が自然。"]},

{id:404,category:"品詞",sentence:"The CEO acted ___ during the crisis, cutting costs within days.",choices:["decide","decision","decisively","decisive"],answer:2,
 point:"動詞 acted を修飾する語は副詞です。",
 notes:["decide は動詞の原形。動詞を修飾できない。","decision は名詞「決定」。動詞を修飾できない。","decisively は副詞「果断に」。acted を正しく修飾する。","decisive は形容詞。動詞の修飾には使えない。"]},

{id:405,category:"品詞",sentence:"The startup is known for its ___ solutions to logistics problems.",choices:["innovate","innovation","innovative","innovatively"],answer:2,
 point:"所有格 its の後ろで名詞 solutions を修飾する語は形容詞です。",
 notes:["innovate は動詞の原形。名詞を修飾できない。","innovation は名詞。名詞が名詞を直接修飾する形は不自然。","innovative は形容詞「革新的な」。solutions を正しく修飾する。","innovatively は副詞。名詞を直接修飾できない。"]},

{id:406,category:"品詞",sentence:"Customers rank ___ as the most important factor when choosing a supplier.",choices:["rely","reliable","reliability","reliably"],answer:2,
 point:"動詞 rank の目的語となる語は名詞です。",
 notes:["rely は動詞の原形。目的語の位置に入らない。","reliable は形容詞。名詞なしでは目的語になれない。","reliability は名詞「信頼性」。rank の目的語として正しい。","reliably は副詞。目的語の位置には使えない。"]},

{id:407,category:"品詞",sentence:"The two firms have become ___ partners over the past decade.",choices:["depend","dependence","dependable","dependably"],answer:2,
 point:"動詞 become の補語であり、かつ名詞 partners を修飾する語は形容詞です。",
 notes:["depend は動詞の原形。修飾語として使えない。","dependence は名詞「依存」。名詞が名詞を修飾する形は不自然。","dependable は形容詞「頼りになる」。partners を正しく修飾する。","dependably は副詞。名詞を直接修飾できない。"]},

{id:408,category:"品詞",sentence:"The design team's proposal was remarkably ___ and well received by clients.",choices:["create","creation","creative","creatively"],answer:2,
 point:"副詞 remarkably の後ろで be動詞の補語となる語は形容詞です。",
 notes:["create は動詞の原形。補語の位置に入らない。","creation は名詞。remarkably の直後には形容詞が自然。","creative は形容詞「独創的な」。was の補語として正しい。","creatively は副詞。補語として使えない。"]},

{id:409,category:"品詞",sentence:"The company posted ___ growth despite the economic downturn.",choices:["impress","impression","impressive","impressively"],answer:2,
 point:"空欄の直後の名詞 growth を修飾する語は形容詞です。",
 notes:["impress は動詞の原形。名詞を修飾できない。","impression は名詞。名詞が名詞を修飾する形は不自然。","impressive は形容詞「印象的な」。growth を正しく修飾する。","impressively は副詞。名詞を直接修飾できない。"]},

{id:410,category:"品詞",sentence:"Employees found the compliance seminar extremely ___.",choices:["inform","information","informative","informatively"],answer:2,
 point:"find + O + C の構文で、目的語 the seminar の補語となる語は形容詞です。",
 notes:["inform は動詞の原形。補語の位置に入らない。","information は名詞。extremely の直後には形容詞が自然。","informative は形容詞「有益な」。目的語の補語として正しい。","informatively は副詞。補語として使えない。"]},

{id:411,category:"品詞",sentence:"The new packaging makes the product look far more ___ on store shelves.",choices:["attract","attraction","attractive","attractively"],answer:2,
 point:"look の補語となる語は形容詞です。比較級 more の後ろにも形容詞が続きます。",
 notes:["attract は動詞の原形。補語の位置に入らない。","attraction は名詞。look の補語には形容詞が自然。","attractive は形容詞「魅力的な」。more attractive で正しい比較級を作る。","attractively は副詞。look の補語として使えない。"]},

{id:412,category:"品詞",sentence:"Reducing waste requires a ___ effort from every department.",choices:["cooperate","cooperation","cooperative","cooperatively"],answer:2,
 point:"冠詞 a の後ろで名詞 effort を修飾する語は形容詞です。",
 notes:["cooperate は動詞の原形。名詞を修飾できない。","cooperation は名詞。名詞が名詞を修飾する形は不自然。","cooperative は形容詞「協力的な」。effort を正しく修飾する。","cooperatively は副詞。名詞を直接修飾できない。"]},

{id:413,category:"品詞",sentence:"The two research teams have built strong ___ over the past year.",choices:["collaborate","collaborative","collaboration","collaboratively"],answer:2,
 point:"動詞 have built の目的語となる語は名詞です。",
 notes:["collaborate は動詞の原形。目的語の位置に入らない。","collaborative は形容詞。名詞なしでは目的語になれない。","collaboration は名詞「協力関係」。built の目的語として正しい。","collaboratively は副詞。目的語の位置には使えない。"]},

{id:414,category:"品詞",sentence:"The company is praised for its ___ customer service team.",choices:["respond","response","responsive","responsively"],answer:2,
 point:"所有格 its の後ろで名詞 team を修飾する語は形容詞です。",
 notes:["respond は動詞の原形。名詞を修飾できない。","response は名詞。名詞が名詞を修飾する形は不自然。","responsive は形容詞「反応の良い」。customer service team を正しく修飾する。","responsively は副詞。名詞を直接修飾できない。"]},

{id:415,category:"品詞",sentence:"The hiring committee reviewed the applications ___ before scheduling interviews.",choices:["select","selection","selectively","selective"],answer:2,
 point:"動詞 reviewed を修飾する語は副詞です。",
 notes:["select は動詞の原形。動詞を修飾できない。","selection は名詞。動詞を修飾できない。","selectively は副詞「選択的に」。reviewed を正しく修飾する。","selective は形容詞。動詞の修飾には使えない。"]},

{id:416,category:"品詞",sentence:"Employees praised the manager's ___ approach to shifting market conditions.",choices:["adapt","adaptation","adaptive","adaptively"],answer:2,
 point:"所有格 manager's の後ろで名詞 approach を修飾する語は形容詞です。",
 notes:["adapt は動詞の原形。名詞を修飾できない。","adaptation は名詞。名詞が名詞を修飾する形は不自然。","adaptive は形容詞「適応力のある」。approach を正しく修飾する。","adaptively は副詞。名詞を直接修飾できない。"]},

{id:417,category:"品詞",sentence:"Expanding into overseas markets proved highly ___ for the company.",choices:["profit","profiting","profitable","profitably"],answer:2,
 point:"動詞 proved の補語となる語は形容詞です。",
 notes:["profit は名詞・動詞。補語の位置には入らない。","profiting は分詞。proved の補語としては不自然。","profitable は形容詞「利益になる」。proved の補語として正しい。","profitably は副詞。補語として使えない。"]},

{id:418,category:"品詞",sentence:"Only ___ candidates will be invited for a second interview.",choices:["qualify","qualification","qualified","qualifies"],answer:2,
 point:"空欄の直後の名詞 candidates を修飾する語は形容詞（過去分詞）です。",
 notes:["qualify は動詞の原形。名詞を修飾する位置には入らない。","qualification は名詞。名詞が名詞を修飾する形は不自然。","qualified は形容詞（過去分詞）「資格のある」。candidates を正しく修飾する。","qualifies は三人称単数の動詞。修飾語の位置には使えない。"]},

{id:419,category:"品詞",sentence:"Successful ___ between the two unions ended the three-week strike.",choices:["negotiate","negotiable","negotiations","negotiator"],answer:2,
 point:"形容詞 Successful に修飾され、文の主語として機能する語は名詞です。",
 notes:["negotiate は動詞の原形。主語の位置には入らない。","negotiable は形容詞。名詞なしでは主語になれない。","negotiations は名詞「交渉」。文の主語として正しく機能する。","negotiator は「交渉人」という人を表す名詞で、文意に合わない。"]},

{id:420,category:"品詞",sentence:"The consulting firm conducted a detailed ___ of the client's supply chain.",choices:["analyze","analytical","analysis","analytically"],answer:2,
 point:"動詞 conducted の目的語となる語は名詞です。",
 notes:["analyze は動詞の原形。目的語の位置に入らない。","analytical は形容詞。名詞なしでは目的語になれない。","analysis は名詞「分析」。conducted の目的語として正しい。","analytically は副詞。目的語の位置には使えない。"]},

{id:421,category:"品詞",sentence:"The applicant's credentials were ___ verified before the job offer was extended.",choices:["extend","extent","extensively","extensive"],answer:2,
 point:"過去分詞 verified を修飾する語は副詞です。",
 notes:["extend は動詞の原形。過去分詞を修飾できない。","extent は名詞。修飾語の位置には入らない。","extensively は副詞「広範囲に」。verified を正しく修飾する。","extensive は形容詞。過去分詞の修飾には使えない。"]},

{id:422,category:"品詞",sentence:"The manager provided a clear ___ for the budget cuts.",choices:["justify","justifiable","justification","justifiably"],answer:2,
 point:"冠詞と形容詞 a clear の後ろに続き、動詞 provided の目的語となる語は名詞です。",
 notes:["justify は動詞の原形。目的語の位置に入らない。","justifiable は形容詞。名詞なしでは目的語になれない。","justification は名詞「正当な理由」。provided の目的語として正しい。","justifiably は副詞。目的語の位置には使えない。"]},

{id:423,category:"品詞",sentence:"Financial advisors recommend maintaining a ___ investment portfolio.",choices:["diversify","diversification","diverse","diversely"],answer:2,
 point:"冠詞 a の後ろで名詞 investment portfolio を修飾する語は形容詞です。",
 notes:["diversify は動詞の原形。名詞を修飾できない。","diversification は名詞。名詞が名詞句を修飾する形は不自然。","diverse は形容詞「多様な」。investment portfolio を正しく修飾する。","diversely は副詞。名詞を直接修飾できない。"]},

{id:424,category:"時制",sentence:"The new branch ___ its doors next month in downtown Seattle.",choices:["opened","has opened","will open","opens"],answer:2,
 point:"next month という明確な未来を示す語句があるため、未来形を使います。",
 notes:["opened は過去形。未来のことには使えない。","has opened は現在完了。未来の予定を表すには不適切。","will open は未来形。next month と整合する。","opens は現在形。習慣的な事実には使えるが、未来の一回限りの予定を明確に示すにはここでは will open が最も自然。"]},

{id:425,category:"時制",sentence:"By the end of the year, the firm ___ over 500 new employees.",choices:["hires","hired","will have hired","is hiring"],answer:2,
 point:"「By the end of the year（年末までに）」は未来のある時点までの完了を表すため、未来完了形を使います。",
 notes:["hires は現在形。未来完了の意味を表せない。","hired は過去形。未来の内容には使えない。","will have hired は未来完了。「その時点までに雇い終えているだろう」という文意に合う。","is hiring は現在進行形。完了のニュアンスがなく文意に合わない。"]},

{id:426,category:"時制",sentence:"Sales figures ___ sharply last quarter due to the new marketing campaign.",choices:["rise","rising","rose","have risen"],answer:2,
 point:"last quarter という明確な過去の時を示す語句があるため、単純過去形を使います。",
 notes:["rise は現在形。過去の出来事には使えない。","rising は分詞・動名詞で、単独では動詞として機能しない。","rose は過去形。last quarter と整合する。","have risen は現在完了。明確な過去の時点を示す語句とは通常共に使わない。"]},

{id:427,category:"時制",sentence:"The two departments ___ closely for the past five years.",choices:["work","worked","have collaborated","will collaborate"],answer:2,
 point:"「for + 期間（過去五年間）」は過去から現在まで継続する行為を表すため、現在完了形を使います。",
 notes:["work は現在形。継続を表す for the past five years とは組み合わせない。","worked は過去形。現在までの継続を表せない。","have collaborated は現在完了。for the past five years と自然に対応する。","will collaborate は未来形。過去から続く内容には使えない。"]},

{id:428,category:"時制",sentence:"The accountant ___ the quarterly figures when the client called with an urgent request.",choices:["reviews","reviewed","was reviewing","has reviewed"],answer:2,
 point:"過去の動作の最中に別の出来事が割り込んだことを表すときは、進行中の動作を過去進行形で表します。",
 notes:["reviews は現在形。過去の文脈に合わない。","reviewed は単純過去。called と並ぶと動作の順序が不自然になる。","was reviewing は過去進行形。called という単純過去の出来事が起きた背景として自然。","has reviewed は現在完了。過去の一時点の文脈には使えない。"]},

{id:429,category:"時制",sentence:"If the shipment ___ on time, the launch event will proceed as planned.",choices:["will arrive","arrived","arrives","arrive"],answer:2,
 point:"条件を表す if 節が未来のことを述べる場合でも、if 節自体は現在形を使います（主節が未来形）。",
 notes:["will arrive は未来形。if 節では通常使わない。","arrived は過去形。未来の条件文には合わない。","arrives は現在形。未来を表す if 節として正しい。","arrive は主語 the shipment（三人称単数）と一致しない原形。"]},

{id:430,category:"時制",sentence:"By next spring, the research team ___ on the vaccine trial for over a year.",choices:["works","worked","will have been working","has worked"],answer:2,
 point:"未来のある時点までの動作の継続を強調する場合は未来完了進行形を使います。",
 notes:["works は現在形。未来の継続を表せない。","worked は過去形。未来の内容には使えない。","will have been working は未来完了進行形。next spring までの継続を正しく表す。","has worked は現在完了。未来の一時点を基準にした継続には未来完了（進行）形が必要。"]},

{id:431,category:"時制",sentence:"The technicians had already repaired the printer before the manager ___ about the issue.",choices:["hears","hearing","heard","has heard"],answer:2,
 point:"過去完了形 had repaired と組み合わされ、それより後の過去の出来事を表す動詞は単純過去形です。",
 notes:["hears は現在形。過去の文脈に合わない。","hearing は分詞・動名詞で、単独では動詞として機能しない。","heard は単純過去。had repaired よりも後に起きた過去の出来事として正しい。","has heard は現在完了。過去完了と組み合わせる後続の出来事には単純過去が適切。"]},

{id:432,category:"時制",sentence:"The marketing team ___ three new campaigns so far this year.",choices:["launches","launched","has launched","will launch"],answer:2,
 point:"「so far this year（今年これまでのところ）」は現在まで継続する期間を表すため、現在完了形を使います。",
 notes:["launches は現在形。so far とは組み合わせない。","launched は単純過去。現在まで続く期間を示す so far と合わない。","has launched は現在完了。so far this year と自然に対応する。","will launch は未来形。すでに起きたことには使えない。"]},

{id:433,category:"時制",sentence:"Once the contract ___ signed, the project can officially begin.",choices:["will be","was","is","has been"],answer:2,
 point:"once や when など未来のことを表す時の副詞節では、未来形ではなく現在形を使います。",
 notes:["will be は未来形。時の副詞節では通常使わない。","was は過去形。未来の内容には合わない。","is が現在形として未来を表す時の副詞節に正しく使われる。","has been は現在完了。この文脈では単純な現在形が自然。"]},

{id:434,category:"時制",sentence:"The quality control team ___ every batch before it leaves the warehouse.",choices:["inspected","inspecting","inspects","will inspect"],answer:2,
 point:"習慣的・恒常的な業務内容を述べる場合は現在形を使います。",
 notes:["inspected は過去形。習慣的な事実には使えない。","inspecting は分詞・動名詞で、単独では動詞として機能しない。","inspects は現在形。習慣的な業務を正しく表す。","will inspect は未来形。習慣的な事実には不適切。"]},

{id:435,category:"時制",sentence:"The auditors ___ the financial records at this time tomorrow.",choices:["review","reviewed","will be reviewing","have reviewed"],answer:2,
 point:"「at this time tomorrow（明日の今頃）」のように未来の特定の時点で進行中の動作を表す場合は未来進行形を使います。",
 notes:["review は現在形。特定の未来の一時点の進行を表せない。","reviewed は過去形。未来の内容には使えない。","will be reviewing は未来進行形。at this time tomorrow と正しく対応する。","have reviewed は現在完了。未来の進行中の動作を表せない。"]},

{id:436,category:"時制",sentence:"Technicians ___ the network outage for the past two hours.",choices:["troubleshoot","troubleshot","have been troubleshooting","will troubleshoot"],answer:2,
 point:"過去に始まり現在も継続している動作を強調する場合は現在完了進行形を使います。",
 notes:["troubleshoot は現在形。継続を表す for the past two hours とは合わない。","troubleshot は過去形。現在までの継続を表せない。","have been troubleshooting は現在完了進行形。for the past two hours と自然に対応する。","will troubleshoot は未来形。すでに始まっている行為には使えない。"]},

{id:437,category:"時制",sentence:"By the time the inspector arrived, the workers ___ the scaffolding.",choices:["remove","removing","had removed","will remove"],answer:2,
 point:"過去のある時点よりも前に完了していたことを表す場合は過去完了形を使います。",
 notes:["remove は現在形。過去の文脈に合わない。","removing は分詞・動名詞で、単独では動詞として機能しない。","had removed は過去完了。inspector が到着する前に完了していたことを正しく表す。","will remove は未来形。過去の出来事には使えない。"]},

{id:438,category:"時制",sentence:"As soon as the results ___ available, we will notify all participants.",choices:["will be","were","are","have been"],answer:2,
 point:"as soon as など未来のことを表す時の副詞節では、未来形ではなく現在形を使います。",
 notes:["will be は未来形。時の副詞節では通常使わない。","were は過去形。未来の内容には合わない。","are が現在形として未来を表す時の副詞節に正しく使われる。","have been は現在完了。この文脈では単純な現在形が自然。"]},

{id:439,category:"時制",sentence:"The company ___ its headquarters to Chicago two years ago.",choices:["relocates","relocating","relocated","has relocated"],answer:2,
 point:"two years ago という明確な過去の時を示す語句があるため、単純過去形を使います。",
 notes:["relocates は現在形。過去の出来事には使えない。","relocating は分詞・動名詞で、単独では動詞として機能しない。","relocated は過去形。two years ago と整合する。","has relocated は現在完了。明確な過去の時点を示す語句とは通常共に使わない。"]},

{id:440,category:"時制",sentence:"The IT department ___ already fixed the server issue, so operations have resumed.",choices:["fix","fixing","has","fixed"],answer:2,
 point:"already は現在完了形とともによく使われ、過去に完了し現在に影響を及ぼす出来事を表します。",
 notes:["fix は動詞の原形。主語に対する述語として不適切。","fixing は分詞・動名詞で、単独では動詞として機能しない。","has fixed で現在完了形となり、already と結びついて完了の意味を正しく表す。","fixed は単純過去。文全体が現在への影響（have resumed）を示しているため、現在完了の has fixed が最も自然。"]},

{id:441,category:"時制",sentence:"Unless the supplier ___ the parts by Friday, production will be delayed.",choices:["will deliver","delivered","delivers","delivering"],answer:2,
 point:"unless など条件を表す節では、未来のことでも現在形を使います。",
 notes:["will deliver は未来形。条件節では通常使わない。","delivered は過去形。未来の条件文には合わない。","delivers は現在形。unless 節として正しい。","delivering は分詞・動名詞で、単独では動詞として機能しない。"]},

{id:442,category:"時制",sentence:"The organization ___ its first international office in 2019.",choices:["opens","has opened","opened","will open"],answer:2,
 point:"in 2019 という明確な過去の時を示す語句があるため、単純過去形を使います。",
 notes:["opens は現在形。過去の出来事には使えない。","has opened は現在完了。明確な過去の時点を示す語句とは通常共に使わない。","opened は過去形。in 2019 と整合する。","will open は未来形。過去の出来事には使えない。"]},

{id:443,category:"時制",sentence:"The factory ___ three shifts a day until the new automation system was installed.",choices:["runs","running","used to run","will run"],answer:2,
 point:"「used to + 動詞の原形」は、現在は行われていない過去の習慣的な状態を表します。",
 notes:["runs は現在形。過去の習慣を表すには不適切。","running は分詞・動名詞で、単独では動詞として機能しない。","used to run は過去の習慣を表す表現で、自動化システム導入前の状況を正しく示す。","will run は未来形。過去の内容には使えない。"]},

{id:444,category:"時制",sentence:"Please review the contract carefully before you ___ it.",choices:["will sign","signed","sign","have signed"],answer:2,
 point:"before など未来のことを表す時の副詞節では、未来形ではなく現在形を使います。",
 notes:["will sign は未来形。時の副詞節では通常使わない。","signed は過去形。未来の内容には合わない。","sign が現在形として未来を表す時の副詞節に正しく使われる。","have signed は現在完了。この文脈では単純な現在形が自然。"]},

{id:445,category:"時制",sentence:"By the time the new policy takes effect, the HR team ___ all employees.",choices:["notifies","notified","will have notified","has notified"],answer:2,
 point:"「By the time + 現在時制」の文では、主節はしばしば未来完了形になり、その時点までに完了していることを表します。",
 notes:["notifies は現在形。未来完了の意味を表せない。","notified は過去形。未来の内容には使えない。","will have notified は未来完了。「新方針が発効するまでに通知を終えているだろう」という文意に合う。","has notified は現在完了。未来の一時点を基準にした完了には未来完了形が必要。"]},

{id:446,category:"前置詞",sentence:"Employees are required to wear protective gear ___ all times while on the factory floor.",choices:["in","on","at","by"],answer:2,
 point:"「at all times（常に）」は決まった前置詞の組み合わせです。",
 notes:["in all times という表現は使われない。","on all times という表現は使われない。","at all times で「常に」という正しい定型表現になる。","by all times という表現は使われない。"]},

{id:447,category:"前置詞",sentence:"The rental deposit must be refunded ___ 14 business days of the tenant's move-out date.",choices:["during","by","within","until"],answer:2,
 point:"「～以内に」という期限の範囲を表すときは within を使います。",
 notes:["during は特定の期間中の出来事を表し、期限の範囲を示す表現には合わない。","by は期限の締め切りを表すが、後ろに期間の長さを直接続けるこの形では within が適切。","within は「～以内に」という期限の範囲を正しく表す。","until は「～まで（継続）」を表し、期限内に一度きり行う支払いには合わない。"]},

{id:448,category:"前置詞",sentence:"The new regulations will remain ___ effect until further notice.",choices:["on","at","in","with"],answer:2,
 point:"「in effect（効力を持って）」は決まった前置詞の組み合わせです。",
 notes:["on effect という表現は使われない。","at effect という表現は使われない。","in effect で「効力がある」という正しい定型表現になる。","with effect という表現は使われない（ただし with effect from ~ という別表現は存在するが、この文脈には合わない）。"]},

{id:449,category:"前置詞",sentence:"___ the strong winds, the outdoor product launch proceeded as scheduled.",choices:["Because","Due","Despite","Unless"],answer:2,
 point:"名詞句 the heavy rain の前に置き、「～にもかかわらず」という意味を表す前置詞は despite です。",
 notes:["Because は接続詞で、後ろに節（主語＋動詞）が必要。名詞句の前には使えない。","Due は単独の前置詞ではなく、due to という形で使う必要がある。","Despite は前置詞で、名詞句の前に置いて「～にもかかわらず」を正しく表す。","Unless は接続詞で、条件を表す節の前に使われ、この文脈の意味に合わない。"]},

{id:450,category:"前置詞",sentence:"The report was compiled ___ data collected over the past five years.",choices:["of","on","from","to"],answer:2,
 point:"「～をもとに（材料・出所）」を表す前置詞は from です。",
 notes:["of は所属や部分を表すが、資料の出所を表すには合わない。","on は主題を表す前置詞で、この文脈には合わない。","from は「～から（出所・材料）」を正しく表す。","to は方向や対象を表し、この文脈には合わない。"]},

{id:451,category:"前置詞",sentence:"The proposal was approved ___ a few minor revisions.",choices:["in","at","with","by"],answer:2,
 point:"「（若干の修正）を伴って」という付帯状況を表す前置詞は with です。",
 notes:["in はこの文脈の付帯状況を表すには合わない。","at はこの文脈の付帯状況を表すには合わない。","with で「～を伴って」という付帯状況を正しく表す。","by は動作主や手段を表し、この文脈には合わない。"]},

{id:452,category:"前置詞",sentence:"The workshop is intended primarily ___ new hires who need safety training.",choices:["to","with","for","of"],answer:2,
 point:"「（人）のために・向けに」という対象を表す前置詞は for です。",
 notes:["to は方向や対象を表すが、intended for という定型表現には合わない。","with はこの文脈の対象を表すには合わない。","for で「～向けに」という対象を正しく表す（be intended for ~）。","of は所属や部分を表し、この文脈には合わない。"]},

{id:453,category:"前置詞",sentence:"___ the course of the year, customer satisfaction scores improved significantly.",choices:["During","At","Over","In"],answer:2,
 point:"「over the course of ~（～の間を通じて）」は決まった前置詞の組み合わせです。",
 notes:["During the course of という組み合わせは一般的ではない。","At the course of という組み合わせは使われない。","Over the course of で「～の間を通じて」という正しい定型表現になる。","In the course of は「～の途中で」という別の意味の定型表現で、この文脈には合わない。"]},

{id:454,category:"前置詞",sentence:"The manager spoke ___ behalf of the entire department at the ceremony.",choices:["in","by","on","for"],answer:2,
 point:"「on behalf of ~（～を代表して）」は決まった前置詞の組み合わせです。",
 notes:["in behalf of という表現は標準的ではない。","by behalf of という表現は使われない。","on behalf of で「～を代表して」という正しい定型表現になる。","for behalf of という表現は使われない。"]},

{id:455,category:"前置詞",sentence:"All visitors must check in ___ the security desk before entering the building.",choices:["in","on","at","to"],answer:2,
 point:"特定の地点・場所を表す前置詞は at です。",
 notes:["in は空間の内部を表し、受付のような特定地点を表すには合わない。","on は接触している面を表し、この文脈には合わない。","at で「（特定の地点）で」という意味を正しく表す。","to は方向を表し、check in と組み合わせるには合わない。"]},

{id:456,category:"前置詞",sentence:"The findings of the survey are consistent ___ previous research on consumer behavior.",choices:["to","of","with","from"],answer:2,
 point:"「consistent with ~（～と一致している）」は決まった前置詞の組み合わせです。",
 notes:["consistent to という組み合わせは使われない。","consistent of という組み合わせは使われない。","consistent with で「～と一致している」という正しい定型表現になる。","consistent from という組み合わせは使われない。"]},

{id:457,category:"前置詞",sentence:"The airline is liable ___ any damage caused to checked baggage.",choices:["of","to","for","with"],answer:2,
 point:"「liable for ~（～に対して責任がある）」は決まった前置詞の組み合わせです。",
 notes:["liable of という組み合わせは使われない。","liable to は「～しがちである」という別の意味になり、この文脈には合わない。","liable for で「～に対して責任がある」という正しい定型表現になる。","liable with という組み合わせは使われない。"]},

{id:458,category:"前置詞",sentence:"___ to the merger, both companies operated independently in their respective markets.",choices:["Due","Regarding","Prior","Concerning"],answer:2,
 point:"「prior to ~（～より前に）」は決まった前置詞の組み合わせです。",
 notes:["Due は単独の前置詞ではなく、due to という形で使う必要がある。","Regarding は「～に関して」という意味で、時間的な前後関係を表すこの文脈には合わない。","Prior to で「～より前に」という正しい定型表現になる。","Concerning は「～に関して」という意味で、この文脈には合わない。"]},

{id:459,category:"前置詞",sentence:"The seminar covers a wide range of topics, ranging ___ time management to conflict resolution.",choices:["between","among","from","of"],answer:2,
 point:"「range from A to B（AからBにわたる）」は決まった前置詞の組み合わせです。",
 notes:["range between という組み合わせは、通常2つの数値の範囲を示す際に使われ、この文脈には合わない。","range among という組み合わせは使われない。","range from ~ to ... で「～から…にわたる」という正しい定型表現になる。","range of という組み合わせはこの文脈には合わない。"]},

{id:460,category:"前置詞",sentence:"The negotiations broke down ___ a disagreement over pricing terms.",choices:["despite","without","over","among"],answer:2,
 point:"「（不一致など）が原因で」という意味を表す前置詞は over です。",
 notes:["despite は「～にもかかわらず」という逆接の意味で、この文脈の因果関係に合わない。","without は「～なしで」という意味で、この文脈には合わない。","over は「～をめぐって・が原因で」という意味を正しく表す。","among は「（3つ以上のもの）の間で」という意味で、単数の disagreement には合わない。"]},

{id:461,category:"前置詞",sentence:"The new policy applies ___ all full-time staff, regardless of department.",choices:["for","with","to","at"],answer:2,
 point:"「apply to ~（～に適用される）」は決まった前置詞の組み合わせです。",
 notes:["apply for は「～に応募する」という別の意味になり、この文脈には合わない。","apply with という組み合わせは使われない。","apply to で「～に適用される」という正しい定型表現になる。","apply at という組み合わせは使われない。"]},

{id:462,category:"前置詞",sentence:"Please submit your expense report ___ Friday at the latest.",choices:["until","since","by","throughout"],answer:2,
 point:"「（期限）までに」という一回限りの動作の期限を表す前置詞は by です。",
 notes:["until は「～まで（継続）」を表し、一度きりの提出には合わない。","since は「～以来」という起点を表し、この文脈には合わない。","by で「（期限）までに」という一回限りの動作の期限を正しく表す。","throughout は「～の間ずっと」という継続を表し、この文脈には合わない。"]},

{id:463,category:"前置詞",sentence:"Profits increased ___ 15 percent compared with the previous fiscal year.",choices:["to","at","by","in"],answer:2,
 point:"増減の「差・幅」を表す前置詞は by です。",
 notes:["to は到達点を表し、増加した「幅」を表すには合わない。","at は特定の数値・水準を表し、増加の幅を表すには合わない。","by で「（数値）分だけ」という増減の幅を正しく表す。","in はこの文脈の増減の幅を表すには合わない。"]},

{id:464,category:"前置詞",sentence:"The manual explains ___ detail how to operate the new equipment.",choices:["at","with","in","on"],answer:2,
 point:"「in detail（詳細に）」は決まった前置詞の組み合わせです。",
 notes:["at detail という表現は使われない。","with detail という表現は使われない。","in detail で「詳細に」という正しい定型表現になる。","on detail という表現は使われない。"]},

{id:465,category:"前置詞",sentence:"The committee is currently ___ charge of organizing the annual conference.",choices:["at","on","in","with"],answer:2,
 point:"「in charge of ~（～を担当して）」は決まった前置詞の組み合わせです。",
 notes:["at charge of という表現は使われない。","on charge of という表現は使われない。","in charge of で「～を担当して」という正しい定型表現になる。","with charge of という表現は使われない。"]},

{id:466,category:"前置詞",sentence:"Several employees raised concerns ___ regard to the new attendance policy.",choices:["in","at","with","by"],answer:2,
 point:"「with regard to ~（～に関して）」は決まった前置詞の組み合わせです。",
 notes:["in regard to も存在する表現だが、ここでは with regard to が定型として問われている。","at regard to という表現は使われない。","with regard to で「～に関して」という正しい定型表現になる。","by regard to という表現は使われない。"]},

{id:467,category:"前置詞",sentence:"The building was constructed ___ accordance with the latest safety codes.",choices:["by","with","in","at"],answer:2,
 point:"「in accordance with ~（～に従って）」は決まった前置詞の組み合わせです。",
 notes:["by accordance with という表現は使われない。","with accordance with という表現は使われない。","in accordance with で「～に従って」という正しい定型表現になる。","at accordance with という表現は使われない。"]},

{id:468,category:"前置詞",sentence:"All applications must be submitted ___ email no later than 5 p.m.",choices:["at","on","by","in"],answer:2,
 point:"手段・方法を表す前置詞は by です。",
 notes:["at は特定の地点や時刻を表し、手段を表すには合わない。","on はこの文脈の手段を表すには合わない。","by で「（手段）によって」という意味を正しく表す（by email）。","in はこの文脈の手段を表すには合わない。"]},

{id:469,category:"接続詞",sentence:"___ the marketing budget was reduced, the campaign still exceeded its targets.",choices:["Despite","Because","Although","Unless"],answer:2,
 point:"後ろに「主語＋動詞」の節が続く場合、前置詞ではなく接続詞を使う必要があります。ここでは逆接の although が適切です。",
 notes:["Despite は前置詞で、後ろに節ではなく名詞句が必要。","Because は「～なので」という意味で、この文脈の逆接には合わない。","Although は接続詞で「～だけれども」という逆接の節を正しく導く。","Unless は「～でない限り」という条件を表し、この文脈には合わない。"]},

{id:470,category:"接続詞",sentence:"The client postponed the meeting ___ she had a scheduling conflict.",choices:["because of","despite","because","although"],answer:2,
 point:"後ろに「主語＋動詞」の節が続く場合、前置詞ではなく接続詞を使う必要があります。",
 notes:["because of は前置詞句で、後ろに節ではなく名詞句が必要。","despite は前置詞で、この文脈の理由を表すには合わない。","because は接続詞で「～なので」という理由の節を正しく導く。","although は「～だけれども」という逆接を表し、この文脈の意味に合わない。"]},

{id:471,category:"接続詞",sentence:"Employees may work remotely ___ they meet their weekly deadlines.",choices:["unless","despite","provided that","although"],answer:2,
 point:"「provided that ～（～という条件で）」は条件を表す接続詞です。",
 notes:["unless は「～でない限り」という意味で、文意が逆になり不適切。","despite は前置詞で、後ろに節ではなく名詞句が必要。","provided that は「～という条件で」という条件を正しく表す。","although は「～だけれども」という逆接を表し、この文脈には合わない。"]},

{id:472,category:"接続詞",sentence:"The technician inspected the machine carefully, ___ it had already passed a routine check.",choices:["because","so","even though","unless"],answer:2,
 point:"「even though ～（～にもかかわらず）」は逆接を表す接続詞です。",
 notes:["because は「～なので」という理由を表し、この文脈の逆接には合わない。","so は結果を表す接続詞で、この文脈には合わない。","even though は「～にもかかわらず」という逆接を正しく表す。","unless は「～でない限り」という条件を表し、この文脈には合わない。"]},

{id:473,category:"接続詞",sentence:"You will not receive a refund ___ you return the item within 30 days.",choices:["if","once","unless","while"],answer:2,
 point:"「unless ～（～でない限り）」は否定の条件を表す接続詞です。",
 notes:["if は「もし～ならば」という意味で、後半の否定文と組み合わせると文意が不自然になる。","once は「いったん～すると」という意味で、この文脈には合わない。","unless は「～でない限り」という否定条件を正しく表す。","while は「～する一方で」という意味で、この文脈には合わない。"]},

{id:474,category:"接続詞",sentence:"___ the negotiations succeed or fail, both sides have agreed to release a joint statement.",choices:["If","Unless","Whether","Because"],answer:2,
 point:"「whether A or B（AであろうとBであろうと）」という譲歩を表す接続詞です。",
 notes:["If は単純な条件を表し、or fail との組み合わせに合わない。","Unless は「～でない限り」という意味で、この文脈には合わない。","Whether は whether...or の形で「～であろうとなかろうと」という譲歩を正しく表す。","Because は理由を表し、この文脈には合わない。"]},

{id:475,category:"接続詞",sentence:"The proposal is acceptable to neither the finance team ___ the legal department.",choices:["or","and","nor","but"],answer:2,
 point:"「neither A nor B（AもBも～ない）」は相関接続詞の組み合わせです。",
 notes:["or は either と組み合わせる語で、neither とは組み合わせない。","and は neither と組み合わせて使わない。","nor は neither と対になり「AもBも～ない」を正しく表す。","but は逆接を表す接続詞で、この相関表現には使われない。"]},

{id:476,category:"接続詞",sentence:"Not only did the vendor deliver late, ___ the shipment also arrived damaged.",choices:["so","and","but","or"],answer:2,
 point:"「not only A but also B（AだけでなくBも）」は相関接続詞の組み合わせです。",
 notes:["so は結果を表す接続詞で、not only と組み合わせない。","and は not only と組み合わせて使わない。","but は not only と対になり「AだけでなくBも」を正しく表す。","or は選択を表し、この相関表現には使われない。"]},

{id:477,category:"接続詞",sentence:"The proposal will be implemented ___ the budget is approved by the board.",choices:["since","although","once","despite"],answer:2,
 point:"「once ～（いったん～すると）」は時を表す接続詞です。",
 notes:["since は「～以来」または「～なので」という意味で、この文脈には合わない。","although は逆接を表し、この文脈には合わない。","once は「いったん～すると」という時を正しく表す。","despite は前置詞で、後ろに節ではなく名詞句が必要。"]},

{id:478,category:"接続詞",sentence:"The report must be revised ___ it can be presented to stakeholders next week.",choices:["in order","because","so that","unless"],answer:2,
 point:"「so that ～（～するために）」は目的を表す接続詞です。",
 notes:["in order は単独では使えず、in order that または in order to + 動詞の原形という形が必要。","because は理由を表し、この文脈の目的には合わない。","so that は「～するために」という目的を正しく表す。","unless は条件を表し、この文脈には合わない。"]},

{id:479,category:"接続詞",sentence:"While overall sales have declined this quarter, online sales have grown steadily.",choices:["During","Despite","While","Because"],answer:2,
 point:"後ろに「主語＋動詞」の節が続く場合、前置詞ではなく接続詞を使う必要があります。ここでは対比を表す while が適切です。",
 notes:["During は前置詞で、後ろに節ではなく名詞句が必要。","Despite は前置詞で、後ろに節ではなく名詞句が必要。","While は接続詞で「～する一方で」という対比の節を正しく導く。","Because は理由を表し、この文脈の対比には合わない。"]},

{id:480,category:"接続詞",sentence:"The manager approved the request ___ it fell within policy guidelines.",choices:["despite","unless","as","during"],answer:2,
 point:"「as ～（～なので）」は理由を表す接続詞として使われます。",
 notes:["despite は前置詞で、後ろに節ではなく名詞句が必要。","unless は条件を表し、この文脈には合わない。","as は「～なので」という理由を正しく表す。","during は前置詞で、後ろに節ではなく名詞句が必要。"]},

{id:481,category:"接続詞",sentence:"___ the deadline approached, the team began working through the weekend.",choices:["During","Despite","As","For"],answer:2,
 point:"後ろに「主語＋動詞」の節が続く場合、前置詞ではなく接続詞を使う必要があります。ここでは「～につれて」を表す as が適切です。",
 notes:["During は前置詞で、後ろに節ではなく名詞句が必要。","Despite は前置詞で、後ろに節ではなく名詞句が必要。","As は接続詞で「～につれて」という節を正しく導く。","For は前置詞または結果を表す接続詞で、この文脈の意味には合わない。"]},

{id:482,category:"接続詞",sentence:"The two proposals are similar ___ they both aim to cut overhead costs.",choices:["so that","provided that","in that","now that"],answer:2,
 point:"「in that ～（～という点で）」は理由・観点を表す接続詞句です。",
 notes:["so that は目的を表し、この文脈には合わない。","provided that は条件を表し、この文脈には合わない。","in that は「～という点で」という観点を正しく表す。","now that は「今や～なので」という意味で、この文脈には合わない。"]},

{id:483,category:"接続詞",sentence:"___ the new system has launched, the IT team can focus on other projects.",choices:["Even though","Provided that","Now that","So that"],answer:2,
 point:"「now that ～（今や～なので）」は理由を表す接続詞句です。",
 notes:["Even though は逆接を表し、この文脈には合わない。","Provided that は条件を表し、この文脈には合わない。","Now that は「今や～なので」という理由を正しく表す。","So that は目的を表し、この文脈には合わない。"]},

{id:484,category:"接続詞",sentence:"The airline canceled the flight, ___ passengers were rebooked on the next available departure.",choices:["for","but","so","or"],answer:2,
 point:"「so（それで）」は結果を表す等位接続詞です。",
 notes:["for は理由を表す等位接続詞で、この文脈の結果には合わない。","but は逆接を表し、この文脈には合わない。","so は「それで」という結果を正しく表す。","or は選択を表し、この文脈には合わない。"]},

{id:485,category:"接続詞",sentence:"The vendor missed the delivery deadline; ___, the client extended the contract without penalty.",choices:["therefore","moreover","nonetheless","meanwhile"],answer:2,
 point:"「nonetheless（それにもかかわらず）」は前後の逆接的な内容をつなぐ接続副詞です。",
 notes:["therefore は「それゆえに」という順接の結果を表し、この文脈の逆接には合わない。","moreover は「さらに」という追加を表し、この文脈には合わない。","nonetheless は「それにもかかわらず」という逆接を正しく表す。","meanwhile は「その間に」という同時性を表し、この文脈には合わない。"]},

{id:486,category:"接続詞",sentence:"The board postponed the vote, ___ several key members were unavailable.",choices:["so","and","for","nor"],answer:2,
 point:"「for（というのも～だから）」は理由を表すやや形式的な等位接続詞です。",
 notes:["so は結果を表し、この文脈の理由には合わない。","and は単純な並列を表し、理由を明示するには弱い。","for は「というのも～だから」という理由を正しく表す。","nor は否定の並列を表し、この文脈には合わない。"]},

{id:487,category:"接続詞",sentence:"___ the manager or the assistant will be available to answer questions during the conference.",choices:["Both","Neither","Either","Whether"],answer:2,
 point:"「either A or B（AかBのどちらか）」は相関接続詞の組み合わせです。",
 notes:["Both は both A and B の形で使い、or とは組み合わせない。","Neither は neither A nor B の形で使い、or とは組み合わせない。","Either は either A or B の形で「AかBのどちらか」を正しく表す。","Whether は whether A or B の形で名詞節を作るが、この文の構造には合わない。"]},

{id:488,category:"接続詞",sentence:"The shipment will arrive on schedule ___ there are no delays at customs.",choices:["despite","during","provided that","because of"],answer:2,
 point:"後ろに「主語＋動詞」の節が続く場合、前置詞ではなく接続詞を使う必要があります。ここでは条件を表す provided that が適切です。",
 notes:["despite は前置詞で、後ろに節ではなく名詞句が必要。","during は前置詞で、後ろに節ではなく名詞句が必要。","provided that は接続詞で「～という条件で」という条件の節を正しく導く。","because of は前置詞句で、後ろに節ではなく名詞句が必要。"]},

{id:489,category:"接続詞",sentence:"___ the flight was delayed by two hours, all passengers still made their connections.",choices:["Despite","In spite of","Although","Because of"],answer:2,
 point:"後ろに「主語＋動詞」の節が続く場合、前置詞ではなく接続詞を使う必要があります。ここでは逆接の although が適切です。",
 notes:["Despite は前置詞で、後ろに節ではなく名詞句が必要。","In spite of は前置詞句で、後ろに節ではなく名詞句が必要。","Although は接続詞で「～だけれども」という逆接の節を正しく導く。","Because of は前置詞句で、後ろに節ではなく名詞句が必要。"]},

{id:490,category:"接続詞",sentence:"The seminar was rescheduled ___ the guest speaker fell ill.",choices:["because of","due to","because","owing to"],answer:2,
 point:"後ろに「主語＋動詞」の節が続く場合、前置詞ではなく接続詞を使う必要があります。",
 notes:["because of は前置詞句で、後ろに節ではなく名詞句が必要。","due to は前置詞句で、後ろに節ではなく名詞句が必要。","because は接続詞で「～なので」という理由の節を正しく導く。","owing to は前置詞句で、後ろに節ではなく名詞句が必要。"]},

{id:491,category:"関係詞",sentence:"The supplier with ___ we have partnered for over a decade announced its retirement from the industry.",choices:["who","which","whom","whose"],answer:2,
 point:"前置詞 with の直後に置く関係代名詞は、目的格の whom です。",
 notes:["who は主格で、前置詞の直後には置けない。","which は物を指す関係代名詞で、人を表す the supplier には合わない。","whom は目的格の関係代名詞で、前置詞 with の直後に正しく置ける。","whose は所有格で、この文脈には合わない。"]},

{id:492,category:"関係詞",sentence:"The complex ___ the firm's regional office is located was completed in 2005.",choices:["which","that","where","whose"],answer:2,
 point:"先行詞が場所を表し、関係詞節内で「場所」の意味を補う場合は関係副詞 where を使います。",
 notes:["which は関係代名詞で、後ろに完全な文（is headquartered）が続く場合は使えない。","that も関係代名詞で、同様に後ろに完全な文が続く場合は使えない。","where は関係副詞で、後ろに完全な文が続く場合に正しく使える。","whose は所有格の関係代名詞で、この文脈には合わない。"]},

{id:493,category:"関係詞",sentence:"The reason ___ the shipment was delayed remains unclear.",choices:["which","where","why","what"],answer:2,
 point:"先行詞が理由を表す reason の場合、関係副詞 why を使います。",
 notes:["which は関係代名詞で、この文脈の関係副詞の役割には合わない。","where は場所を表す関係副詞で、reason には合わない。","why は理由を表す関係副詞で、reason を正しく修飾する。","what は先行詞を含む関係代名詞で、reason という先行詞がある文には使えない。"]},

{id:494,category:"関係詞",sentence:"The engineer, ___ design won the innovation award, was promoted to senior director.",choices:["who","which","whose","whom"],answer:2,
 point:"後ろの名詞 design を修飾し、所有の関係を表す関係代名詞は whose です。",
 notes:["who は主格で、後ろに名詞を直接置けない。","which は物を指す関係代名詞で、人を表す the engineer には合わない。","whose は所有格の関係代名詞で、design を正しく修飾する。","whom は目的格で、後ろに名詞を直接置けない。"]},

{id:495,category:"関係詞",sentence:"This is exactly ___ the committee had hoped to achieve by the end of the fiscal year.",choices:["that","which","what","whom"],answer:2,
 point:"先行詞を含む関係代名詞 what は「～すること・もの」という意味を表します。",
 notes:["that は先行詞が必要な関係代名詞で、先行詞のないこの文脈には合わない。","which も先行詞が必要な関係代名詞で、この文脈には合わない。","what は先行詞を含み「～すること」を正しく表す。","whom は人を指す目的格の関係代名詞で、この文脈には合わない。"]},

{id:496,category:"関係詞",sentence:"The client, ___ we contacted immediately after the incident, accepted our apology.",choices:["who","which","whom","whose"],answer:2,
 point:"動詞 contacted の目的語となる関係代名詞は、目的格の whom です。",
 notes:["who は主格で、動詞の目的語の位置には本来使わない。","which は物を指す関係代名詞で、人を表す the client には合わない。","whom は目的格の関係代名詞で、contacted の目的語として正しく機能する。","whose は所有格で、この文脈には合わない。"]},

{id:497,category:"関係詞",sentence:"The factory, ___ was built only two years ago, already needs significant repairs.",choices:["who","that","which","whom"],answer:2,
 point:"コンマで区切られた非制限用法の関係詞節では、that を使うことができません。",
 notes:["who は人を指す関係代名詞で、物を表す the factory には合わない。","that は非制限用法（コンマの後）では使えない。","which は物を指し、非制限用法でも使える関係代名詞として正しい。","whom は人を指す目的格の関係代名詞で、この文脈には合わない。"]},

{id:498,category:"関係詞",sentence:"Interns ___ projects receive the highest evaluation scores will be considered for full-time positions.",choices:["who","whom","whose","which"],answer:2,
 point:"後ろの名詞 projects を修飾し、所有の関係を表す関係代名詞は whose です。",
 notes:["who は主格で、後ろに名詞を直接置けない。","whom は目的格で、後ろに名詞を直接置けない。","whose は所有格の関係代名詞で、projects を正しく修飾する。","which は物を指す関係代名詞で、人を表す Interns には合わない。"]},

{id:499,category:"関係詞",sentence:"The consultant ___ the board hired specializes in organizational restructuring.",choices:["who","which","whom","whose"],answer:2,
 point:"動詞 hired の目的語となる関係代名詞は、目的格の whom です。",
 notes:["who は主格で、動詞の目的語の位置には本来使わない。","which は物を指す関係代名詞で、人を表す the consultant には合わない。","whom は目的格の関係代名詞で、hired の目的語として正しく機能する。","whose は所有格で、この文脈には合わない。"]},

{id:500,category:"関係詞",sentence:"The department ___ productivity increased the most will receive additional funding next year.",choices:["which","that","whose","who"],answer:2,
 point:"後ろの名詞 productivity を修飾し、所有の関係を表す関係代名詞は whose です。",
 notes:["which は関係代名詞で、後ろに名詞を直接置けない。","that も関係代名詞で、後ろに名詞を直接置けない。","whose は所有格の関係代名詞で、productivity を正しく修飾する。","who は人を指す主格の関係代名詞で、部署を表す department には合わない。"]},

{id:501,category:"関係詞",sentence:"The hotel where we stayed during the conference offered excellent service.",choices:["which","that","where","when"],answer:2,
 point:"先行詞が場所を表し、関係詞節内で「場所」の意味を補う場合は関係副詞 where を使います。",
 notes:["which は関係代名詞で、後ろに完全な文（we stayed）が続く場合は使えない。","that も関係代名詞で、同様に後ろに完全な文が続く場合は使えない。","where は関係副詞で、後ろに完全な文が続く場合に正しく使える。","when は時を表す関係副詞で、場所を表す hotel には合わない。"]},

{id:502,category:"関係詞",sentence:"The decade ___ the firm expanded overseas remains a defining period in its history.",choices:["where","which","when","why"],answer:2,
 point:"先行詞が時を表す the decade の場合、関係副詞 when を使います。",
 notes:["where は場所を表す関係副詞で、the decade には合わない。","which は関係代名詞で、後ろに完全な文が続く場合は使えない。","when は時を表す関係副詞で、the decade を正しく修飾する。","why は理由を表す関係副詞で、この文脈には合わない。"]},

{id:503,category:"関係詞",sentence:"Investors want to understand ___ caused the merger to fall through.",choices:["which","that","what","why"],answer:2,
 point:"先行詞を含む関係代名詞 what は文の主語としても使われ、「～すること・もの」という意味を表します。",
 notes:["which は先行詞が必要な関係代名詞で、先行詞のないこの文脈には合わない。","that も先行詞が必要な関係代名詞で、この文脈には合わない。","what は先行詞を含み、understand の目的語となる節の主語として正しく機能する。","why は理由を表す関係副詞で、後ろに完全な文が必要になるため caused の主語としては使えない。"]},

{id:504,category:"関係詞",sentence:"The proposal ___ the committee ultimately selected includes a three-year implementation timeline.",choices:["who","whom","that","whose"],answer:2,
 point:"動詞 selected の目的語となり、物を指す関係代名詞は that（または which）です。",
 notes:["who は人を指す関係代名詞で、物を表す the proposal には合わない。","whom は人を指す目的格の関係代名詞で、this文脈には合わない。","that は物を指す関係代名詞で、selected の目的語として正しく機能する。","whose は所有格で、後ろに名詞を必要とするため、この文脈には合わない。"]},

{id:505,category:"関係詞",sentence:"The article, ___ was published last week, has already been cited by several industry blogs.",choices:["that","who","which","whom"],answer:2,
 point:"コンマで区切られた非制限用法の関係詞節では、that を使うことができません。",
 notes:["that は非制限用法（コンマの後）では使えない。","who は人を指す関係代名詞で、物を表す the article には合わない。","which は物を指し、非制限用法でも使える関係代名詞として正しい。","whom は人を指す目的格の関係代名詞で、この文脈には合わない。"]},

{id:506,category:"関係詞",sentence:"This is the branch office ___ handles all customer complaints for the eastern region.",choices:["who","whom","that","whose"],answer:2,
 point:"主格の関係代名詞として、物を指す先行詞には that（または which）を使います。",
 notes:["who は人を指す関係代名詞で、物を表す branch office には合わない。","whom は人を指す目的格の関係代名詞で、この文脈には合わない。","that は物を指す主格の関係代名詞で、handles の主語として正しく機能する。","whose は所有格で、後ろに名詞が必要なため、この文脈には合わない。"]},

{id:507,category:"関係詞",sentence:"The employees who attended the training session all passed the certification exam.",choices:["which","whom","who","whose"],answer:2,
 point:"主格の関係代名詞として、人を指す先行詞には who を使います。",
 notes:["which は物を指す関係代名詞で、人を表す employees には合わない。","whom は目的格で、attended の主語の位置には使えない。","who は人を指す主格の関係代名詞で、attended の主語として正しく機能する。","whose は所有格で、後ろに名詞が必要なため、この文脈には合わない。"]},

{id:508,category:"関係詞",sentence:"The policy change, about ___ many employees have expressed concern, will take effect next month.",choices:["who","that","which","whom"],answer:2,
 point:"前置詞 about の直後に置く関係代名詞は which です（人を表さない場合）。that は前置詞の直後に置けません。",
 notes:["who は人を指す関係代名詞で、物を表す the policy change には合わない。","that は前置詞の直後には置けない。","which は前置詞 about の直後に正しく置ける。","whom は人を指す目的格の関係代名詞で、この文脈には合わない。"]},

{id:509,category:"関係詞",sentence:"The candidate ___ qualifications best fit the role will be contacted for a second interview.",choices:["who","that","whose","which"],answer:2,
 point:"後ろの名詞 qualifications を修飾し、所有の関係を表す関係代名詞は whose です。",
 notes:["who は主格で、後ろに名詞を直接置けない。","that も関係代名詞で、後ろに名詞を直接置けない。","whose は所有格の関係代名詞で、qualifications を正しく修飾する。","which は物を指す関係代名詞で、人を表す the candidate には合わない。"]},

{id:510,category:"関係詞",sentence:"The warehouse where the goods are stored is monitored around the clock.",choices:["which","that","where","when"],answer:2,
 point:"先行詞が場所を表し、関係詞節内で「場所」の意味を補う場合は関係副詞 where を使います。",
 notes:["which は関係代名詞で、後ろに完全な文（the goods are stored）が続く場合は使えない。","that も関係代名詞で、同様に後ろに完全な文が続く場合は使えない。","where は関係副詞で、後ろに完全な文が続く場合に正しく使える。","when は時を表す関係副詞で、場所を表す warehouse には合わない。"]},

{id:511,category:"関係詞",sentence:"The negotiation reached an impasse, ___ neither side had anticipated.",choices:["who","that","which","whom"],answer:2,
 point:"直前の節全体を先行詞とする非制限用法の関係代名詞は which です。",
 notes:["who は人を指す関係代名詞で、この文脈には合わない。","that は非制限用法（コンマの後）では使えない。","which は前の節全体を先行詞として受ける非制限用法で正しく使われる。","whom は人を指す目的格の関係代名詞で、この文脈には合わない。"]},

{id:512,category:"関係詞",sentence:"The board member ___ opinion carries the most weight was absent from today's vote.",choices:["who","whom","whose","which"],answer:2,
 point:"後ろの名詞 opinion を修飾し、所有の関係を表す関係代名詞は whose です。",
 notes:["who は主格で、後ろに名詞を直接置けない。","whom は目的格で、後ろに名詞を直接置けない。","whose は所有格の関係代名詞で、opinion を正しく修飾する。","which は物を指す関係代名詞で、人を表す board member には合わない。"]},

{id:513,category:"仮定法",sentence:"If the company ___ more resources into R&D, it might have developed the product sooner.",choices:["invests","invested","had invested","will invest"],answer:2,
 point:"過去の事実に反する仮定を表す仮定法過去完了は「if + 主語 + had + 過去分詞」の形を使います。",
 notes:["invests は現在形。過去の事実に反する仮定には使えない。","invested は仮定法過去の形で、現在の事実に反する仮定を表すため、might have developed（過去への帰結）と時制が一致しない。","had invested は仮定法過去完了で、might have developed と正しく対応する。","will invest は未来形。仮定法の if 節には使えない。"]},

{id:514,category:"仮定法",sentence:"The CFO recommended that the budget ___ revised before the next board meeting.",choices:["is","was","be","will be"],answer:2,
 point:"recommend that ～のような提案・要求を表す動詞に続く that 節では、動詞の原形（仮定法現在）を使います。",
 notes:["is は三人称単数現在形。that 節には動詞の原形が必要。","was は過去形。that 節には動詞の原形が必要。","be は動詞の原形で、recommend that の that 節に正しく使われる。","will be は未来形。that 節には動詞の原形が必要。"]},

{id:515,category:"仮定法",sentence:"If I ___ you, I would negotiate for a higher starting salary.",choices:["am","was","were","had been"],answer:2,
 point:"現在の事実に反する仮定を表す仮定法過去では、be動詞は主語に関わらず were を使います。",
 notes:["am は直説法の現在形。仮定法過去では使わない。","was は口語では使われることもあるが、正式な仮定法過去では were が適切。","were は仮定法過去の be動詞として、主語が I でも正しく使われる。","had been は仮定法過去完了で、過去の事実に反する仮定を表すため、この文脈には合わない。"]},

{id:516,category:"仮定法",sentence:"It is essential that every employee ___ the new safety protocol by Friday.",choices:["completes","completed","complete","will complete"],answer:2,
 point:"It is essential that ～のような必要性を表す表現に続く that 節では、動詞の原形（仮定法現在）を使います。",
 notes:["completes は三人称単数現在形。that 節には動詞の原形が必要。","completed は過去形。that 節には動詞の原形が必要。","complete は動詞の原形で、essential that の that 節に正しく使われる。","will complete は未来形。that 節には動詞の原形が必要。"]},

{id:517,category:"仮定法",sentence:"The manager insisted that the report ___ submitted before the deadline.",choices:["is","was","be","will be"],answer:2,
 point:"insist that ～のような要求を表す動詞に続く that 節では、動詞の原形（仮定法現在）を使います。",
 notes:["is は三人称単数現在形。that 節には動詞の原形が必要。","was は過去形。that 節には動詞の原形が必要。","be は動詞の原形で、insisted that の that 節に正しく使われる。","will be は未来形。that 節には動詞の原形が必要。"]},

{id:518,category:"仮定法",sentence:"___ the merger fall through, both companies would need to revise their financial forecasts.",choices:["If","Should","Were","Had"],answer:2,
 point:"「If ～ were to」の if を省略して倒置すると「Were ～ to」の語順になります。",
 notes:["If を使う場合は If the merger were to fall through という語順になり、この位置には合わない。","Should は「If ～ should」の倒置形で、should fall through という形になるため、この文には合わない。","Were は「If ～ were to」の倒置形として、Were the merger to fall through と正しく対応する。","Had は「If ～ had 過去分詞」の倒置形で、この文脈の未来の仮定には合わない。"]},

{id:519,category:"仮定法",sentence:"___ we received your application earlier, we could have scheduled an interview this week.",choices:["If","Should","Were","Had"],answer:2,
 point:"「If ～ had 過去分詞」の if を省略して倒置すると「Had ～ 過去分詞」の語順になります。",
 notes:["If を使う場合は If we had received という語順になり、この位置には合わない。","Should は未来の仮定を表す倒置形で、この過去の仮定には合わない。","Were は「If ～ were」の倒置形で、この過去完了の仮定には合わない。","Had は「If ～ had 過去分詞」の倒置形として、Had we received と正しく対応する。"]},

{id:520,category:"仮定法",sentence:"The consultant speaks about the merger as if she ___ personally involved in the negotiations.",choices:["is","was","were","has been"],answer:2,
 point:"「as if ～（まるで～であるかのように）」に続く仮定法過去では、be動詞は were を使います。",
 notes:["is は直説法の現在形。as if の仮定法過去では使わない。","was は口語で使われることもあるが、正式な仮定法過去では were が適切。","were は仮定法過去の be動詞として、as if の節に正しく使われる。","has been は現在完了。as if の仮定法過去には合わない。"]},

{id:521,category:"仮定法",sentence:"___ the deadline be extended, the team would have more time to finalize the proposal.",choices:["If","Were","Should","Had"],answer:2,
 point:"「If ～ should」の if を省略して倒置すると「Should ～」の語順になります。",
 notes:["If を使う場合は If the deadline should be extended という語順になり、この位置には合わない。","Were は「If ～ were」の倒置形で、この文脈には合わない。","Should は「If ～ should」の倒置形として、Should the deadline be extended と正しく対応する。","Had は「If ～ had 過去分詞」の倒置形で、この文脈には合わない。"]},

{id:522,category:"仮定法",sentence:"The board requires that all expense reports ___ accompanied by original receipts.",choices:["are","were","be","will be"],answer:2,
 point:"require that ～のような要求を表す動詞に続く that 節では、動詞の原形（仮定法現在）を使います。",
 notes:["are は現在形。that 節には動詞の原形が必要。","were は過去形。that 節には動詞の原形が必要。","be は動詞の原形で、requires that の that 節に正しく使われる。","will be は未来形。that 節には動詞の原形が必要。"]},

{id:523,category:"仮定法",sentence:"If the negotiations ___ collapsed, thousands of jobs would have been at risk.",choices:["have","has","had","having"],answer:2,
 point:"過去の事実に反する仮定を表す仮定法過去完了は「if + 主語 + had + 過去分詞」の形を使います。",
 notes:["have は現在完了に使う形で、仮定法過去完了には had が必要。","has も現在完了に使う形で、仮定法過去完了には合わない。","had は仮定法過去完了の助動詞として、collapsed と組み合わさり would have been と正しく対応する。","having は分詞形で、if 節の定形動詞としては使えない。"]},

{id:524,category:"仮定法",sentence:"I wish the shipment ___ arrive before the client's visit tomorrow.",choices:["arrives","had arrived","would","arrived"],answer:2,
 point:"「wish + would + 動詞の原形」は、未来の出来事に対する願望や不満を表します。",
 notes:["arrives は現在形。wish に続けて未来の願望を表すには不適切。","had arrived は仮定法過去完了で、過去の出来事に対する後悔を表すため、明日という未来の文脈には合わない。","would は would arrive の形で、未来の実現を望む気持ちを正しく表す。","arrived は過去形。wish に続けて未来の願望を表すには不適切。"]},

{id:525,category:"仮定法",sentence:"If profits ___ decline further, the company may need to consider layoffs.",choices:["will","would","should","were"],answer:2,
 point:"「if ～ should」は、実現の可能性が低い未来の仮定を表す表現です。",
 notes:["will は if 節では通常使わない。","would は仮定法過去の帰結節で使われる助動詞で、if 節の中でこの形では使わない。","should は「もし万一～ならば」という低い可能性の未来を正しく表す。","were は仮定法過去の be動詞で、declineという一般動詞とは組み合わせない。"]},

{id:526,category:"仮定法",sentence:"The auditor demanded that the discrepancy ___ explained immediately.",choices:["is","was","be","has been"],answer:2,
 point:"demand that ～のような要求を表す動詞に続く that 節では、動詞の原形（仮定法現在）を使います。",
 notes:["is は三人称単数現在形。that 節には動詞の原形が必要。","was は過去形。that 節には動詞の原形が必要。","be は動詞の原形で、demanded that の that 節に正しく使われる。","has been は現在完了。that 節には動詞の原形が必要。"]},

{id:527,category:"仮定法",sentence:"If the CEO ___ aware of the issue sooner, the crisis could have been avoided.",choices:["is","was","had been","were"],answer:2,
 point:"過去の事実に反する仮定を表す仮定法過去完了は「if + 主語 + had + 過去分詞」の形を使います。",
 notes:["is は直説法の現在形。過去の事実に反する仮定には使えない。","was は直説法の過去形。仮定法過去完了には had been が必要。","had been は仮定法過去完了で、could have been avoided と正しく対応する。","were は仮定法過去の be動詞で、現在の事実に反する仮定を表すため、過去への帰結（could have been avoided）とは時制が一致しない。"]},

{id:528,category:"仮定法",sentence:"Employees speak of the retiring director as though he ___ never leaving the company.",choices:["is","was","were","has been"],answer:2,
 point:"「as though ～（まるで～であるかのように）」に続く仮定法過去では、be動詞は were を使います。",
 notes:["is は直説法の現在形。as though の仮定法過去では使わない。","was は口語で使われることもあるが、正式な仮定法過去では were が適切。","were は仮定法過去の be動詞として、as though の節に正しく使われる。","has been は現在完了。as though の仮定法過去には合わない。"]},

{id:529,category:"仮定法",sentence:"It is imperative that the contract ___ reviewed by legal counsel before signing.",choices:["is","was","be","will be"],answer:2,
 point:"It is imperative that ～のような必要性を表す表現に続く that 節では、動詞の原形（仮定法現在）を使います。",
 notes:["is は三人称単数現在形。that 節には動詞の原形が必要。","was は過去形。that 節には動詞の原形が必要。","be は動詞の原形で、imperative that の that 節に正しく使われる。","will be は未来形。that 節には動詞の原形が必要。"]},

{id:530,category:"仮定法",sentence:"If the airline ___ additional flights, more travelers could reach the conference on time.",choices:["adds","added","were to add","has added"],answer:2,
 point:"「if ～ were to」は、実現の可能性が低い未来の仮定を表す表現です。",
 notes:["adds は現在形。if 節の単純な条件文で使う形で、この文脈の仮定のニュアンスとはやや異なる。","added は仮定法過去だが、動詞句として were to add ほど明確に仮定のニュアンスを示さない。","were to add は「if ～ were to」の形で、実現可能性の低い未来の仮定を正しく表す。","has added は現在完了。仮定法の文脈には合わない。"]},

{id:531,category:"仮定法",sentence:"The committee suggested that the proposal ___ postponed until further data was available.",choices:["is","was","be","has been"],answer:2,
 point:"suggest that ～のような提案を表す動詞に続く that 節では、動詞の原形（仮定法現在）を使います。",
 notes:["is は三人称単数現在形。that 節には動詞の原形が必要。","was は過去形。that 節には動詞の原形が必要。","be は動詞の原形で、suggested that の that 節に正しく使われる。","has been は現在完了。that 節には動詞の原形が必要。"]},

{id:532,category:"仮定法",sentence:"Had the vendor delivered the parts on time, the assembly line ___ halted.",choices:["will not have","does not","would not have","had not"],answer:2,
 point:"倒置による仮定法過去完了の帰結節では「would have + 過去分詞」の形を使います。",
 notes:["will not have は未来形で、過去の事実に反する仮定の帰結には使わない。","does not は現在形で、この文脈には合わない。","would not have は仮定法過去完了の帰結節として、halted と正しく対応する。","had not は if 節側で使う形で、帰結節には would が必要。"]},

{id:533,category:"仮定法",sentence:"If the survey results ___ different, the marketing strategy would likely change.",choices:["are","was","were","had been"],answer:2,
 point:"現在の事実に反する仮定を表す仮定法過去では、be動詞は主語に関わらず were を使います。",
 notes:["are は直説法の現在形。仮定法過去では使わない。","was は複数主語 results と数が一致せず、仮定法過去でも were が適切。","were は仮定法過去の be動詞として、複数主語 results にも正しく使われる。","had been は仮定法過去完了で、過去の事実に反する仮定を表すため、この文脈には合わない。"]},

{id:534,category:"仮定法",sentence:"I wish I ___ more carefully before signing the original agreement.",choices:["read","have read","had read","would read"],answer:2,
 point:"「wish + had + 過去分詞」は、過去の出来事に対する後悔を表します。",
 notes:["read は過去形。wish に続く過去への後悔には過去完了が必要。","have read は現在完了。wish に続く過去への後悔には合わない。","had read は仮定法過去完了で、過去の行動への後悔を正しく表す。","would read は未来への願望を表し、この過去の後悔には合わない。"]},

{id:535,category:"代名詞",sentence:"The new printer configures ___ automatically once connected to the network.",choices:["them","it","itself","themselves"],answer:2,
 point:"主語 the new printer（単数・物）自身を指す再帰代名詞は itself です。",
 notes:["them は複数の目的格代名詞で、単数の printer には合わない。","it は単数の目的格代名詞だが、主語自身を指す再帰の意味を表せない。","itself は単数・物を指す再帰代名詞で、「自動的に自身を設定する」という意味を正しく表す。","themselves は複数の再帰代名詞で、単数の printer には合わない。"]},

{id:536,category:"代名詞",sentence:"The department heads often consult ___ regarding budget allocations.",choices:["themselves","him","each other","it"],answer:2,
 point:"「互いに」という相互の関係を表す代名詞は each other です。",
 notes:["themselves は再帰代名詞で「自分自身を」という意味になり、互いに相談するという文意には合わない。","him は単数・男性の代名詞で、複数の department heads には合わない。","each other は「お互いに」という相互関係を正しく表す。","it は単数・物を指す代名詞で、人を表す department heads には合わない。"]},

{id:537,category:"代名詞",sentence:"___ of the applicants met the minimum qualifications, so the position remains open.",choices:["Few","Some","None","Several"],answer:2,
 point:"文脈から「誰も条件を満たさなかった」という意味を読み取り、否定を表す none を選びます。",
 notes:["Few は「ほとんど～ない」という意味だが、少数は満たしたことを示唆し、position remains open という帰結にはやや弱い。","Some は「いくらか」という肯定的な意味で、この文脈の帰結（position remains open）に合わない。","None は「誰も～ない」という完全な否定を表し、position remains open という帰結と自然に対応する。","Several は「いくつかの」という肯定的な意味で、この文脈には合わない。"]},

{id:538,category:"代名詞",sentence:"Each branch office is expected to keep track of ___ own monthly expenses.",choices:["their","his","its","our"],answer:2,
 point:"each branch office は単数扱いの物を表す主語のため、所有格は its を使います。",
 notes:["their は複数の所有格で、単数扱いの each branch office には合わない。","his は人を指す所有格で、組織を表す branch office には合わない。","its は単数・物を指す所有格として、each branch office を正しく受ける。","our は一人称複数の所有格で、この文脈の主語とは一致しない。"]},

{id:539,category:"代名詞",sentence:"___ of the two proposals fully addresses the client's concerns.",choices:["Both","Few","Neither","Several"],answer:2,
 point:"動詞が addresses という単数形であることから、単数扱いの neither が適切です。",
 notes:["Both は複数扱いのため、動詞は address（原形）になるはずで、addresses とは一致しない。","Few は複数扱いのため、動詞は address になるはずで、addresses とは一致しない。","Neither は単数扱いで、動詞 addresses と正しく一致する。","Several は複数扱いのため、動詞は address になるはずで、addresses とは一致しない。"]},

{id:540,category:"代名詞",sentence:"The company introduced three new features, but ___ of them attracted much attention from users.",choices:["all","both","none","each"],answer:2,
 point:"3つ以上の中から「どれも～ない」という否定を表す代名詞は none です。",
 notes:["all は「すべて」という肯定的な意味で、but に続く逆接の文脈に合わない。","both は2つのものに対して使う代名詞で、three new features という3つの対象には合わない。","none は「どれも～ない」という否定を正しく表し、but の逆接と自然につながる。","each は「それぞれ」という肯定的な意味で、この文脈の否定には合わない。"]},

{id:541,category:"代名詞",sentence:"You may submit the form online or by mail; either method is acceptable.",choices:["whichever","neither","either","both"],answer:2,
 point:"2つの選択肢のうちどちらでもよいことを表す代名詞は either です。",
 notes:["whichever は「どちらを選んでも」という意味の関係代名詞的な用法で、単独で method を修飾する形としては不自然。","neither は「どちらも～ない」という否定を表し、acceptable という肯定文脈に合わない。","either は「どちらか一方」という意味で、単数形 method is と正しく一致する。","both は複数を表すため、単数形の method is とは一致しない（methods are の形が必要）。"]},

{id:542,category:"代名詞",sentence:"Each employee received ___ own login credentials for the new system.",choices:["them","they","their","theirs"],answer:2,
 point:"名詞 own credentials の前に置く所有格代名詞は their です。",
 notes:["them は目的格代名詞で、名詞の前の所有格の位置には使えない。","they は主格代名詞で、名詞の前の所有格の位置には使えない。","their は所有格代名詞で、own login credentials を正しく修飾する。","theirs は独立所有格で、後ろに名詞を直接置く形では使えない。"]},

{id:543,category:"代名詞",sentence:"The two departments share the same office space, but each has ___ own separate entrance.",choices:["their","his","its","our"],answer:2,
 point:"each は単数扱いのため、物を指す所有格は its を使います。",
 notes:["their は複数の所有格で、単数扱いの each には合わない。","his は人を指す所有格で、部署という組織を表すこの文脈には合わない。","its は単数・物を指す所有格として、each を正しく受ける。","our は一人称複数の所有格で、この文脈の主語とは一致しない。"]},

{id:544,category:"代名詞",sentence:"If you have any questions, please direct ___ to the HR department.",choices:["it","they","them","this"],answer:2,
 point:"複数名詞 questions を受ける目的格代名詞は them です。",
 notes:["it は単数の目的格代名詞で、複数の questions には合わない。","they は主格代名詞で、動詞 direct の目的語の位置には使えない。","them は複数の目的格代名詞で、questions を正しく受ける。","this は単数の指示代名詞で、複数の questions には合わない。"]},

{id:545,category:"代名詞",sentence:"The proposal itself was solid, but its implementation proved far more difficult than expected.",choices:["their","it's","its","itself"],answer:2,
 point:"名詞 implementation の前に置く所有格は its です。it's は it is の短縮形であり所有格ではありません。",
 notes:["their は複数の所有格で、単数の the proposal には合わない。","it's は it is の短縮形であり、所有格として名詞を修飾することはできない。","its はアポストロフィなしの所有格で、implementation を正しく修飾する。","itself は再帰代名詞で、名詞の前の所有格の位置には使えない。"]},

{id:546,category:"代名詞",sentence:"Both candidates presented strong qualifications, but neither had prior experience in this specific industry.",choices:["both","either","neither","none"],answer:2,
 point:"2人のうち「どちらも～ない」という否定を表す代名詞は neither です。",
 notes:["both は「両方とも」という肯定的な意味で、but に続く逆接の否定文脈に合わない。","either は「どちらか一方」という意味で、単独で否定文に使うには unlikely（通常 not either の形になる）。","neither は「（2つのうち）どちらも～ない」という否定を正しく表す。","none は3つ以上のものに対して使うのが原則で、2人（candidates）を指すこの文脈には neither が適切。"]},

{id:547,category:"代名詞",sentence:"The technicians upgraded the servers themselves over the past weekend, without hiring an outside contractor.",choices:["them","it","themselves","itself"],answer:2,
 point:"主語 the technicians（複数・人）自身を指す再帰代名詞は themselves です。",
 notes:["them は複数の目的格代名詞で、主語自身を指す再帰の意味を表せない。","it は単数・物を指す代名詞で、複数の人を表す technicians には合わない。","themselves は複数・人を指す再帰代名詞で、「自分たちの手で」という意味を正しく表す。","itself は単数・物を指す再帰代名詞で、複数の technicians には合わない。"]},

{id:548,category:"代名詞",sentence:"If one wants to succeed in this industry, one must be willing to adapt quickly.",choices:["he","you","one","they"],answer:2,
 point:"フォーマルな文体では、不特定の人を指す代名詞 one を文中で一貫して使います。",
 notes:["he は特定の性別を示す代名詞で、不特定の人を指す one とは一致しない。","you は口語的な代名詞で、フォーマルな文体で one と混在させるのは不自然。","one は不特定の人を指す代名詞として、前出の one と一貫して正しく使われる。","they は複数の代名詞で、単数の one とは数が一致しない。"]},
