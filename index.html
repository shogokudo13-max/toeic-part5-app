 notes:["unless は「～しない限り」という条件を表し、文意に自然に合う。","despite は前置詞で、後ろに節を続けることができない。","because は「～なので」という理由を表し、文意に合わない。","so that は目的・結果を表す接続詞で、条件の意味にはならない。"]},

{id:155,category:"接続詞",sentence:"___ she had never managed a team before, she led the project to a successful completion.",choices:["Even though","Because","Unless","So that"],answer:0,
 point:"前半（チームを率いた経験がなかった）と後半（プロジェクトを成功させた）が対照的な内容であるため、逆接の接続詞 Even though が適切です。",
 notes:["Even though は「～だけれども」という逆接を強調して表し、対照的な文意に合う。","Because は理由を表す接続詞で、対照的な文意には合わない。","Unless は条件を表す接続詞で、この文脈には合わない。","So that は目的・結果を表し、逆接の意味にはならない。"]},

{id:156,category:"接続詞",sentence:"The manager double-checked the figures ___ there would be no errors in the final report.",choices:["so that","because","although","unless"],answer:0,
 point:"「so that ～」は「～するために」という目的を表す接続詞です。",
 notes:["so that は目的を表し、「誤りがないようにするために再確認した」という文意に合う。","because は理由を表す接続詞で、目的を表すこの文脈には合わない。","although は逆接を表し、文意に合わない。","unless は条件を表し、目的の意味にはならない。"]},

{id:157,category:"接続詞",sentence:"The flight was cancelled due to the storm; ___, passengers were rebooked on the next available flight.",choices:["consequently","although","because","unless"],answer:0,
 point:"セミコロンの後で前の文の結果・帰結を表すときは接続副詞 consequently を使います。",
 notes:["consequently は「その結果として」という結果を表す接続副詞で、文意に合う。","although は従属接続詞で、セミコロンで独立文をつなぐこの構文には使えない。","because も従属接続詞であり、同様にこの構文には使えない。","unless は条件を表す接続詞で、意味・構造ともに合わない。"]},

{id:158,category:"接続詞",sentence:"___ the marketing budget was significantly cut, the campaign still exceeded its sales targets.",choices:["Although","Because","Since","So that"],answer:0,
 point:"前半（予算が削減された）と後半（それでも目標を上回った）が対照的な内容であるため、逆接の接続詞 Although が適切です。",
 notes:["Although は「～だけれども」という逆接を表し、対照的な文意に合う。","Because は理由を表す接続詞で、対照的な文意には合わない。","Since も理由・時間を表す接続詞で、Because と同様に逆接の意味にはならない。","So that は目的・結果を表し、逆接の意味にはならない。"]},

{id:159,category:"接続詞",sentence:"The vendor agreed to lower the unit price ___ the client placed a significantly larger order.",choices:["provided that","despite","although","unless"],answer:0,
 point:"「provided that ～」は「～という条件であれば」という条件を表す接続詞です。",
 notes:["provided that は「～という条件で」を表し、「大口注文をするなら値下げに応じる」という文意に自然に合う。","despite は前置詞で、後ろに節を続けることができない。","although は逆接を表す接続詞で、条件の意味にはならない。","unless は「～しない限り」という否定条件で、文意が逆になってしまう。"]},

{id:160,category:"接続詞",sentence:"___ the CFO reviews and signs off on the budget proposal, no further spending will be authorized.",choices:["Until","Despite","Because of","Although"],answer:0,
 point:"「until ～」は「～するまで」という接続詞で、「CFOが承認するまで支出は認められない」という文意に合致します。",
 notes:["Until は「～するまで」という意味で節を導ける接続詞であり、文意に合う。","Despite は前置詞で、後ろに節を続けることができない。","Because of も前置詞句であり、同様に節を続けられない。","Although は逆接の接続詞で、この文脈には合わない。"]},

{id:161,category:"接続詞",sentence:"The team worked through the entire weekend ___ they could meet the product launch deadline.",choices:["so that","although","unless","despite"],answer:0,
 point:"「so that ～」は「～するために」という目的を表す接続詞です。",
 notes:["so that は目的を表し、「締め切りに間に合わせるために週末も働いた」という文意に合う。","although は逆接を表し、文意に合わない。","unless は条件を表し、目的の意味にはならない。","despite は前置詞で、後ろに節を続けることができない。"]},

{id:162,category:"接続詞",sentence:"The client praised the overall design of the product; ___, she requested several revisions before final approval.",choices:["however","therefore","because","unless"],answer:0,
 point:"セミコロンの後で前の文と対比・逆接の内容をつなぐときは接続副詞 however を使います。",
 notes:["however は「しかしながら」という接続副詞で、称賛しつつも修正を求めるという対比の文意に合う。","therefore は結果を表す接続副詞で、この対比の文脈には合わない。","because は従属接続詞で、セミコロンで独立文をつなぐこの構文には使えない。","unless は条件を表す接続詞で、意味・構造ともに合わない。"]},

{id:163,category:"関係詞",sentence:"The engineer ___ designed the new system will present it at next week's conference.",choices:["who","whom","whose","which"],answer:0,
 point:"先行詞 engineer は人であり、後ろに動詞 designed が続く主格の関係代名詞が必要です。人を指す主格の関係代名詞は who です。",
 notes:["who は人を先行詞とする主格の関係代名詞で、後ろに動詞 designed が続く形に正しく合う。","whom は目的格で、後ろに完全な文の要素が必要であり、動詞が直接続くこの形には合わない。","whose は所有格で、後ろに名詞が必要だが、ここは動詞が続いており合わない。","which は物を先行詞とする関係代名詞で、先行詞が人（engineer）のときは使わない。"]},

{id:164,category:"関係詞",sentence:"The proposal, ___ details were outlined in the memo, was approved unanimously by the board.",choices:["which","whose","who","whom"],answer:1,
 point:"空欄の後ろの details は「その提案の詳細」という所有関係にあるため、所有格の関係代名詞 whose を使います。",
 notes:["which は主格・目的格の関係代名詞で、後ろに名詞 details が直接続く所有関係を表せない。","whose は所有格の関係代名詞。whose details で「その提案の詳細」という所有関係を正しく表せる。","who は人を先行詞とする関係代名詞で、proposal（物）には使えない。","whom も人を先行詞とする関係代名詞で、同様に使えない。"]},

{id:165,category:"関係詞",sentence:"This is the supplier ___ we have worked with for over a decade.",choices:["whom","which","whose","who"],answer:0,
 point:"先行詞 supplier は人であり、前置詞 with の目的語として機能する目的格の関係代名詞が必要です。人を指す目的格の関係代名詞は whom です。",
 notes:["whom は人を先行詞とする目的格の関係代名詞で、worked with の目的語として正しく機能する。","which は物を先行詞とする関係代名詞で、supplier（人）には使わない。","whose は所有格で、後ろに名詞が必要だが、ここは完全な節が続いており合わない。","who は主格として使われることが多く、目的格の位置ではより形式的な whom が適切とされる。"]},

{id:166,category:"関係詞",sentence:"The report ___ contains confidential data must be stored on a secure server.",choices:["which","whom","whose","who"],answer:0,
 point:"先行詞 report は物であり、後ろに動詞 contains が続く主格の関係代名詞が必要です。物を指す主格の関係代名詞は which です。",
 notes:["which は物を先行詞とする主格の関係代名詞で、後ろに動詞 contains が続く形に正しく合う。","whom は人を先行詞とする目的格の関係代名詞で、report（物）には使えない。","whose は所有格で、後ろに名詞が必要だが、ここは動詞が続いており合わない。","who は人を先行詞とする関係代名詞で、report（物）には使えない。"]},

{id:167,category:"関係詞",sentence:"Candidates ___ applications are incomplete will not be considered for the position.",choices:["who","whose","which","whom"],answer:1,
 point:"空欄の後ろの applications は「候補者の応募書類」という所有関係にあるため、所有格の関係代名詞 whose を使います。",
 notes:["who は主格で、直後には動詞が続く形になるため、名詞 applications が続くこの文には合わない。","whose は所有格の関係代名詞。whose applications で「彼らの応募書類」という所有関係を正しく表せる。","which は物を先行詞とする関係代名詞で、先行詞が人（Candidates）のときは使わない。","whom は目的格で、後ろに完全な文の要素が必要でありここでは合わない。"]},

{id:168,category:"関係詞",sentence:"The client ___ we met yesterday has decided to sign the long-term contract.",choices:["whom","whose","which","what"],answer:0,
 point:"先行詞 client は人であり、動詞 met の目的語として機能する目的格の関係代名詞が必要です。人を指す目的格の関係代名詞は whom です。",
 notes:["whom は人を先行詞とする目的格の関係代名詞で、met の目的語として正しく機能する。","whose は所有格で、後ろに名詞が必要だが、ここは完全な節が続いており合わない。","which は物を先行詞とする関係代名詞で、client（人）には使わない。","what は先行詞を含む関係代名詞で、先行詞 client がすでにある文には使えない。"]},

{id:169,category:"関係詞",sentence:"The office ___ the meeting was held has been completely renovated since then.",choices:["where","which","whose","who"],answer:0,
 point:"先行詞 office は場所を表し、後ろに完全な文（the meeting was held）が続いているため、関係副詞 where が必要です。",
 notes:["where は場所を表す関係副詞で、後ろに完全な文が続く形に正しく合う。","which は関係代名詞であり、後ろには主語や目的語が欠けた不完全な文が続く必要があるが、ここは完全な文が続いている。","whose は所有格の関係代名詞で、後ろに名詞が必要でありここでは合わない。","who は人を先行詞とする関係代名詞で、office（場所）には使わない。"]},

{id:170,category:"関係詞",sentence:"The reason ___ the merger ultimately failed remains unclear to most shareholders.",choices:["why","which","where","whose"],answer:0,
 point:"先行詞 reason（理由）を受け、後ろに完全な文が続くときは関係副詞 why を使います。",
 notes:["why は理由を表す先行詞 reason とともに使われる関係副詞で、後ろに完全な文が続く形に正しく合う。","which は関係代名詞であり、後ろに不完全な文が続く必要があるが、ここは完全な文が続いている。","where は場所を表す関係副詞で、reason（理由）には使わない。","whose は所有格の関係代名詞で、後ろに名詞が必要でありここでは合わない。"]},

{id:171,category:"関係詞",sentence:"The year ___ the company was founded marked a turning point in the industry.",choices:["when","which","where","whose"],answer:0,
 point:"先行詞 year（時）を受け、後ろに完全な文が続くときは関係副詞 when を使います。",
 notes:["when は時を表す先行詞 year とともに使われる関係副詞で、後ろに完全な文が続く形に正しく合う。","which は関係代名詞であり、後ろに不完全な文が続く必要があるが、ここは完全な文が続いている。","where は場所を表す関係副詞で、year（時）には使わない。","whose は所有格の関係代名詞で、後ろに名詞が必要でありここでは合わない。"]},

{id:172,category:"関係詞",sentence:"The assistant, ___ recommendation letters impressed the hiring committee, was hired immediately.",choices:["whose","who","whom","which"],answer:0,
 point:"空欄の後ろの recommendation letters は「そのアシスタントの推薦状」という所有関係にあるため、所有格の関係代名詞 whose を使います。",
 notes:["whose は所有格の関係代名詞。whose recommendation letters で「その人の推薦状」という所有関係を正しく表せる。","who は主格で、直後には動詞が続く形になるため、名詞句が続くこの文には合わない。","whom は目的格で、後ろに完全な文の要素が必要でありここでは合わない。","which は物を先行詞とする関係代名詞で、先行詞が人（assistant）のときは使わない。"]},

{id:173,category:"関係詞",sentence:"The firm ___ acquired our main competitor last year has since expanded into three new markets.",choices:["which","whom","whose","who"],answer:0,
 point:"先行詞 firm は組織（物扱い）であり、後ろに動詞 acquired が続く主格の関係代名詞が必要です。物・組織を指す主格の関係代名詞は which です。",
 notes:["which は物・組織を先行詞とする主格の関係代名詞で、後ろに動詞が続く形に正しく合う。","whom は人を先行詞とする目的格の関係代名詞で、firm（組織）には使わない。","whose は所有格で、後ろに名詞が必要だが、ここは動詞が続いており合わない。","who は人を先行詞とする関係代名詞で、firm（組織）には基本的に使わない。"]},

{id:174,category:"比較",sentence:"This year's marketing budget is significantly ___ than last year's.",choices:["large","larger","largest","more large"],answer:1,
 point:"文中に than があることから比較級が必要だと分かります。",
 notes:["large は原級。than を伴う比較の文には使えない。","larger は比較級。than last year's と正しく対応する。","largest は最上級。than を伴う二者比較には使わない。","more large は誤った比較級の作り方（larger が正しい形）。"]},

{id:175,category:"比較",sentence:"Of the three job offers she received, she chose the ___ one in terms of salary and benefits.",choices:["good","better","best","well"],answer:2,
 point:"「Of the three job offers（3つの内定の中で）」という範囲を示す表現があることから、最上級が適切です。",
 notes:["good は原級。三者以上の中での最上位を示す文脈には合わない。","better は比較級で、三者以上の中での最上位を示す文脈には合わない。","best は最上級「最も良い」。of the three job offers という範囲表現と自然に対応する。","well は副詞で、one を修飾する形容詞の位置には入らない。"]},

{id:176,category:"比較",sentence:"The sooner we finalize the contract, the ___ we can begin production.",choices:["soon","sooner","soonest","more soon"],answer:1,
 point:"「The + 比較級 ～, the + 比較級 …」で「～すればするほど、ますます…」という構文です。前半に The sooner（比較級）があることからも比較級が必要と分かります。",
 notes:["soon は原級。この構文には比較級が必要なため合わない。","sooner は比較級で、The sooner ~, the sooner … という構文に正しく合う。","soonest は最上級で、この構文には使わない。","more soon は誤った比較級の作り方（sooner が正しい形）。"]},

{id:177,category:"比較",sentence:"The company's new headquarters is nearly three times ___ large as its previous office.",choices:["as","so","than","that"],answer:0,
 point:"「倍数＋as +原級+ as ～」で「～の何倍…だ」という倍数比較の定型表現です。",
 notes:["as は as ～ as の形で倍数表現を作る正しい語。","so は否定文の as の代わりに使われることはあるが、この肯定の倍数表現には使わない。","than は比較級とセットで使う語で、原級の大きさを比べるこの構文には合わない。","that は指示代名詞・接続詞であり、この構文には使えない。"]},

{id:178,category:"比較",sentence:"Our regional office reported the ___ growth of all the company's branches this quarter.",choices:["high","higher","highest","more high"],answer:2,
 point:"「Of all the company's branches（すべての支店の中で）」という範囲を示す表現があることから、最上級が適切です。",
 notes:["high は原級で、範囲の中での最上位を示す文脈には合わない。","higher は比較級で、三者以上の中での最上位を示す文脈には合わない。","highest は最上級「最も高い」。of all the company's branches という範囲表現と自然に対応する。","more high は誤った比較級・最上級の作り方（higher/highest が正しい形）。"]},

{id:179,category:"比較",sentence:"The revised proposal is much ___ than the original draft submitted last month.",choices:["clear","clearer","clearest","more clear"],answer:1,
 point:"文中に than があることから比較級が必要だと分かります。much は比較級を強調する副詞です。",
 notes:["clear は原級。than を伴う比較の文には使えない。","clearer は比較級。than the original draft と正しく対応し、much による強調も自然。","clearest は最上級。than を伴う二者比較には使わない。","more clear は誤った比較級の作り方（clearer が正しい形）。"]},

{id:180,category:"比較",sentence:"This laptop model is among the ___ on the market in terms of battery life.",choices:["long-lasting","longer-lasting","most long-lasting","long-lastingly"],answer:2,
 point:"「among the + 最上級」で「最も～なものの一つ」という定型表現です。long-lasting のような複合形容詞の最上級は most を用いて作ります。",
 notes:["long-lasting は原級で、among the ~ の形には最上級が必要なため合わない。","longer-lasting という比較級の作り方は不自然で、複合形容詞には more/most を用いる。","most long-lasting は複合形容詞の最上級として正しい形で、among the ~ という定型表現にも合う。","long-lastingly という副詞形は一般的に使われない。"]},

{id:181,category:"比較",sentence:"The new employee adapted to the company culture ___ than most managers had expected.",choices:["quick","quickly","quicker","more quickly"],answer:3,
 point:"文中に than があることから比較級が必要だと分かります。動詞 adapted を修飾するのは副詞で、quickly の比較級は more quickly です。",
 notes:["quick は形容詞の原級。動詞を修飾できない。","quickly は副詞の原級。than を伴う比較の文には比較級が必要。","quicker は誤った比較級の作り方で、quickly の比較級は more quickly が正しい形。","more quickly は副詞 quickly の正しい比較級で、than と自然に対応する。"]},

{id:182,category:"比較",sentence:"The two candidates performed equally well in the interview, but neither was clearly ___ than the other.",choices:["good","well","better","best"],answer:2,
 point:"文中に than があることから比較級が必要だと分かります。",
 notes:["good は形容詞の原級。than を伴う比較の文には使えない。","well は副詞（または形容詞「健康な」）の原級で、この文脈には合わない。","better は比較級「より良い」。than the other と正しく対応する。","best は最上級。than を伴う二者比較には使わない。"]},

{id:183,category:"代名詞",sentence:"The board members submitted ___ expense reports before the fiscal year-end deadline.",choices:["they","their","them","theirs"],answer:1,
 point:"空欄の直後の名詞 expense reports を修飾するのは所有格代名詞です。",
 notes:["they は主格代名詞で、名詞の前には置けない。","their は所有格代名詞「彼らの」。expense reports を正しく修飾する。","them は目的格代名詞で、名詞の前には置けない。","theirs は所有代名詞（～のもの）で、名詞を直接修飾する形では使わない。"]},

{id:184,category:"代名詞",sentence:"Neither of the two applicants provided ___ references by the requested deadline.",choices:["his or her","their","its","he or she"],answer:0,
 point:"Neither of the two applicants は文法上単数として扱われ、応募者は人であるため、対応する所有格代名詞は his or her を使います。",
 notes:["his or her は単数かつ人を指す所有格の組み合わせで、neither に正しく対応する。","their は複数の所有格代名詞で、単数扱いの neither とは形式上一致しない。","its は物を指す所有格代名詞で、人を指す applicants には使わない。","he or she は主格代名詞で、名詞 references の前に置く所有格の位置には合わない。"]},

{id:185,category:"代名詞",sentence:"The two new interns were asked to review ___ presentations before the client meeting.",choices:["each other's","each other","one another's","themselves"],answer:0,
 point:"主語が「二人（the two new interns）」であり、空欄の後ろに名詞 presentations が続くことから、相互代名詞の所有格 each other's が必要です。",
 notes:["each other's は二者間の相互関係を表す所有格で、the two interns と presentations の間に正しく入る。","each other は所有格ではないため、直後に名詞を置く形には合わない。","one another's は主に三者以上で使われる相互代名詞の所有格で、二人が主語のこの文にはやや不自然。","themselves は再帰代名詞で、「彼ら自身」を意味し、相互の review という文意には合わない。"]},

{id:186,category:"代名詞",sentence:"The CEO ___ approved the final budget without delegating the decision to anyone else.",choices:["himself","him","he","his"],answer:0,
 point:"主語 The CEO を強調する再帰代名詞（強調用法）は himself で、主語の直後や文末に置かれます。",
 notes:["himself は強調用法の再帰代名詞で、The CEO himself で「CEO自らが」という意味を正しく表す。","him は目的格代名詞で、主語の直後に置いて強調する用法には使わない。","he は主格代名詞で、すでに主語 The CEO があるため重複してしまう。","his は所有格代名詞で、この位置には合わない。"]},

{id:187,category:"代名詞",sentence:"Each team member is responsible for meeting ___ own individual deadlines.",choices:["its","their","his or her","itself"],answer:2,
 point:"Each team member は文法上単数として扱われ、人を指すため、対応する所有格代名詞は his or her を使います。",
 notes:["its は物を指す所有格代名詞で、人を指す team member には使わない。","their は複数の所有格代名詞で、単数扱いの each とは形式上一致しない。","his or her は単数かつ人を指す所有格の組み合わせで、each team member に正しく対応する。","itself は再帰代名詞で、所有格として名詞の前には置けない。"]},

{id:188,category:"代名詞",sentence:"The corporation prides ___ on maintaining the highest ethical standards in the industry.",choices:["itself","its","it","themselves"],answer:0,
 point:"「pride oneself on ～」で「～を誇りに思う」という定型表現です。corporation は単数扱いなので再帰代名詞 itself を使います。",
 notes:["itself は単数の再帰代名詞で、pride itself on という定型表現に正しく合う。","its は所有格代名詞で、動詞 prides の目的語（再帰代名詞）の位置には使えない。","it は目的格代名詞だが、pride は再帰代名詞を取る動詞であるため it では意味が通らない。","themselves は複数の再帰代名詞で、単数扱いの corporation とは一致しない。"]},

{id:189,category:"代名詞",sentence:"The two co-founders built the business by relying heavily on ___ shared expertise.",choices:["they","their","them","theirs"],answer:1,
 point:"空欄の直後の名詞 shared expertise を修飾するのは所有格代名詞です。",
 notes:["they は主格代名詞で、名詞の前には置けない。","their は所有格代名詞「彼らの」。shared expertise を正しく修飾する。","them は目的格代名詞で、名詞の前には置けない。","theirs は所有代名詞（～のもの）で、名詞を直接修飾する形では使わない。"]},

{id:190,category:"代名詞",sentence:"None of the regional departments have finalized ___ budget for the upcoming fiscal year.",choices:["its","their","it's","them"],answer:1,
 point:"None of the departments は複数扱いの動詞 have と共に使われており、対応する所有格代名詞も複数の their になります。",
 notes:["its は単数の所有格代名詞で、複数扱いのこの主語（have と一致）とは合わない。","their は複数の所有格代名詞で、動詞 have と一致するこの主語に正しく対応する。","it's は it is の短縮形であり、所有格ではないためここでは使えない。","them は目的格代名詞で、名詞 budget の前に置く所有格の位置には合わない。"]},

{id:191,category:"代名詞",sentence:"The manager organized all the files by ___, without any help from colleagues.",choices:["himself","him","he","his"],answer:0,
 point:"「by oneself」で「独力で・誰の助けも借りずに」という定型表現です。前置詞 by の後には再帰代名詞が必要です。",
 notes:["himself は再帰代名詞で、by himself という定型表現に正しく合う。","him は目的格代名詞で、by oneself という定型表現の位置には使わない。","he は主格代名詞で、前置詞の後には使えない。","his は所有格代名詞で、この位置には合わない。"]},

{id:192,category:"仮定法",sentence:"If the merger ___ approved by regulators, the two companies would combine their operations by next year.",choices:["is","were","was","be"],answer:1,
 point:"主節が would combine（仮定法過去）であることから、if 節も現在の事実に反する、または実現の可能性が低い仮定を表す仮定法過去にします。仮定法過去の be動詞は主語に関わらず were を使います。",
 notes:["is は直説法現在形で、仮定法過去のこの構文には合わない。","were は仮定法過去で使う be動詞の形。主節の would combine と正しく対応する。","was は直説法過去形で、仮定法では were を使うのが原則。","be は原形で、if 節のこの位置には使えない。"]},

{id:193,category:"仮定法",sentence:"If the CEO ___ aware of the issue earlier, the crisis could have been avoided entirely.",choices:["was","were","had been","has been"],answer:2,
 point:"主節が could have been avoided（仮定法過去完了）であることから、if 節も過去の事実に反する仮定を表す仮定法過去完了（had + 過去分詞）にします。",
 notes:["was は単純過去で、仮定法過去完了の if 節としては時制が合わない。","were は仮定法過去の形で、過去の事実に反する仮定を表すこの文脈には had been が必要。","had been は仮定法過去完了の形で、主節の could have been avoided と正しく対応する。","has been は現在完了で、過去の事実に反する仮定を表す形としては不適切。"]},

{id:194,category:"仮定法",sentence:"The board requires that every expense report ___ approved by two authorized signatories.",choices:["is","be","was","will be"],answer:1,
 point:"require that ～のように要求を表す動詞に続く that節の中では、動詞は主語や時制に関わらず原形（仮定法現在）になります。",
 notes:["is は三人称単数現在形。要求を表す that 節では原形が使われるため不適切。","be は原形。requires that ～ be … の形で仮定法現在として正しく使われる。","was は過去形。同様にこの構文には使わない。","will be は未来形。この構文には使わない。"]},

{id:195,category:"仮定法",sentence:"It is essential that the contract ___ reviewed thoroughly by legal counsel before signing.",choices:["is","be","was","will be"],answer:1,
 point:"「It is essential that ～」のように必要性・重要性を表す表現に続く that節の中では、動詞は原形（仮定法現在）になります。",
 notes:["is は三人称単数現在形。この構文では原形が使われるため不適切。","be は原形。It is essential that ～ be … の形で仮定法現在として正しく使われる。","was は過去形。同様にこの構文には使わない。","will be は未来形。この構文には使わない。"]},

{id:196,category:"仮定法",sentence:"If I ___ in your position, I would request additional funding for the project immediately.",choices:["am","was","were","be"],answer:2,
 point:"「If I were you」に代表される仮定法過去の定型表現で、be動詞は主語にかかわらず were を使います。",
 notes:["am は直説法現在形で、仮定法過去のこの構文には合わない。","was は直説法過去形で、仮定法過去では were を使うのが原則。","were は仮定法過去で使う be動詞の形。If I were と正しく対応する。","be は原形で、if 節のこの位置には使えない。"]},

{id:197,category:"仮定法",sentence:"The external auditor recommended that the company ___ its internal controls immediately.",choices:["strengthens","strengthen","strengthened","will strengthen"],answer:1,
 point:"recommend that ～のように提案・勧告を表す動詞に続く that節の中では、動詞は主語や時制に関わらず原形（仮定法現在）になります。",
 notes:["strengthens は三人称単数現在形。提案を表す that 節では原形が使われるため不適切。","strengthen は原形。recommended that ～ strengthen … の形で仮定法現在として正しく使われる。","strengthened は過去形。同様にこの構文には使わない。","will strengthen は未来形。この構文には使わない。"]},

{id:198,category:"仮定法",sentence:"Had the shipment ___ on schedule, the client would not have filed a complaint with customer service.",choices:["arrived","arrive","arrives","been arrived"],answer:0,
 point:"「Had + 主語 + 過去分詞」は if を省略して Had を文頭に出した仮定法過去完了の倒置形です。",
 notes:["arrived は過去分詞で、Had the shipment arrived という倒置の仮定法過去完了として正しい形。","arrive は原形で、Had の直後の倒置構文には合わない。","arrives は三人称単数現在形で、同様に合わない。","been arrived は arrive が自動詞であるため受動態にはならず、この形自体が誤り。"]},

{id:199,category:"仮定法",sentence:"Were the company ___ overseas, it would need to hire local staff familiar with regional regulations.",choices:["to expand","expand","expanding","expanded"],answer:0,
 point:"「Were + 主語 + to + 動詞の原形」は if を省略して Were を文頭に出した仮定法の倒置形で、実現の可能性が低い未来の仮定を表します。",
 notes:["to expand は Were the company to expand で「もし会社が海外進出するとしたら」という倒置の仮定法として正しい形。","expand は原形のみで、to が抜けているためこの倒置構文には合わない。","expanding は動名詞・現在分詞で、同様に合わない。","expanded は過去分詞・過去形で、Were の後のこの倒置構文には合わない。"]},

{id:200,category:"仮定法",sentence:"The manager insisted that all employees ___ the new safety training by the end of the month.",choices:["complete","completes","completed","will complete"],answer:0,
 point:"insist that ～のように要求を表す動詞に続く that節の中では、動詞は主語や時制に関わらず原形（仮定法現在）になります。",
 notes:["complete は原形。insisted that ～ complete … の形で仮定法現在として正しく使われる。","completes は三人称単数現在形。要求を表す that 節では原形が使われるため不適切。","completed は過去形。同様にこの構文には使わない。","will complete は未来形。この構文には使わない。"]},

{id:201,category:"品詞",sentence:"The board's ___ approval is required before the merger can proceed.",choices:["formal","formally","formalize","formality"],answer:0,
 point:"所有格 board's の後、名詞 approval の前に置かれる語は形容詞です。",
 notes:["formal は形容詞「正式な」。approval を正しく修飾する。","formally は副詞「正式に」。名詞を直接修飾できない。","formalize は動詞「正式化する」。ここでは動詞の位置ではない。","formality は名詞「正式さ」。名詞が名詞を直接修飾する形は不自然。"]},

{id:202,category:"品詞",sentence:"The seminar was designed to help managers communicate more ___ with remote teams.",choices:["effective","effectively","effectiveness","effectivity"],answer:1,
 point:"動詞 communicate を修飾するのは副詞です。",
 notes:["effective は形容詞。動詞を修飾できない。","effectively は副詞「効果的に」。communicate を正しく修飾する。","effectiveness は名詞「有効性」。動詞の修飾語にはならない。","effectivity は一般的でない語形で、この文脈では使われない。"]},

{id:203,category:"品詞",sentence:"The ___ of the new database system took nearly six months to complete.",choices:["implement","implementation","implementing","implemented"],answer:1,
 point:"The の直後で of の前に置かれる語は名詞です。",
 notes:["implement は動詞「実行する」で、名詞としては標準的でない。","implementation は名詞「導入・実施」。The implementation of ~ で正しい名詞句になる。","implementing は動名詞にもなり得るが、主語位置としては implementation の方が自然。","implemented は過去分詞・過去形。名詞の位置には入らない。"]},

{id:204,category:"品詞",sentence:"The revised proposal is much more ___ than the original one.",choices:["practical","practically","practicality","practice"],answer:0,
 point:"be動詞 is の後、比較級 more に続く補語の位置には形容詞が入ります。",
 notes:["practical は形容詞「実用的な」。more practical で正しい比較級表現になる。","practically は副詞。比較級の形容詞の位置には入らない。","practicality は名詞「実用性」。more の後には通常使わない。","practice は名詞・動詞「練習（する）」。文脈に合わない。"]},

{id:205,category:"品詞",sentence:"Customers praised the store for its ___ service and friendly staff.",choices:["reliable","reliably","reliability","rely"],answer:0,
 point:"its の後、名詞 service の前に置かれる語は形容詞です。",
 notes:["reliable は形容詞「信頼できる」。service を正しく修飾する。","reliably は副詞。名詞を直接修飾できない。","reliability は名詞「信頼性」。名詞が名詞を修飾する形は不自然。","rely は動詞「頼る」。ここでは動詞の位置ではない。"]},

{id:206,category:"品詞",sentence:"The company issued a public ___ regarding the recent data breach.",choices:["apologize","apology","apologetic","apologetically"],answer:1,
 point:"形容詞 public の後に置かれる語は名詞です。",
 notes:["apologize は動詞「謝罪する」。形容詞の後の名詞の位置には入らない。","apology は名詞「謝罪」。a public apology で正しい名詞句になる。","apologetic は形容詞。public と並んで2つの形容詞が名詞なしで続くのは不自然。","apologetically は副詞。名詞の位置には入らない。"]},

{id:207,category:"品詞",sentence:"The negotiations proceeded ___ despite the tight deadline.",choices:["smooth","smoothly","smoothness","smoothed"],answer:1,
 point:"動詞 proceeded を修飾するのは副詞です。",
 notes:["smooth は形容詞。動詞を修飾できない。","smoothly は副詞「円滑に」。proceeded を正しく修飾する。","smoothness は名詞「円滑さ」。動詞の修飾語にはならない。","smoothed は過去分詞・過去形の動詞。この位置には入らない。"]},

{id:208,category:"品詞",sentence:"Investors were reassured by the firm's ___ growth over the past decade.",choices:["consist","consistent","consistently","consistency"],answer:1,
 point:"所有格 the firm's の後、名詞 growth の前に置かれる語は形容詞です。",
 notes:["consist は動詞「構成される」。この位置には入らない。","consistent は形容詞「一貫した」。growth を正しく修飾する。","consistently は副詞。名詞を直接修飾できない。","consistency は名詞「一貫性」。名詞が名詞を修飾する形は不自然。"]},

{id:209,category:"品詞",sentence:"The ___ between the two departments has improved significantly this year.",choices:["cooperate","cooperation","cooperative","cooperatively"],answer:1,
 point:"The の直後で between の前に置かれる語は名詞です。",
 notes:["cooperate は動詞「協力する」。主語の位置には入らない。","cooperation は名詞「協力」。The cooperation between ~ で正しい主語になる。","cooperative は形容詞（または名詞「協同組合」）。この文脈の主語としては不自然。","cooperatively は副詞。名詞の位置には入らない。"]},

{id:210,category:"品詞",sentence:"The technician inspected the equipment ___ before signing off on the repair.",choices:["thorough","thoroughly","thoroughness","thoroughed"],answer:1,
 point:"動詞 inspected を修飾するのは副詞です。",
 notes:["thorough は形容詞「徹底的な」。動詞を修飾できない。","thoroughly は副詞「徹底的に」。inspected を正しく修飾する。","thoroughness は名詞「徹底性」。動詞の修飾語にはならない。","thoroughed という動詞形は存在しない。"]},

{id:211,category:"品詞",sentence:"The manual includes ___ instructions for assembling the furniture.",choices:["detail","detailed","detailing","details"],answer:1,
 point:"名詞 instructions の前に置かれる語は形容詞（分詞形容詞）です。",
 notes:["detail は名詞または動詞。名詞の前の修飾語としては不適切。","detailed は過去分詞から派生した形容詞「詳細な」。instructions を正しく修飾する。","detailing は動名詞・現在分詞で、ここでは形容詞的に使うには不自然。","details は名詞の複数形。名詞が名詞を修飾する形としては不自然。"]},

{id:212,category:"時制",sentence:"By the time the auditors arrive next month, the accounting team ___ all financial records.",choices:["will have reviewed","reviewed","are reviewing","have reviewed"],answer:0,
 point:"未来のある時点までに完了している動作は未来完了形（will have + 過去分詞）で表します。",
 notes:["will have reviewed は未来完了形で、by the time ~ next month（未来の基準点）までに完了する動作を正しく表す。","reviewed は過去形で、未来の文脈には合わない。","are reviewing は現在進行形で、未来完了の意味を表せない。","have reviewed は現在完了形で、未来の基準点には対応しない。"]},

{id:213,category:"時制",sentence:"The CEO ___ the annual report at the shareholders' meeting last Friday.",choices:["presents","presented","has presented","will present"],answer:1,
 point:"last Friday という明確な過去の時点を表す語句があるため、動詞は過去形になります。",
 notes:["presents は現在形。過去の時点を表す語句とは合わない。","presented は過去形。last Friday という過去の特定の時点と一致する。","has presented は現在完了形。明確な過去の時点を示す語句とは通常併用しない。","will present は未来形。過去の出来事には使えない。"]},

{id:214,category:"時制",sentence:"The company ___ its headquarters to a larger building since it was founded in 1998.",choices:["relocates","relocated","has relocated","was relocating"],answer:2,
 point:"since ～ で始まる語句とともに用いられ、過去のある時点から現在まで継続・完了している内容を表すのは現在完了形です。",
 notes:["relocates は現在形。since と組み合わせて使うのは不適切。","relocated は過去形。since を伴う文では通常使わない。","has relocated は現在完了形。since it was founded と組み合わせて正しく使われる。","was relocating は過去進行形。since との組み合わせとしては不自然。"]},

{id:215,category:"時制",sentence:"The technician ___ the printer when the power suddenly went out.",choices:["repairs","repaired","was repairing","has repaired"],answer:2,
 point:"過去のある動作が進行している最中に別の出来事が起きたことを表すのは過去進行形です。",
 notes:["repairs は現在形。過去の文脈には合わない。","repaired は過去形（単純過去）で、同時進行の状況を表すには不十分。","was repairing は過去進行形。when the power went out という過去の一時点で進行中だった動作を正しく表す。","has repaired は現在完了形。過去の一時点での進行を表せない。"]},

{id:216,category:"時制",sentence:"If the shipment is delayed again, the client ___ the contract.",choices:["cancels","will cancel","canceled","was canceling"],answer:1,
 point:"条件を表すif節（現在形）に対して、主節では未来の結果を表すため will + 動詞の原形が使われます。",
 notes:["cancels は現在形で、未来の結果を表すには不適切。","will cancel は未来形。if節の条件に対する未来の結果を正しく表す。","canceled は過去形で、未来の文脈には合わない。","was canceling は過去進行形で、同様に合わない。"]},

{id:217,category:"時制",sentence:"The new regulations ___ effective before the end of the fiscal year, according to the announcement.",choices:["become","became","will become","becomes"],answer:2,
 point:"according to the announcement（発表によれば）という未来の見通しを示す文脈では、未来形が使われます。",
 notes:["become は現在形（複数主語・原形）で、未来の見通しを表す文脈には合わない。","became は過去形で、未来の出来事には使えない。","will become は未来形。before the end of the fiscal year という未来の期限に合う。","becomes は三人称単数現在形で、主語 regulations（複数）とも一致せず、未来の意味も表せない。"]},

{id:218,category:"時制",sentence:"The research team ___ the same experiment three times before obtaining consistent results.",choices:["conducts","conducted","had conducted","conducting"],answer:2,
 point:"過去のある時点よりもさらに前に完了していた動作は過去完了形（had + 過去分詞）で表します。",
 notes:["conducts は現在形で、過去の文脈には合わない。","conducted は過去形。before obtaining という過去の基準点より前の完了を明確に表すには過去完了の方が適切。","had conducted は過去完了形。obtaining consistent results（過去の基準点）よりも前に3回実施していたことを正しく表す。","conducting は動名詞・現在分詞で、単独では動詞として機能しない。"]},

{id:219,category:"時制",sentence:"The marketing department ___ a new advertising campaign next quarter.",choices:["launches","launched","is going to launch","has launched"],answer:2,
 point:"next quarter という未来の時点を示す語句があるため、未来を表す表現が使われます。",
 notes:["launches は現在形（習慣的な内容）で、未来の特定の予定を表すには不十分。","launched は過去形で、未来の文脈には合わない。","is going to launch は近い未来の予定・計画を表す表現で、next quarter と自然に結びつく。","has launched は現在完了形で、未来の出来事には使えない。"]},

{id:220,category:"時制",sentence:"The employees ___ their workstations by the time the new computers were delivered.",choices:["had already rearranged","already rearranged","have already rearranged","will already rearrange"],answer:0,
 point:"過去のある時点（コンピューターが届いた時点）よりも前に完了していた動作は過去完了形で表します。",
 notes:["had already rearranged は過去完了形。were delivered という過去の基準点より前に完了していたことを正しく表す。","already rearranged は単純過去形で、2つの過去の出来事の前後関係を明確には示せない。","have already rearranged は現在完了形で、過去の基準点との前後関係を表すには不適切。","will already rearrange は未来形で、過去の文脈には合わない。"]},

{id:221,category:"時制",sentence:"The board members ___ the budget proposal for nearly two hours when the fire alarm went off.",choices:["discuss","discussed","had been discussing","will discuss"],answer:2,
 point:"過去のある時点まで一定期間継続していた動作を強調する場合は過去完了進行形（had been + 動詞ing）が使われます。",
 notes:["discuss は現在形で、過去の文脈には合わない。","discussed は単純過去形で、for nearly two hours という継続期間の強調には不十分。","had been discussing は過去完了進行形。went off という過去の一時点まで約2時間継続していた動作を正しく表す。","will discuss は未来形で、過去の出来事には使えない。"]},

{id:222,category:"時制",sentence:"Sales figures ___ steadily over the past six months, according to the latest report.",choices:["rise","rose","have risen","will rise"],answer:2,
 point:"over the past six months のように、過去のある時点から現在まで続く期間を表す語句とともに使われるのは現在完了形です。",
 notes:["rise は現在形で、期間を表す over the past ~ とは通常結びつかない。","rose は過去形で、継続の期間を表す語句とは合わない。","have risen は現在完了形。over the past six months と組み合わさり、過去から現在までの継続的な変化を正しく表す。","will rise は未来形で、過去から現在にかけての内容には使えない。"]},

{id:223,category:"態",sentence:"The annual budget ___ by the finance committee before it is submitted to the board.",choices:["reviews","is reviewed","review","has review"],answer:1,
 point:"主語 the annual budget は「レビューされる」対象であるため、受動態が使われます。",
 notes:["reviews は能動態の現在形で、budget が review する側になってしまい不適切。","is reviewed は受動態。budget が committee によってレビューされるという関係を正しく表す。","review は動詞の原形で、主語との一致もなく不適切。","has review という形は文法的に誤り。"]},

{id:224,category:"態",sentence:"All applications ___ carefully before candidates are invited for an interview.",choices:["examine","are examined","examining","have examine"],answer:1,
 point:"主語 all applications は「審査される」側であるため、受動態が使われます。",
 notes:["examine は能動態で、applications が審査する側になってしまい不適切。","are examined は受動態。applications が審査される対象であることを正しく表す。","examining は現在分詞・動名詞で、単独では述語動詞として機能しない。","have examine という形は文法的に誤り。"]},

{id:225,category:"態",sentence:"The new policy ___ to all departments by the end of this week.",choices:["will announce","will be announced","announces","announced"],answer:1,
 point:"主語 the new policy は「発表される」対象であるため、未来の受動態（will be + 過去分詞）が使われます。",
 notes:["will announce は能動態で、policy が発表する側になってしまい不適切。","will be announced は未来の受動態。policy が発表される対象であることを正しく表す。","announces は現在形の能動態で、主語との関係も未来の時制とも合わない。","announced は過去形で、未来の文脈には合わない。"]},

{id:226,category:"態",sentence:"The conference room ___ for renovations until further notice.",choices:["closes","is being closed","closed","will close"],answer:1,
 point:"現在進行している一時的な状況を受動態で表す場合、is being + 過去分詞（現在進行形の受動態）が使われます。",
 notes:["closes は能動態の現在形で、room が閉める側になってしまい不適切。","is being closed は現在進行形の受動態。現在の一時的な閉鎖状態を正しく表す。","closed は過去形の能動態で、現在の状況を表すには不適切。","will close は未来の能動態で、room が主体的に閉まるという不自然な表現になる。"]},

{id:227,category:"態",sentence:"The proposal ___ thoroughly before it was approved by the executive board.",choices:["discussed","was discussed","discusses","discussing"],answer:1,
 point:"主語 the proposal は「議論される」対象であるため、過去の受動態が使われます。",
 notes:["discussed は能動態の過去形で、proposal が議論する側になってしまい不適切。","was discussed は過去の受動態。proposal が議論される対象であったことを正しく表す。","discusses は現在形で、過去の文脈にも態にも合わない。","discussing は現在分詞・動名詞で、単独では述語動詞として機能しない。"]},

{id:228,category:"態",sentence:"The warehouse ___ by a team of inspectors every quarter.",choices:["inspects","is inspected","inspecting","has inspect"],answer:1,
 point:"主語 the warehouse は「点検される」対象であるため、現在の受動態が使われます。",
 notes:["inspects は能動態で、warehouse が点検する側になってしまい不適切。","is inspected は現在の受動態。warehouse が inspectors によって点検される対象であることを正しく表す。","inspecting は現在分詞・動名詞で、単独では述語動詞として機能しない。","has inspect という形は文法的に誤り。"]},

{id:229,category:"態",sentence:"The defective units ___ free of charge under the terms of the warranty.",choices:["will replace","will be replaced","replace","replaced"],answer:1,
 point:"主語 the defective units は「交換される」対象であるため、未来の受動態が使われます。",
 notes:["will replace は能動態で、units が交換する側になってしまい不適切。","will be replaced は未来の受動態。units が交換される対象であることを正しく表す。","replace は動詞の原形で、時制も態も合わない。","replaced は過去形で、未来の文脈には合わない。"]},

{id:230,category:"態",sentence:"The staff training program ___ next month to include new safety procedures.",choices:["will update","will be updated","updates","has updated"],answer:1,
 point:"主語 the staff training program は「更新される」対象であるため、未来の受動態が使われます。",
 notes:["will update は能動態で、program が更新する側になってしまい不適切。","will be updated は未来の受動態。program が更新される対象であることを正しく表す。","updates は現在形で、未来の時制を表せない。","has updated は現在完了の能動態で、態も時制も合わない。"]},

{id:231,category:"態",sentence:"Visitors ___ to wear identification badges at all times while on the premises.",choices:["require","are required","requiring","has required"],answer:1,
 point:"主語 visitors は「要求される」側であるため、受動態が使われます。",
 notes:["require は能動態で、visitors が要求する側になってしまい不適切。","are required は受動態。visitors が要求される対象であることを正しく表す（be required to do の形）。","requiring は現在分詞・動名詞で、単独では述語動詞として機能しない。","has required という形は主語 visitors（複数）と一致せず不適切。"]},

{id:232,category:"態",sentence:"The company's financial statements ___ by an independent auditor every year.",choices:["review","are reviewed","reviewing","has reviewed"],answer:1,
 point:"主語 the company's financial statements は「レビューされる」対象であるため、現在の受動態が使われます。",
 notes:["review は能動態で、主語との一致（三単現でない）も含めて不適切。","are reviewed は現在の受動態。statements が auditor によってレビューされることを正しく表す。","reviewing は現在分詞・動名詞で、単独では述語動詞として機能しない。","has reviewed は現在完了の能動態で、態も主語との一致も合わない。"]},

{id:233,category:"態",sentence:"The lost packages ___ eventually, but the delay caused significant frustration among customers.",choices:["found","were found","find","have find"],answer:1,
 point:"主語 the lost packages は「発見される」対象であるため、過去の受動態が使われます。",
 notes:["found は能動態の過去形で、packages が発見する側になってしまい不適切。","were found は過去の受動態。packages が発見された対象であることを正しく表す。","find は動詞の原形で、時制も態も合わない。","have find という形は文法的に誤り。"]},

{id:234,category:"前置詞",sentence:"The report must be finalized ___ Friday at the latest.",choices:["by","until","since","during"],answer:0,
 point:"「～までに」という期限を表す前置詞は by です。",
 notes:["by は「～までに」という期限を表し、この文脈に合う。","until は「～まで（ずっと）」という継続を表し、期限には使わない。","since は「～以来」という起点を表し、期限とは異なる。","during は「～の間に」という期間内の出来事を表し、期限には使わない。"]},

{id:235,category:"前置詞",sentence:"The new branch will open ___ the beginning of next month.",choices:["at","on","in","by"],answer:0,
 point:"「the beginning of ~」のような時の一点を表す表現には前置詞 at が使われます。",
 notes:["at は特定の時点を表し、at the beginning of ~ で正しい表現になる。","on は日付や曜日に使われる前置詞で、この表現には合わない。","in は月・年・季節などに使われる前置詞で、この表現には合わない。","by は期限を表す前置詞で、この文脈には合わない。"]},

{id:236,category:"前置詞",sentence:"The company's profits have grown ___ 20 percent since the new CEO took over.",choices:["by","of","for","at"],answer:0,
 point:"数量・程度の変化を表す際、「～の分だけ」という意味で使われる前置詞は by です。",
 notes:["by は変化の度合いを表し、grown by 20 percent で正しい表現になる。","of は所属や部分を表す前置詞で、変化の度合いを表すには不適切。","for は目的や期間を表す前置詞で、この文脈には合わない。","at は特定の地点・価格などを表す前置詞で、変化の度合いには使わない。"]},

{id:237,category:"前置詞",sentence:"The seminar is intended ___ employees who have recently joined the company.",choices:["for","to","with","at"],answer:0,
 point:"「～向けの」という対象を表す前置詞は for です。",
 notes:["for は対象・目的を表し、intended for ~ で正しい表現になる。","to は方向を表す前置詞で、この文脈には合わない。","with は同伴・道具を表す前置詞で、この文脈には合わない。","at は場所や方向を表す前置詞で、この文脈には合わない。"]},

{id:238,category:"前置詞",sentence:"The manager was pleased ___ the team's performance during the last quarter.",choices:["with","for","to","of"],answer:0,
 point:"「～に満足している」という意味では pleased with という組み合わせが使われます。",
 notes:["with は感情の対象を表す前置詞で、be pleased with ~ で正しい表現になる。","for は目的や理由を表す前置詞で、この形容詞とは通常結びつかない。","to は方向を表す前置詞で、この文脈には合わない。","of は所属や部分を表す前置詞で、この文脈には合わない。"]},

{id:239,category:"前置詞",sentence:"The invoice should be sent directly ___ the accounting department.",choices:["to","for","at","with"],answer:0,
 point:"「～へ（送る）」という方向・到達点を表す前置詞は to です。",
 notes:["to は方向・到達点を表し、sent to ~ で正しい表現になる。","for は目的を表す前置詞で、送付先を表すには不適切。","at は場所の一点を表す前置詞で、この文脈には合わない。","with は同伴・道具を表す前置詞で、この文脈には合わない。"]},

{id:240,category:"前置詞",sentence:"The training session will be held ___ the main conference room on the third floor.",choices:["in","at","on","by"],answer:0,
 point:"比較的広い空間の内部を表す場合、前置詞 in が使われます。",
 notes:["in は空間の内部を表し、in the main conference room で正しい表現になる。","at は特定の地点を表す前置詞で、広い空間の内部を強調する場合は in の方が自然。","on は接触面を表す前置詞で、部屋の内部には使わない。","by は「～のそばに」という近接を表す前置詞で、この文脈には合わない。"]},

{id:241,category:"前置詞",sentence:"The company decided to expand its operations ___ the economic downturn.",choices:["despite","although","because","so"],answer:0,
 point:"後ろに名詞句が続く場合、「～にもかかわらず」という譲歩を表す前置詞は despite です。",
 notes:["despite は前置詞で、後ろに名詞句 the economic downturn を伴い正しく使われる。","although は接続詞で、後ろには節（主語＋動詞）が必要なため、名詞句には使えない。","because は接続詞で、通常は節を伴う（名詞句には because of が必要）。","so は接続詞・副詞で、この位置には入らない。"]},

{id:242,category:"前置詞",sentence:"The workshop covers a range of topics, ___ time management and communication skills.",choices:["including","include","included","inclusion"],answer:0,
 point:"「～を含めて」という意味で名詞句を導く前置詞的な語は including です。",
 notes:["including は前置詞的に使われ、後ろに名詞句を伴って「～を含む」という意味を正しく表す。","include は動詞の原形で、この位置では文法的に機能しない。","included は過去分詞で、この文脈では不自然。","inclusion は名詞「包含」で、この位置には合わない。"]},

{id:243,category:"前置詞",sentence:"The document was written ___ a legal expert to ensure full compliance with the regulations.",choices:["by","from","with","of"],answer:0,
 point:"受動態の文で動作主を表す前置詞は by です。",
 notes:["by は受動態における動作主を表し、written by ~ で正しい表現になる。","from は起点を表す前置詞で、動作主を表すには使わない。","with は道具・同伴を表す前置詞で、動作主を表すには使わない。","of は所属・部分を表す前置詞で、動作主を表すには使わない。"]},

{id:244,category:"前置詞",sentence:"The elevator will be out of service ___ 9 a.m. to 11 a.m. tomorrow for maintenance.",choices:["from","since","by","at"],answer:0,
 point:"「～から…まで」という期間の起点を表す際、from … to … の形が使われます。",
 notes:["from は期間の起点を表し、from 9 a.m. to 11 a.m. で正しい表現になる。","since は過去のある時点から現在までの継続を表す前置詞で、未来の時間帯の指定には使わない。","by は期限を表す前置詞で、この文脈には合わない。","at は特定の時点を表す前置詞で、期間の起点と終点を表すこの構文には合わない。"]},

{id:245,category:"接続詞",sentence:"___ the meeting was postponed, several attendees had already arrived at the venue.",choices:["Although","Despite","Because of","So"],answer:0,
 point:"後ろに節（主語＋動詞）が続く場合、「～だけれども」という譲歩を表す接続詞は although です。",
 notes:["although は接続詞で、後ろに節 the meeting was postponed を伴って正しく使われる。","despite は前置詞で、後ろには名詞句が必要なため、節には使えない。","because of は前置詞句で、同様に後ろには名詞句が必要。","so は結果を表す接続詞で、この文脈の意味には合わない。"]},

{id:246,category:"接続詞",sentence:"The event will be held outdoors ___ it does not rain.",choices:["provided that","in spite of","despite","because of"],answer:0,
 point:"「～という条件で」という条件を表す接続詞句は provided that です。",
 notes:["provided that は「～という条件であれば」という意味の接続詞句で、この文脈に合う。","in spite of は前置詞句で「～にもかかわらず」という譲歩を表し、条件を表さない。","despite も同様に前置詞で、条件を表す意味にはならない。","because of は前置詞句で「～のために」という理由を表し、条件とは異なる。"]},

{id:247,category:"接続詞",sentence:"The report was well received; ___, several minor revisions were requested.",choices:["however","although","because","so that"],answer:0,
 point:"2つの文をつなぐ副詞として、セミコロンの後で対比を表すのは however です。",
 notes:["however は接続副詞で、セミコロンの後に置かれ、前後の内容の対比を正しく表す。","although は接続詞で、通常は節の前に置かれ、単独で文をつなぐには使えない。","because は接続詞で、理由を表すためこの対比の文脈には合わない。","so that は目的を表す接続詞句で、この文脈には合わない。"]},

{id:248,category:"接続詞",sentence:"___ the budget is approved, the project cannot move forward.",choices:["Unless","Despite","Because of","Although"],answer:0,
 point:"「～しない限り」という否定的な条件を表す接続詞は unless です。",
 notes:["unless は「もし～しなければ」という否定的条件を表し、この文脈に合う。","despite は前置詞で「～にもかかわらず」という意味になり、条件を表さない。","because of は前置詞句で理由を表し、条件を表さない。","although は譲歩を表す接続詞で、この文脈の否定的条件の意味には合わない。"]},

{id:249,category:"接続詞",sentence:"The manager will approve the request ___ it is submitted before the deadline.",choices:["as long as","even though","in spite of","because of"],answer:0,
 point:"「～である限り」という条件を表す接続詞句は as long as です。",
 notes:["as long as は「～である限り」という条件を表し、この文脈に合う。","even though は「～だけれども」という譲歩を表し、条件の意味にはならない。","in spite of は前置詞句で、条件を表さない。","because of は前置詞句で理由を表し、条件を表さない。"]},

{id:250,category:"接続詞",sentence:"The product launch was delayed ___ several last-minute design changes.",choices:["due to","because","although","unless"],answer:0,
 point:"後ろに名詞句が続く場合、「～のために」という理由を表す前置詞句は due to です。",
 notes:["due to は前置詞句で、後ろに名詞句 several last-minute design changes を伴って正しく使われる。","because は接続詞で、通常は節を伴うため名詞句には使えない（because of なら可）。","although は譲歩を表す接続詞で、理由を表さない。","unless は否定的条件を表す接続詞で、この文脈には合わない。"]},

{id:251,category:"接続詞",sentence:"___ the survey results are still being analyzed, early findings suggest strong customer satisfaction.",choices:["While","Despite","Because of","So"],answer:0,
 point:"「～ではあるが」という対比・譲歩を表す接続詞は while です。",
 notes:["while は「～する一方で」という対比・譲歩を表し、この文脈に合う。","despite は前置詞で、後ろに名詞句が必要なため節には使えない。","because of も前置詞句で、対比の意味にはならない。","so は結果を表す接続詞で、この文脈には合わない。"]},

{id:252,category:"接続詞",sentence:"The company will not renew the contract ___ the vendor improves its delivery times.",choices:["unless","provided that","as long as","given that"],answer:0,
 point:"否定文と組み合わさり「～しない限り」という条件を表す接続詞は unless です。",
 notes:["unless は「もし～しなければ」という条件を表し、not renew ~ unless … で「改善しない限り更新しない」という意味を正しく表す。","provided that は肯定的な条件を表し、この否定文脈にはやや不自然。","as long as も肯定的な条件を表す表現で、この文脈には unless の方が自然。","given that は「～を考慮すると」という意味で、条件というより前提を表すため、この文脈には合わない。"]},

{id:253,category:"接続詞",sentence:"The staff worked overtime ___ they could meet the project deadline.",choices:["so that","in spite of","because of","despite"],answer:0,
 point:"「～するために」という目的を表す接続詞句は so that です。",
 notes:["so that は目的を表し、worked overtime so that they could meet ~ で正しい表現になる。","in spite of は前置詞句で「～にもかかわらず」という意味になり、目的を表さない。","because of は前置詞句で理由を表し、目的を表さない。","despite も前置詞で、同様に目的を表さない。"]},

{id:254,category:"接続詞",sentence:"___ the flight was overbooked, all passengers were eventually accommodated.",choices:["Even though","Because","So that","Provided that"],answer:0,
 point:"「～ではあったが」という予想外の結果を導く譲歩を表す接続詞は even though です。",
 notes:["even though は「～だけれども」という強い譲歩を表し、この文脈に合う。","because は理由を表す接続詞で、この文脈の対比の意味には合わない。","so that は目的を表す接続詞句で、この文脈には合わない。","provided that は条件を表す接続詞句で、この文脈には合わない。"]},

{id:255,category:"接続詞",sentence:"The presentation went smoothly, ___ the presenter had very little time to prepare.",choices:["even though","because","so that","provided that"],answer:0,
 point:"コンマの後で「～だったにもかかわらず」という譲歩を表す接続詞は even though です。",
 notes:["even though は譲歩を表し、準備時間がほとんどなかったにもかかわらず円滑に進んだという対比を正しく表す。","because は理由を表す接続詞で、この文脈には合わない。","so that は目的を表す接続詞句で、この文脈には合わない。","provided that は条件を表す接続詞句で、この文脈には合わない。"]},

{id:256,category:"関係詞",sentence:"The engineer ___ designed the new prototype will present it at the conference.",choices:["who","whom","whose","which"],answer:0,
 point:"先行詞が人（the engineer）で、関係詞節の中で主語の働きをする場合は who を使います。",
 notes:["who は人を先行詞とし、関係詞節内で主語として機能する。designed の主語として正しい。","whom は人を先行詞とするが、目的格として使われるため、ここでは主語の位置に合わない。","whose は所有格の関係代名詞で、この文脈には合わない。","which は物・事を先行詞とする関係代名詞で、人には使わない。"]},

{id:257,category:"関係詞",sentence:"The document, ___ contents remain confidential, was reviewed only by senior executives.",choices:["whose","who","which","whom"],answer:0,
 point:"先行詞（the document）と後ろの名詞（contents）の所有関係を表す場合は所有格の関係代名詞 whose を使います。",
 notes:["whose は所有格の関係代名詞で、the document's contents という関係を正しく表す。","who は人を先行詞とする主格の関係代名詞で、物には使わない。","which は物を先行詞とする関係代名詞だが、所有関係は表せない。","whom は人を先行詞とする目的格の関係代名詞で、この文脈には合わない。"]},

{id:258,category:"関係詞",sentence:"This is the department ___ I worked for three years before transferring to sales.",choices:["which","who","whose","whom"],answer:0,
 point:"先行詞が物（the department）で、前置詞 for の目的語として機能する場合は which を使います。",
 notes:["which は物を先行詞とし、worked for の目的語として正しく機能する。","who は人を先行詞とする関係代名詞で、物には使わない。","whose は所有格の関係代名詞で、この文脈には合わない。","whom は人を先行詞とする目的格の関係代名詞で、物には使わない。"]},

{id:259,category:"関係詞",sentence:"Employees ___ suggestions are adopted will receive public recognition at the annual meeting.",choices:["whose","who","which","whom"],answer:0,
 point:"先行詞（employees）と後ろの名詞（suggestions）の所有関係を表す場合は所有格の関係代名詞 whose を使います。",
 notes:["whose は所有格の関係代名詞で、employees' suggestions という関係を正しく表す。","who は主格の関係代名詞で、この文脈の所有関係は表せない。","which は物を先行詞とする関係代名詞で、人には使わない。","whom は目的格の関係代名詞で、所有関係を表せない。"]},

{id:260,category:"関係詞",sentence:"The client ___ we met last week has decided to sign the contract.",choices:["whom","who","whose","which"],answer:0,
 point:"先行詞が人（the client）で、関係詞節の中で目的語の働きをする場合、目的格の関係代名詞 whom（口語では who も可）を使います。フォーマルな文では whom が好まれます。",
 notes:["whom は人を先行詞とする目的格の関係代名詞で、met の目的語として正しく機能する。","who は主格として使われることが多く、フォーマルな文脈で目的格として使う場合は whom が好まれる。","whose は所有格の関係代名詞で、この文脈には合わない。","which は物を先行詞とする関係代名詞で、人には使わない。"]},

{id:261,category:"関係詞",sentence:"The building, ___ was constructed in the 1920s, has recently been renovated.",choices:["which","who","whose","whom"],answer:0,
 point:"先行詞が物（the building）で、関係詞節の中で主語の働きをする場合は which を使います。",
 notes:["which は物を先行詞とし、was constructed の主語として正しく機能する。","who は人を先行詞とする関係代名詞で、物には使わない。","whose は所有格の関係代名詞で、この文脈には合わない。","whom は人を先行詞とする目的格の関係代名詞で、物には使わない。"]},

{id:262,category:"関係詞",sentence:"The reason ___ the merger failed has not been officially disclosed.",choices:["why","which","who","whose"],answer:0,
 point:"先行詞が the reason のとき、理由を表す関係副詞 why が使われます。",
 notes:["why は理由を表す先行詞（the reason）とともに使われる関係副詞として正しい。","which は関係代名詞で、後ろに完全な文が続く関係副詞の位置には基本的に使わない。","who は人を先行詞とする関係代名詞で、この文脈には合わない。","whose は所有格の関係代名詞で、この文脈には合わない。"]},

{id:263,category:"関係詞",sentence:"The hotel ___ we stayed during the conference offered excellent service.",choices:["where","which","who","whose"],answer:0,
 point:"先行詞が場所を表す語（the hotel）で、後ろに完全な文が続く場合は関係副詞 where が使われます。",
 notes:["where は場所を表す関係副詞で、stayed の後ろに完全な文が続くこの構文に正しく合う。","which は関係代名詞で、この場合は前置詞（at/in）が必要になるため、単独では文法的に不完全になる。","who は人を先行詞とする関係代名詞で、この文脈には合わない。","whose は所有格の関係代名詞で、この文脈には合わない。"]},

{id:264,category:"関係詞",sentence:"The consultant offered several suggestions, ___ we found extremely useful.",choices:["which","who","whose","whom"],answer:0,
 point:"先行詞が物（several suggestions）で、関係詞節の中で目的語の働きをする場合は which を使います。",
 notes:["which は物を先行詞とし、found の目的語として正しく機能する。","who は人を先行詞とする関係代名詞で、物には使わない。","whose は所有格の関係代名詞で、この文脈には合わない。","whom は人を先行詞とする目的格の関係代名詞で、物には使わない。"]},

{id:265,category:"関係詞",sentence:"The year ___ the company was founded is engraved on the entrance plaque.",choices:["when","which","where","who"],answer:0,
 point:"先行詞が時を表す語（the year）で、後ろに完全な文が続く場合は関係副詞 when が使われます。",
 notes:["when は時を表す関係副詞で、the company was founded という完全な文が続くこの構文に正しく合う。","which は関係代名詞で、この場合は前置詞（in）が必要になるため単独では不完全になる。","where は場所を表す関係副詞で、この文脈には合わない。","who は人を先行詞とする関係代名詞で、この文脈には合わない。"]},

{id:266,category:"関係詞",sentence:"Anyone ___ has questions about the new policy should contact the HR department.",choices:["who","whom","whose","which"],answer:0,
 point:"先行詞が人（anyone）で、関係詞節の中で主語の働きをする場合は who を使います。",
 notes:["who は人を先行詞とし、has の主語として正しく機能する。","whom は目的格の関係代名詞で、主語の位置には使わない。","whose は所有格の関係代名詞で、この文脈には合わない。","which は物を先行詞とする関係代名詞で、人には使わない。"]},

{id:267,category:"比較",sentence:"This year's sales figures are ___ than last year's.",choices:["good","better","best","well"],answer:1,
 point:"than を伴って2つのものを比較する場合、形容詞の比較級が使われます。",
 notes:["good は原級で、than と組み合わせて使うことはできない。","better は good の比較級で、than last year's と正しく組み合わさる。","best は最上級で、than を伴う2者比較には使わない。","well は副詞で、名詞 figures の補語としては不適切。"]},

{id:268,category:"比較",sentence:"Of all the candidates interviewed, she had the ___ experience in project management.",choices:["more","most","much","many"],answer:1,
 point:"of all ~（～の中で）という範囲を示す表現とともに使われるのは最上級です。",
 notes:["more は比較級で、3者以上の中での比較を表す最上級の文脈には合わない。","most は much の最上級で、the most experience として of all the candidates の中での最上位を正しく表す。","much は原級で、the の後の最上級表現には使えない。","many は可算名詞に使う語で、不可算名詞 experience には使わない。"]},

{id:269,category:"比較",sentence:"The new model is ___ as efficient as the previous version.",choices:["twice","two times","double","twofold"],answer:0,
 point:"「～の2倍…」という倍数表現は、twice as + 原級 + as の形で表します。",
 notes:["twice は倍数を表す副詞で、twice as efficient as ~ という正しい構文を作る。","two times も倍数を表せるが、as ~ as の構文では twice の方が標準的に使われる。","double は動詞・形容詞として使われ、as ~ as の構文には通常使わない。","twofold は形容詞・副詞で「2倍の」という意味だが、as ~ as の構文には使わない。"]},

{id:270,category:"比較",sentence:"The sooner the proposal is submitted, the ___ it will be reviewed.",choices:["sooner","soon","soonest","more soon"],answer:0,
 point:"「～すればするほど…」という比例表現は the + 比較級 …, the + 比較級 … の形で表します。",
 notes:["sooner は比較級で、the sooner ~, the sooner … という正しい比例表現を作る。","soon は原級で、この構文には比較級が必要。","soonest は最上級で、この構文には合わない。","more soon という形は誤りで、soon の比較級は sooner。"]},

{id:271,category:"比較",sentence:"This year's conference attracted far ___ participants than last year's event.",choices:["more","most","much","many"],answer:0,
 point:"than を伴って可算名詞を比較する場合、many の比較級 more が使われます。",
 notes:["more は many の比較級で、than last year's event と組み合わさり正しく使われる。","most は最上級で、than を伴う2者比較には使わない。","much は不可算名詞に使う語で、可算名詞 participants には使わない。","many は原級で、than を伴う比較には比較級が必要。"]},

{id:272,category:"比較",sentence:"Among the three proposals submitted, the finance team's plan was considered the ___ realistic.",choices:["most","more","much","very"],answer:0,
 point:"3つ以上のものを比較して「最も～」という場合は最上級が使われます。",
 notes:["most は最上級を作る語で、among the three proposals という3者以上の比較に正しく合う。","more は比較級で、3者以上の中での最上位を表すには不適切。","much は程度を強調する語で、最上級の意味を表せない。","very は強調の副詞で、最上級の意味を表せない。"]},

{id:273,category:"比較",sentence:"The revised design is ___ less expensive to manufacture than the original.",choices:["significantly","significant","significance","signify"],answer:0,
 point:"比較級 less expensive を修飾するのは副詞です。",
 notes:["significantly は副詞「著しく」。比較級を正しく修飾する。","significant は形容詞で、比較級の前に置いて修飾することはできない。","significance は名詞で、この位置には入らない。","signify は動詞で、この位置には入らない。"]},

{id:274,category:"比較",sentence:"The customer service team responded ___ faster than expected after the new system was introduced.",choices:["much","many","most","more"],answer:0,
 point:"比較級を強調する際、「はるかに」という意味で much が使われます。",
 notes:["much は比較級を強調する副詞で、much faster という正しい表現を作る。","many は可算名詞を修飾する語で、比較級の強調には使わない。","most は最上級を作る語で、比較級の強調には使わない。","more はそれ自体が比較級を作る語であり、faster という既に比較級化された語をさらに修飾するには不適切。"]},

{id:275,category:"比較",sentence:"This branch office is one of the ___ profitable locations in the entire company.",choices:["most","more","much","very"],answer:0,
 point:"「最も～な…のひとつ」という最上級の表現は one of the + 最上級 + 複数名詞 の形になります。",
 notes:["most は最上級を作る語で、one of the most profitable locations という正しい表現を作る。","more は比較級で、one of the の構文には最上級が必要。","much は程度を表す語で、この構文には合わない。","very は強調の副詞で、最上級の意味を表せない。"]},

{id:276,category:"比較",sentence:"The updated software runs just ___ smoothly as the previous version, despite having more features.",choices:["as","so","more","most"],answer:0,
 point:"「～と同じくらい…」という同等比較は as + 原級 + as の形で表します。",
 notes:["as は as ~ as の構文の最初の as として正しく使われる。","so は否定文で as の代わりに使われることがあるが、この肯定文の構文には as が適切。","more は比較級を作る語で、同等比較の構文には合わない。","most は最上級を作る語で、同等比較の構文には合わない。"]},

{id:277,category:"比較",sentence:"Employee turnover this year was ___ lower than the industry average.",choices:["considerably","considerable","consideration","considering"],answer:0,
 point:"比較級 lower を修飾するのは副詞です。",
 notes:["considerably は副詞「かなり」。比較級を正しく修飾する。","considerable は形容詞で、比較級の前に置いて修飾することはできない。","consideration は名詞で、この位置には入らない。","considering は前置詞・分詞として使われる語で、比較級を修飾する副詞としては不適切。"]},

{id:278,category:"代名詞",sentence:"Each department must submit ___ budget report by the end of the month.",choices:["its","their","it's","them"],answer:0,
 point:"each department は単数扱いのため、対応する所有格代名詞は its になります。",
 notes:["its は単数の所有格代名詞で、each department（単数扱い）に正しく対応する。","their は複数の所有格代名詞で、単数扱いの each department には対応しない。","it's は it is の短縮形で、所有格ではないためこの位置には入らない。","them は目的格の代名詞で、所有格の位置には使えない。"]},

{id:279,category:"代名詞",sentence:"The manager asked the interns to introduce ___ to the rest of the team.",choices:["themselves","them","their","they"],answer:0,
 point:"主語（the interns）と目的語が同一人物を指す場合、再帰代名詞が使われます。",
 notes:["themselves は複数の再帰代名詞で、the interns 自身を紹介するという意味を正しく表す。","them は目的格代名詞で、主語と同一人物を指す場合には再帰代名詞が必要。","their は所有格代名詞で、この位置には合わない。","they は主格代名詞で、動詞の目的語の位置には使えない。"]},

{id:280,category:"代名詞",sentence:"The new employee handbook is different from ___ used at our other branches.",choices:["the one","it","one's","this"],answer:0,
 point:"前に出た名詞（handbook）の代わりに、特定の1つを指す場合は the one が使われます。",
 notes:["the one は前出の名詞 handbook を特定して指す表現として正しい。","it は単に代名詞として使えるが、used at our other branches という修飾語を伴う場合、the one の方が自然。","one's は所有格の不定代名詞で、この文脈には合わない。","this は指示代名詞だが、特定された1つを指す the one の方がこの文脈には適切。"]},

{id:281,category:"代名詞",sentence:"If you have any questions, please feel free to contact ___ directly.",choices:["me","I","my","mine"],answer:0,
 point:"動詞 contact の目的語の位置には目的格の代名詞が使われます。",
 notes:["me は目的格代名詞で、動詞 contact の目的語として正しく機能する。","I は主格代名詞で、目的語の位置には使えない。","my は所有格代名詞で、後ろに名詞が必要なためこの位置には合わない。","mine は所有代名詞で、この文脈には合わない。"]},

{id:282,category:"代名詞",sentence:"Both proposals have merit, but ___ fully addresses the budget constraints.",choices:["neither","none","either","no one"],answer:0,
 point:"2つのものを対象に「どちらも～ない」という否定を表す代名詞は neither です。",
 notes:["neither は2者を対象とした否定の代名詞で、both proposals（2つ）を受けてどちらも条件を満たさないことを正しく表す。","none は3つ以上のものを対象とする否定の代名詞で、2者には通常使わない。","either は肯定文で「どちらか」を表す代名詞で、この否定的な文脈には合わない。","no one は「誰も～ない」という人を対象とする代名詞で、proposals（物）には使わない。"]},

{id:283,category:"代名詞",sentence:"The company values its employees and always listens to ___ feedback.",choices:["their","them","they","theirs"],answer:0,
 point:"後ろに名詞 feedback が続く場合、所有格代名詞が使われます。",
 notes:["their は所有格代名詞で、後ろの名詞 feedback を正しく修飾する。","them は目的格代名詞で、名詞を修飾する位置には使えない。","they は主格代名詞で、名詞の前には使えない。","theirs は所有代名詞で、後ろに名詞を伴わない場合に使われるため、この位置には合わない。"]},

{id:284,category:"代名詞",sentence:"The IT department is upgrading its servers, and ___ expects the migration to be completed by Friday.",choices:["it","they","them","its"],answer:0,
 point:"the IT department のような組織名は文法上単数扱いとなるため、対応する代名詞は it になります。",
 notes:["it は単数の代名詞で、組織を表す the IT department に正しく対応する。","they は複数の代名詞で、単数扱いの組織名には通常対応しない。","them は複数の目的格代名詞で、主語の位置にも使えず、単数扱いの組織にも対応しない。","its は所有格代名詞で、後ろに名詞がないこの位置には合わない。"]},

{id:285,category:"代名詞",sentence:"The two managers disagreed on the strategy, but eventually ___ reached a compromise.",choices:["they","them","their","theirs"],answer:0,
 point:"文の主語の位置には主格の代名詞が使われます。",
 notes:["they は主格代名詞で、reached の主語として正しく機能する。","them は目的格代名詞で、主語の位置には使えない。","their は所有格代名詞で、後ろに名詞が必要なためこの位置には合わない。","theirs は所有代名詞で、この文脈には合わない。"]},

{id:286,category:"代名詞",sentence:"The company gave the award to Sarah and ___ for their outstanding contributions.",choices:["me","I","my","myself"],answer:0,
 point:"前置詞 to の目的語の位置には目的格の代名詞が使われます。",
 notes:["me は目的格代名詞で、前置詞 to の目的語（Sarah and me）として正しく機能する。","I は主格代名詞で、前置詞の目的語の位置には使えない。","my は所有格代名詞で、この位置には合わない。","myself は再帰代名詞で、主語と同一人物を指す場合に使われるが、この文の主語は the company であり一致しないため不適切。"]},

{id:287,category:"代名詞",sentence:"The consultant reviewed the data ___ before presenting the findings to the board.",choices:["himself","him","his","he"],answer:0,
 point:"主語を強調する場合、再帰代名詞が同格的に使われます。",
 notes:["himself は強調用法の再帰代名詞で、the consultant 自身がデータを確認したことを強調する。","him は目的格代名詞で、この強調の位置には使えない。","his は所有格代名詞で、この位置には合わない。","he は主格代名詞で、既に主語 the consultant があるためこの位置には重複してしまい不適切。"]},

{id:288,category:"代名詞",sentence:"Some employees prefer working remotely, while ___ favor the traditional office setting.",choices:["others","other","the other","another"],answer:0,
 point:"「一部は～、他の一部は…」という対比を表す場合、不特定の複数を指す others が使われます。",
 notes:["others は「他の人々（不特定多数）」を表す代名詞で、some ~, while others … という対比の構文に正しく合う。","other は形容詞的に使われ、単独で代名詞として使うには the や複数形が必要。","the other は「（2つのうち）もう一方」を表し、特定された1つを指すためこの不特定多数の文脈には合わない。","another は「別の1つ」を表す単数の代名詞で、複数を表すこの文脈には合わない。"]},

{id:289,category:"仮定法",sentence:"If the company ___ more resources to research, it could develop more innovative products.",choices:["allocated","allocates","had allocated","allocate"],answer:0,
 point:"現在の事実に反する仮定を表す仮定法過去では、if節に過去形（allocated）、主節に助動詞の過去形＋原形（could develop）が使われます。",
 notes:["allocated は過去形で、仮定法過去の if節に正しく使われる。","allocates は現在形で、仮定法過去の if節には使わない。","had allocated は過去完了形で、仮定法過去完了に使われるが、主節が could develop（現在の帰結）であるため時制が一致しない。","allocate は原形で、if節の動詞としては不適切。"]},

{id:290,category:"仮定法",sentence:"If the merger ___ approved last year, the two companies would now be operating as one entity.",choices:["had been","were","was","is"],answer:0,
 point:"過去の事実に反する仮定を表す仮定法過去完了では、if節に had + 過去分詞が使われます。",
 notes:["had been は過去完了形で、last year という過去の事実に反する仮定を表す仮定法過去完了の if節に正しく使われる。","were は仮定法過去の be動詞の形で、過去の事実に反する仮定には使わない。","was は単純過去形で、仮定法の構文には使わない。","is は現在形で、過去の事実に反する仮定には使わない。"]},

{id:291,category:"仮定法",sentence:"I wish the shipment ___ on time; the delay has caused serious problems for our customers.",choices:["had arrived","arrived","arrives","has arrived"],answer:0,
 point:"wish の後で過去の事実に反する願望を表す場合、過去完了形が使われます。",
 notes:["had arrived は過去完了形で、wish の後で過去の事実に反する願望を正しく表す。","arrived は過去形で、現在の事実に反する願望を表す際に使われるが、ここでは過去の出来事について述べているため過去完了が適切。","arrives は現在形で、wish の後の仮定法には使わない。","has arrived は現在完了形で、wish の後の仮定法には使わない。"]},

{id:292,category:"仮定法",sentence:"It is essential that every employee ___ the updated security protocol immediately.",choices:["follow","follows","followed","will follow"],answer:0,
 point:"it is essential that ～ のように必要性を表す表現に続くthat節では、動詞は原形（仮定法現在）になります。",
 notes:["follow は原形で、essential that ～ follow … の形で仮定法現在として正しく使われる。","follows は三人称単数現在形で、この構文には原形が使われるため不適切。","followed は過去形で、同様に不適切。","will follow は未来形で、この構文には使わない。"]},

{id:293,category:"仮定法",sentence:"If I ___ in your position, I would negotiate for a higher salary.",choices:["were","was","am","had been"],answer:0,
 point:"仮定法過去では、be動詞は主語の人称に関わらず were が使われるのが標準的な形です。",
 notes:["were は仮定法過去における be動詞の標準形で、主語が I であっても were が使われる。","was も口語では使われることがあるが、フォーマルな文法では仮定法の were が正式とされる。","am は直説法の現在形で、仮定法には使わない。","had been は仮定法過去完了の形で、過去の事実に反する仮定に使われるため、現在の文脈には合わない。"]},

{id:294,category:"仮定法",sentence:"The safety committee recommended that the machinery ___ inspected before it is used again.",choices:["be","is","was","will be"],answer:0,
 point:"recommend that ～ のように提案を表す動詞に続くthat節では、動詞は原形（仮定法現在）になります。受動態の場合は be + 過去分詞の形になります。",
 notes:["be は原形で、recommended that ～ be inspected という仮定法現在の受動態として正しく使われる。","is は三人称単数現在形で、この構文には原形が使われるため不適切。","was は過去形で、同様に不適切。","will be は未来形で、この構文には使わない。"]},

{id:295,category:"仮定法",sentence:"Had the company invested in digital marketing earlier, it ___ a larger online presence today.",choices:["would have","would have had","will have","has"],answer:0,
 point:"Had the company invested ...（過去の事実に反する仮定）に対して、today という現在の結果を表す場合、主節には would + 動詞の原形（ここでは have）を使う、時制がずれた「混合仮定法」の形になります。",
 notes:["would have は would + 原形 have で、過去の条件に基づく現在の結果（今日、より大きなオンラインでの存在感を持っているだろう）を正しく表す混合仮定法の形。","would have had は would have + 過去分詞で、過去の結果を表す通常の仮定法過去完了の主節の形であり、today という現在を表す語句とは一致しない。","will have は直説法の未来完了的な表現で、仮定法の帰結節には使わない。","has は直説法の現在形で、仮定法の帰結節には使わない。"]},

{id:296,category:"仮定法",sentence:"If the negotiations had gone more smoothly, the deal would ___ closed within a week.",choices:["have been","be","have","being"],answer:0,
 point:"if節が had + 過去分詞（仮定法過去完了）のとき、主節は would have + 過去分詞（受動態の場合は would have been + 過去分詞）が使われます。",
 notes:["have been は would の後に続き、would have been closed という仮定法過去完了の受動態の帰結節を正しく作る。","be は原形単独で、would be closed は仮定法過去（現在の事実に反する仮定）の帰結節の形であり、if節の had gone（仮定法過去完了）とは時制が一致しない。","have は would have closed で能動態になってしまい、the deal（契約）が「閉じる」動作主になってしまうため不適切。","being は動名詞・現在分詞で、would の後には使わない。"]},

{id:297,category:"仮定法",sentence:"If it ___ not for the last-minute funding, the entire project would have been canceled.",choices:["were","was","is","had been"],answer:0,
 point:"「もし～がなければ」という仮定法の慣用表現 If it were not for ~ では、be動詞は were が使われます。",
 notes:["were は if it were not for ~ という仮定法の定型表現に正しく使われる。","was は口語で使われることもあるが、フォーマルな仮定法表現では were が標準とされる。","is は直説法の現在形で、仮定法の慣用表現には使わない。","had been は if it had not been for ~（過去の事実に反する仮定）の形になるが、ここでは were の後の not for という決まった形と合わない。"]},

{id:298,category:"仮定法",sentence:"Suppose the client ___ to cancel the order at the last minute, how would the company handle the loss?",choices:["were","was","is","had"],answer:0,
 point:"suppose（もし～だとしたら）に続く仮定法では、be動詞は were が使われます。",
 notes:["were は suppose の後の仮定法で使われる be動詞の形として正しい。","was も口語では使われるが、フォーマルな仮定法表現では were が好まれる。","is は直説法の現在形で、仮定法の文脈には使わない。","had は文法的にこの位置には合わない。"]},

{id:299,category:"仮定法",sentence:"The consultant suggested that the company ___ its marketing budget before the next fiscal year.",choices:["reconsider","reconsiders","reconsidered","will reconsider"],answer:0,
 point:"suggest that ～ のように提案を表す動詞に続くthat節では、動詞は原形（仮定法現在）になります。",
 notes:["reconsider は原形で、suggested that ～ reconsider … という仮定法現在として正しく使われる。","reconsiders は三人称単数現在形で、この構文には原形が使われるため不適切。","reconsidered は過去形で、同様に不適切。","will reconsider は未来形で、この構文には使わない。"]},

{id:300,category:"仮定法",sentence:"Were it not for the support of our loyal customers, the small business ___ have survived the economic downturn.",choices:["would not","will not","does not","had not"],answer:0,
 point:"Were it not for ~（if it were not for ~ の倒置形）に対応する主節では、would + 動詞の原形が使われます。",
 notes:["would not は Were it not for ~ の帰結節として正しく使われ、would not have survived で「生き残れなかっただろう」という意味を表す。","will not は直説法の未来形で、仮定法の帰結節には使わない。","does not は直説法の現在形で、仮定法の帰結節には使わない。","had not は仮定法過去完了のif節に使われる形で、帰結節には使わない。"]},

{id:301,category:"品詞",sentence:"The new policy will have a significant ___ on employee productivity.",choices:["affect","affecting","affects","effect"],answer:3,
 point:"a significant の後には名詞が入ります。名詞「影響、効果」を表す effect が正しく使われます。動詞の affect と混同しないよう注意が必要です。",
 notes:["affect は動詞「影響を与える」。ここは冠詞と形容詞の後の名詞の位置なので動詞は使えない。","affecting は現在分詞・動名詞の形で、名詞の位置には合わない。","affects は動詞の三人称単数現在形で、同様に名詞の位置には使えない。","effect は名詞「影響、効果」で、a significant effect on ~ という形で正しく使われる。"]},

{id:302,category:"品詞",sentence:"Employees are required to submit their expense reports in a ___ manner.",choices:["time","timing","timeliness","timely"],answer:3,
 point:"名詞 manner を修飾するのは形容詞です。timely は -ly で終わりますが例外的に形容詞として使われます。",
 notes:["time は名詞「時間」で、名詞が名詞を直接修飾する形は不自然であり不適切。","timing は名詞「タイミング」で、同様に manner を修飾できない。","timeliness は名詞「適時性」で、名詞のため manner の前には置けない。","timely は形容詞「時宜を得た」で、-ly で終わるが形容詞であり manner を正しく修飾する。"]},

{id:303,category:"品詞",sentence:"The manager praised the team for their ___ approach to solving the problem.",choices:["innovate","innovation","innovatively","innovative"],answer:3,
 point:"名詞 approach を修飾するのは形容詞です。innovative が正しく approach を修飾します。",
 notes:["innovate は動詞「革新する」で、名詞の前の修飾語としては使えない。","innovation は名詞「革新」で、名詞が名詞を直接修飾する形はここでは不自然。","innovatively は副詞「革新的に」で、動詞を修飾するため名詞 approach の前には置けない。","innovative は形容詞「革新的な」で、approach を正しく修飾する。"]},

{id:304,category:"品詞",sentence:"The board members discussed the proposal with great ___.",choices:["careful","carefully","cared","care"],answer:3,
 point:"前置詞 with と形容詞 great の後には名詞が入ります。care は「注意」を意味する名詞です。",
 notes:["careful は形容詞で、with great の後の名詞の位置には使えない。","carefully は副詞で、同様に名詞の位置には合わない。","cared は動詞の過去形で、名詞の位置には使えない。","care は名詞「注意」で、with great care という形で正しく使われる。"]},

{id:305,category:"品詞",sentence:"The company's ___ growth over the past decade has impressed investors.",choices:["steadily","steadiness","steadied","steady"],answer:3,
 point:"名詞 growth を修飾するのは形容詞です。steady が正しく growth を修飾します。",
 notes:["steadily は副詞「着実に」で、名詞を直接修飾できない。","steadiness は名詞「安定性」で、名詞が名詞を直接修飾する形はここでは不自然。","steadied は動詞の過去形・過去分詞で、この位置には合わない。","steady は形容詞「着実な、安定した」で、growth を正しく修飾する。"]},

{id:306,category:"品詞",sentence:"It is highly ___ that the merger will be finalized by the end of this quarter.",choices:["probability","probably","probabilities","probable"],answer:3,
 point:"It is highly ___ that ~ の構文では、be動詞の補語として形容詞が入ります。probable が正しく使われます。",
 notes:["probability は名詞「可能性」で、be動詞の後に来る場合は冠詞が必要になり、この形では不適切。","probably は副詞「おそらく」で、be動詞の補語にはならない。","probabilities は名詞の複数形で、同様に補語としては不適切。","probable は形容詞「ありそうな」で、It is highly probable that ~ という形で正しく使われる。"]},

{id:307,category:"品詞",sentence:"___ regularly with clients is essential for maintaining strong business relationships.",choices:["Communicate","Communication","Communicative","Communicating"],answer:3,
 point:"文の主語になり、かつ副詞 regularly を伴って動作を表すには動名詞が適切です。",
 notes:["Communicate は動詞の原形で、そのままでは文の主語になれない。","Communication は名詞だが、副詞 regularly で直接修飾するのは不自然で、動作性を表す動名詞の方が適切。","Communicative は形容詞で、文の主語にはなれない。","Communicating は動名詞で、副詞 regularly を伴いながら文の主語として正しく機能する。"]},

{id:308,category:"品詞",sentence:"The consultant ___ reviewed the financial statements before submitting her report.",choices:["through","thoroughness","thorough","thoroughly"],answer:3,
 point:"動詞 reviewed を修飾するのは副詞です。thoroughly が正しく使われます。",
 notes:["through は前置詞・副詞だが「〜を通して」という意味で、動詞を修飾する副詞としては文意に合わない。","thoroughness は名詞「徹底」で、動詞を修飾できない。","thorough は形容詞「徹底的な」で、動詞を直接修飾できない。","thoroughly は副詞「徹底的に」で、動詞 reviewed を正しく修飾する。"]},

{id:309,category:"品詞",sentence:"The ___ of the new software system took several months to complete.",choices:["implement","implemented","implementing","implementation"],answer:3,
 point:"冠詞 The の後、かつ of に続く文の主語になるのは名詞です。implementation が正しく使われます。",
 notes:["implement は動詞の原形（または「道具」の意味の名詞）で、ここでは「導入」という意味の名詞が必要なため不適切。","implemented は動詞の過去形・過去分詞で、冠詞の後の名詞の位置には使えない。","implementing は動名詞にもなり得るが、the の直後で of を伴う名詞としては implementation の方が標準的で自然。","implementation は名詞「実施、導入」で、The implementation of ~ という形で正しく使われる。"]},

{id:310,category:"品詞",sentence:"The results of the survey were quite ___, prompting the team to revise their strategy.",choices:["surprise","surprisingly","surprised","surprising"],answer:3,
 point:"be動詞 were の補語となる形容詞が必要です。results（結果）が「驚かせる」側なので、能動的な意味を持つ現在分詞形の形容詞 surprising が正しく使われます。",
 notes:["surprise は名詞・動詞で、be動詞の補語としては不自然。","surprisingly は副詞で、be動詞の補語にはならない。","surprised は過去分詞形の形容詞で「（人が）驚かされた」という受動的な意味になるが、主語は results（結果）なので意味が合わない。","surprising は現在分詞形の形容詞で「驚くべき、人を驚かせるような」という能動的な意味を表し、results を正しく説明する。"]},

{id:311,category:"品詞",sentence:"The firm's annual report highlights several key ___ in revenue growth.",choices:["increase","increasing","increasingly","increases"],answer:3,
 point:"several key の後には複数形の可算名詞が入ります。increases が正しく使われます。",
 notes:["increase は単数形の名詞で、several（いくつかの）という複数を示す語と一致しない。","increasing は現在分詞・動名詞で、several key の後の名詞の位置には合わない。","increasingly は副詞「ますます」で、名詞の位置には使えない。","increases は名詞の複数形で、several key increases という形で正しく使われる。"]},

{id:312,category:"品詞",sentence:"The new online platform makes it more ___ for customers to track their orders.",choices:["convenience","conveniently","convened","convenient"],answer:3,
 point:"make it + 形容詞 + for A to do 「Aが〜するのを…にする」の構文では、形容詞が使われます。convenient が正しく使われます。",
 notes:["convenience は名詞「便利さ」で、この構文の補語の位置には形容詞が必要なため不適切。","conveniently は副詞で、it の補語にはならない。","convened は動詞 convene（招集する）の過去形・過去分詞で、意味・品詞ともに文脈に合わない。","convenient は形容詞「便利な」で、make it convenient for ~ to do という形で正しく使われる。"]},

{id:313,category:"時制",sentence:"The company ___ its headquarters to a larger building last month.",choices:["has moved","moves","is moving","moved"],answer:3,
 point:"last month という明確な過去の時点を表す語句があるため、過去形が使われます。",
 notes:["has moved は現在完了形で、last month のような特定の過去の時点を示す語句とは一緒に使えない。","moves は現在形で、過去の出来事を表すここでは不適切。","is moving は現在進行形で、過去の完了した出来事には使わない。","moved は過去形で、last month という特定の過去の時点と一致し正しく使われる。"]},

{id:314,category:"時制",sentence:"By the time the CEO arrives tomorrow, the preparations ___.",choices:["complete","are completed","have completed","will have been completed"],answer:3,
 point:"By the time ~（未来の一時点までに）を伴う文では、その時点までに完了している動作は未来完了形で表されます。ここでは受動態の未来完了形が使われます。",
 notes:["complete は現在形で、未来の特定時点までの完了を表せない。","are completed は現在形の受動態で、未来の完了を表せない。","have completed は現在完了形の能動態で、時制・態ともに文脈に合わない。","will have been completed は未来完了形の受動態で、By the time ~ tomorrow までに完了しているという意味を正しく表す。"]},

{id:315,category:"時制",sentence:"The technicians ___ the new equipment when the power suddenly went out.",choices:["install","installed","have installed","were installing"],answer:3,
 point:"過去のある一時点で進行中だった動作は過去進行形で表されます。when 節の過去形の動作（went out）が、進行中の動作に割り込んだことを示します。",
 notes:["install は現在形で、過去の出来事を表すここでは不適切。","installed は単純過去形で、動作が完了したことを表すため、割り込みを受けた進行中の動作を表すには不十分。","have installed は現在完了形で、過去の一時点の話には使わない。","were installing は過去進行形で、電源が落ちた時点で作業が進行中だったことを正しく表す。"]},

{id:316,category:"時制",sentence:"She ___ for the company for over fifteen years before she was promoted to director.",choices:["works","worked","will work","had worked"],answer:3,
 point:"before に続く過去の出来事（was promoted）よりもさらに前から続いていた動作は過去完了形で表されます。",
 notes:["works は現在形で、過去の出来事を表すここでは不適切。","worked は単純過去形で、before 以下の過去の出来事との前後関係が明確にならない。","will work は未来形で、文脈と一致しない。","had worked は過去完了形で、昇進する（過去の出来事）以前から15年間勤めていたという時間の前後関係を正しく表す。"]},

{id:317,category:"時制",sentence:"The board members ___ the budget proposal by the time the meeting ends this afternoon.",choices:["review","reviewed","are reviewing","will have reviewed"],answer:3,
 point:"by the time ~（未来の一時点までに）を伴う文では、その時点までに完了する動作は未来完了形で表されます。",
 notes:["review は現在形で、未来の特定時点までの完了を表せない。","reviewed は過去形で、未来の出来事には使えない。","are reviewing は現在進行形で、未来完了の意味を表せない。","will have reviewed は未来完了形で、this afternoon の会議が終わるまでに検討を終えているという意味を正しく表す。"]},

{id:318,category:"時制",sentence:"Ever since the merger was announced, the stock price ___ steadily.",choices:["rises","rose","will rise","has been rising"],answer:3,
 point:"ever since ~（〜以来ずっと）は、過去のある時点から現在まで継続している動作を表すため、現在完了進行形が使われます。",
 notes:["rises は現在形で、継続を表す ever since とは一緒に使えない。","rose は過去形で、単発の過去の出来事を表すため継続の意味を表せない。","will rise は未来形で、文脈と一致しない。","has been rising は現在完了進行形で、合併発表以来ずっと株価が上昇し続けているという継続を正しく表す。"]},

{id:319,category:"時制",sentence:"At this time next week, the sales team ___ the new product line at the trade show.",choices:["presents","presented","has presented","will be presenting"],answer:3,
 point:"At this time next week のような未来の特定の時点で進行中の動作を表すには未来進行形が使われます。",
 notes:["presents は現在形で、未来の特定時点の動作を表せない。","presented は過去形で、未来の出来事には使えない。","has presented は現在完了形で、未来の一時点における進行中の動作を表せない。","will be presenting は未来進行形で、来週の同じ時刻に発表が進行中であることを正しく表す。"]},

{id:320,category:"時制",sentence:"The factory ___ its production process significantly since the new manager took over.",choices:["changes","changed","will change","has changed"],answer:3,
 point:"since ~（〜以来）を伴う文では、過去のある時点から現在までの変化・継続を表す現在完了形が使われます。",
 notes:["changes は現在形で、since を伴う継続的な変化を表せない。","changed は過去形で、現在までの継続的な結果を表すには不十分。","will change は未来形で、文脈と一致しない。","has changed は現在完了形で、新しいマネージャーが着任して以来、生産工程が変化し続けているという継続的な結果を正しく表す。"]},

{id:321,category:"時制",sentence:"While the auditors ___ the accounts, the accountant answered their questions.",choices:["examine","examined","will examine","were examining"],answer:3,
 point:"while 節で過去のある期間にわたって進行していた動作を表す場合、過去進行形が使われます。",
 notes:["examine は現在形で、過去の出来事を表すここでは不適切。","examined は単純過去形で、同時進行の背景となる動作を表すには不十分。","will examine は未来形で、文脈と一致しない。","were examining は過去進行形で、監査人が帳簿を確認している間、会計士が質問に答えていたという同時進行の状況を正しく表す。"]},

{id:322,category:"時制",sentence:"The new regulations ___ into effect before most companies had time to prepare.",choices:["come","came","will come","had come"],answer:3,
 point:"before に続く過去完了の出来事（had time to prepare）よりもさらに前に起きた出来事は過去完了形で表されます。",
 notes:["come は現在形で、過去の出来事を表すここでは不適切。","came は単純過去形で、前後関係を明確に示すにはやや不十分。","will come は未来形で、文脈と一致しない。","had come は過去完了形で、多くの企業が準備する時間を持つよりも前に規則が発効していたという時間の前後関係を正しく表す。"]},

{id:323,category:"時制",sentence:"The negotiations ___ for nearly six hours when both parties finally reached an agreement.",choices:["continue","continued","have continued","had been continuing"],answer:3,
 point:"過去のある時点（reached an agreement）までに、それ以前から継続していた動作は過去完了進行形で表されます。",
 notes:["continue は現在形で、過去の出来事を表すここでは不適切。","continued は単純過去形で、それまでの継続時間を強調する意味合いが弱い。","have continued は現在完了形で、過去の一時点までの継続を表せない。","had been continuing は過去完了進行形で、合意に達した時点まで6時間近く交渉が続いていたという継続を正しく表す。"]},

{id:324,category:"前置詞",sentence:"The invoice must be paid ___ 30 days of receipt.",choices:["at","on","in","within"],answer:3,
 point:"「〜以内に」という期間の範囲を表すには前置詞 within を使います。",
 notes:["at は時刻を表す前置詞で、期間の範囲を表す文脈には合わない。","on は特定の日にちを表す前置詞で、期間には使わない。","in は「30日後に」という意味になり、期限内という意味を表せない。","within は「〜以内に」という範囲を正しく表す。"]},

{id:325,category:"前置詞",sentence:"The new branch office is located ___ the corner of Main Street and Fifth Avenue.",choices:["in","on","of","at"],answer:3,
 point:"「〜の角に」という場所を表す慣用表現では at the corner of ~ が使われます。",
 notes:["in は内部にあることを表す前置詞で、角という地点を示す表現には合わない。","on は面や通り上を表すことが多く、この慣用表現には使わない。","of はこの位置には文法的に合わない。","at は地点を表す前置詞で、at the corner of ~ という慣用表現として正しく使われる。"]},

{id:326,category:"前置詞",sentence:"Please submit your application ___ the end of business on Friday.",choices:["until","in","on","by"],answer:3,
 point:"「〜までに」という期限を表すには前置詞 by を使います。",
 notes:["until は「〜まで（ずっと）」という継続を表し、期限を表す by とは意味が異なる。","in は経過時間を表す際に使われ、期限を表す文脈には合わない。","on は特定の日にちを表す前置詞で、この位置には合わない。","by は「〜までに」という期限を正しく表す。"]},

{id:327,category:"前置詞",sentence:"The revised contract differs significantly ___ the original agreement.",choices:["to","with","for","from"],answer:3,
 point:"「〜と異なる」は differ from ~ という形で使われます。",
 notes:["to は differ の後には使わない前置詞。","with も differ とは結び付かない。","for も同様に differ とは結び付かない。","from は differ from ~ という慣用表現として正しく使われる。"]},

{id:328,category:"前置詞",sentence:"The manager is responsible ___ overseeing the entire production process.",choices:["of","to","with","for"],answer:3,
 point:"「〜に責任がある」は be responsible for ~ という形で使われます。",
 notes:["of は responsible とは結び付かない。","to も responsible とは異なる意味になり不適切。","with も responsible とは結び付かない。","for は be responsible for ~ という慣用表現として正しく使われる。"]},

{id:329,category:"前置詞",sentence:"The workshop has been postponed ___ further notice.",choices:["with","in","at","until"],answer:3,
 point:"「追って通知があるまで」は until further notice という慣用表現で表されます。",
 notes:["with はこの慣用表現には使わない。","in も同様に使わない。","at も同様に使わない。","until は until further notice という慣用表現として正しく使われる。"]},

{id:330,category:"前置詞",sentence:"___ numerous obstacles, the project was completed ahead of schedule.",choices:["Although","Because","Unless","Despite"],answer:3,
 point:"後ろに名詞句（numerous obstacles）が続く場合は前置詞を使います。Despite は「〜にもかかわらず」を表す前置詞です。",
 notes:["Although は接続詞で、後ろに主語＋動詞を伴う節が必要なため、名詞句だけのここでは使えない。","Because も接続詞で、後ろに節が必要な上、理由を表すため文意にも合わない。","Unless も接続詞で、条件「〜しない限り」を表すため文意に合わない。","Despite は前置詞で、後ろに名詞句を伴い「〜にもかかわらず」を正しく表す。"]},

{id:331,category:"前置詞",sentence:"The annual conference will be held ___ the Grand Hotel this year.",choices:["in","on","by","at"],answer:3,
 point:"イベントが行われる会場・地点を表す場合には前置詞 at がよく使われます。",
 notes:["in は建物の内部であることを強調する場合に使うが、会場を表す一般的な表現としては at が標準的。","on は面の上を表す前置詞で、会場を表す文脈には合わない。","by は「〜のそばに」という意味になり、開催場所を表す表現としては不適切。","at は特定の地点・施設を表す前置詞で、held at the Grand Hotel という形で正しく使われる。"]},

{id:332,category:"前置詞",sentence:"Sales figures have improved ___ 15 percent compared to last quarter.",choices:["with","at","in","by"],answer:3,
 point:"数量的な変化の度合いを表す場合には前置詞 by が使われます。",
 notes:["with はこの文脈での変化の度合いを表す前置詞としては使わない。","at は特定の割合・数値の一致点を表す際に使うこともあるが、変化の度合いには合わない。","in もこの文脈には合わない。","by は improved by 15 percent という形で、変化の度合いを正しく表す。"]},

{id:333,category:"前置詞",sentence:"The training program is designed specifically ___ new employees who lack technical experience.",choices:["with","to","in","for"],answer:3,
 point:"「〜のために設計されている」は be designed for ~ という形で使われます。",
 notes:["with は designed とは結び付かない。","to も designed の対象を表す前置詞としては使わない。","in も同様に使わない。","for は be designed for ~ という慣用表現として正しく使われる。"]},

{id:334,category:"前置詞",sentence:"The committee reached a decision ___ much debate among its members.",choices:["with","in","on","after"],answer:3,
 point:"「〜の後に」という時間的な前後関係を表すには前置詞 after が使われます。",
 notes:["with はこの文脈での時間的な前後関係を表せない。","in も同様に使わない。","on も同様にこの文脈には合わない。","after は「多くの議論の後に」という時間的な前後関係を正しく表す。"]},

{id:335,category:"接続詞",sentence:"___ the flight was delayed by three hours, the sales team still managed to arrive in time for the meeting.",choices:["Because","If","Unless","Although"],answer:3,
 point:"前半と後半の内容が対照的（遅延したが、間に合った）であるため、譲歩を表す接続詞 Although が使われます。",
 notes:["Because は理由を表す接続詞で、対照的な内容をつなぐ文脈には合わない。","If は条件を表す接続詞で、事実を述べるこの文脈には合わない。","Unless は「〜しない限り」という条件を表し、文意に合わない。","Although は「〜だけれども」という譲歩を表し、遅延したにもかかわらず間に合ったという対照的な内容を正しくつなぐ。"]},

{id:336,category:"接続詞",sentence:"The presentation will proceed as scheduled ___ there is a technical failure.",choices:["although","because","so that","unless"],answer:3,
 point:"「〜しない限り」という条件を表すには接続詞 unless が使われます。",
 notes:["although は譲歩を表す接続詞で、条件を表すこの文脈には合わない。","because は理由を表す接続詞で、文意に合わない。","so that は目的を表す接続詞で、文意に合わない。","unless は「〜しない限り」という条件を正しく表す。"]},

{id:337,category:"接続詞",sentence:"The manager stayed late at the office ___ she could finish the quarterly report.",choices:["although","unless","because of","so that"],answer:3,
 point:"「〜するために」という目的を表すには接続詞 so that が使われます。",
 notes:["although は譲歩を表す接続詞で、目的を表す文脈には合わない。","unless は条件を表す接続詞で、文意に合わない。","because of は前置詞句で、後ろに節（S+V）を続けることができない。","so that は「〜するために」という目的を正しく表す。"]},

{id:338,category:"接続詞",sentence:"___ the marketing team nor the sales department was informed of the policy change in advance.",choices:["Both","Either","Not only","Neither"],answer:3,
 point:"「AもBも〜ない」という意味を表す相関接続詞 neither A nor B の形が使われます。",
 notes:["Both は both A and B の形で使われ、nor とは組み合わせない。","Either は either A or B の形で使われ、nor とは組み合わせない。","Not only は not only A but also B の形で使われ、nor とは組み合わせない。","Neither は neither A nor B という形で正しく使われる。"]},

{id:339,category:"接続詞",sentence:"The new intern is ___ hardworking and reliable, which impressed the entire department.",choices:["either","neither","not only","both"],answer:3,
 point:"「AもBも」という意味を表す相関接続詞 both A and B の形が使われます。",
 notes:["either は either A or B の形で使われ、and とは組み合わせない。","neither は neither A nor B の形で使われ、and とは組み合わせない。","not only は not only A but also B の形で使われ、単純な and とは組み合わせない。","both は both A and B という形で正しく使われる。"]},

{id:340,category:"接続詞",sentence:"You must submit the form in person, ___ you may mail it to our office directly.",choices:["so","but","and","or"],answer:3,
 point:"2つの選択肢を並べて示す場合には等位接続詞 or が使われます。",
 notes:["so は結果を表す接続詞で、選択肢を並べる文脈には合わない。","but は逆接を表す接続詞で、文意に合わない。","and は単純な追加を表し、選択肢を示す文脈には合わない。","or は2つの選択肢「対面で提出するか、郵送するか」を正しくつなぐ。"]},

{id:341,category:"接続詞",sentence:"The proposal was rejected, ___ the committee felt it lacked sufficient financial detail.",choices:["so","and","but","for"],answer:3,
 point:"理由を表す等位接続詞として for（「なぜなら」）がフォーマルな文脈で使われます。",
 notes:["so は結果を表す接続詞で、文意が逆になり不適切。","and は単純な追加を表し、理由を表せない。","but は逆接を表す接続詞で、文意に合わない。","for は「なぜなら」という理由を表す等位接続詞として正しく使われる。"]},

{id:342,category:"接続詞",sentence:"___ the budget is approved, the renovation project cannot begin.",choices:["Because","Although","So that","Unless"],answer:3,
 point:"「〜しない限り」という条件を表すには接続詞 unless が使われます。",
 notes:["Because は理由を表す接続詞で、文意に合わない。","Although は譲歩を表す接続詞で、文意に合わない。","So that は目的を表す接続詞で、文頭でこの文脈には使わない。","Unless は「予算が承認されない限り」という条件を正しく表す。"]},

{id:343,category:"接続詞",sentence:"The technician checked the wiring carefully ___ nothing had been damaged during installation.",choices:["so","because","in order to","to make sure"],answer:3,
 point:"「〜であることを確認するために」という目的を表すには to make sure (that) ~ の形が使われます。",
 notes:["so は単独では目的を表す接続詞として使えない（so that の形が必要）。","because は理由を表す接続詞で、目的を表す文意に合わない。","in order to の後には動詞の原形が続く必要があり、後ろに節（nothing had been damaged）を続けることができない。","to make sure は後ろに（that）節を伴い「〜であることを確認するために」という目的を正しく表す。"]},

{id:344,category:"接続詞",sentence:"The report must be revised ___ it does not yet meet the client's requirements.",choices:["although","unless","so that","as"],answer:3,
 point:"as には「〜なので」という理由を表す接続詞としての用法があります。",
 notes:["although は譲歩を表す接続詞で、文意に合わない。","unless は条件を表す接続詞で、文意に合わない。","so that は目的を表す接続詞で、文意に合わない。","as は「〜なので」という理由を正しく表す。"]},

{id:345,category:"接続詞",sentence:"___ the negotiations continue, the two companies remain committed to reaching an agreement.",choices:["Unless","Because","So that","While"],answer:3,
 point:"「〜する間」という継続中の状況を表すには接続詞 while が使われます。",
 notes:["Unless は条件を表す接続詞で、文意に合わない。","Because は理由を表す接続詞で、文意に合わない。","So that は目的を表す接続詞で、文頭のこの位置には合わない。","While は「交渉が続く間」という継続中の状況を正しく表す。"]},

{id:346,category:"関係詞",sentence:"The employee ___ proposal won the innovation award has been promoted to team leader.",choices:["who","which","that","whose"],answer:3,
 point:"先行詞 employee（人）と後ろの名詞 proposal の所有関係を表すには所有格の関係代名詞 whose が使われます。",
